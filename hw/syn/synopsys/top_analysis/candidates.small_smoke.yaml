include:
  instances:
    - pattern: vortex/g_clusters[0].cluster/g_sockets[0].socket/g_cores[0].core/mem_unit/local_mem/req_xbar
      required: true

minimum_total_area_um2: 0.0
allow_nested: false

pnr:
  strategy: bracket_bisection
  max_attempts: 2
  initial_area_scale: 1.0
  bracket_factor: 2.0
  relative_area_tolerance: 0.02
  min_area_scale: 0.25
  max_area_scale: 4.0
  target_utilization: from_report
  aspect_ratio: from_report
  boundary_margin: 1.0
  width_grid: 0.1
  height_grid: 0.1
  max_routing_drc_errors: 0
