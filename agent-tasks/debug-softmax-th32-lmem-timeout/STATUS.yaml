pitfalls:
  - build/sim/xrt_vcs is not the generated directory in this tree; the active logs are under build/sim/xrtsim_vcs.
  - The rev1 log ends at a UCLI prompt and its mtime stopped advancing, so it is not a healthy simulation still making progress.
  - Sourcing the thread-32 config does not select kernel.rev1.cpp; set SOFTMAX_VARIANT=rev1 and confirm the program prints Variant: rev1 and Block: [128, 1, 1].
  - The rev1 reduction assumes a power-of-two block size. The requested NUM_THREADS=32, NUM_WARPS=4 configuration produces 128 threads and satisfies that assumption.
  - The thread-32 config differs from thread-16 in two dimensions: NUM_THREADS=32 and both LMEM Omega macros are enabled, so the current run does not isolate thread count.
  - simv.log is 5.4 GB because assertions continue firing every cycle after the first timeout; use bounded searches and the first error only.
  - X values on inactive response data are normal, but mem_rsp_mask contains X at 437645000 ps and 437845000-437855000 ps while mem_rsp_valid=1 and mem_rsp_ready=1, which is functional corruption.
