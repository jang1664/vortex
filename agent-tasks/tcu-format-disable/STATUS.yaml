    status: compile_error
    error_summary: "VCS elaborated the RTL but GCC 14 failed compiling generated rmapats.c."
    root_cause: "One compiler environment cannot serve both stages: VCS-generated C expects the supported system GCC, while Ramulator requires a C++20 compiler."
    fix_applied: "Separated the compiler environments: system GCC for VCS simv and gcc-toolset-14 for Ramulator/application builds."
    lesson: "Keep the VCS simv compiler toolchain separate from the Ramulator/XRT C++20 toolchain."
  - iteration: 5
    timestamp: "2026-07-15 12:25"
    status: compile_error
    error_summary: "The valid simv launched and the host app compiled, but the configured device clang++ path did not exist."
    root_cause: "The configured --tooldir=/opt/vortex expects /opt/vortex/llvm-vortex/bin/clang++, which is unavailable in the current environment."
    fix_applied: "Installed the official Vortex v2.3 CentOS 7 prebuilt toolchain under $HOME/tools/vortex and overrode TOOLDIR for verification."
    lesson: "Blackbox application builds require the Vortex device compiler in addition to the host and simulator toolchains."
  - iteration: 6
    timestamp: "2026-07-15 12:30"
    status: compile_error
    error_summary: "The device compiler ran, but kernel linking failed because build/kernel/libvortex.a was absent."
