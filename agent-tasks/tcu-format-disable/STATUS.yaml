    status: compile_error
    error_summary: "VCS completed RTL compile/elaboration, but host linking failed because softfloat.a was missing."
    root_cause: "The third_party SoftFloat static library prerequisite had not been built."
    fix_applied: "Built the repository SoftFloat target and reran the unchanged FP16-only case."
    lesson: "xrt_vcs links SoftFloat into simv even when the target RTL compiled successfully; verify this prerequisite before blackbox runs."
  - iteration: 2
    timestamp: "2026-07-15 12:13"
    status: compile_error
    error_summary: "VCS simv was ready, but applib compilation could not find spdlog/spdlog.h from Ramulator."
