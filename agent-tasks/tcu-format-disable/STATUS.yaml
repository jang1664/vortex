    fix_applied: "Built Ramulator and its dependencies with gcc-toolset-14, which provides the required C++20 support."
    lesson: "xrt_vcs requires both the RTL simv dependencies and the Ramulator-backed application library dependencies."
  - iteration: 3
    timestamp: "2026-07-15 12:19"
    status: sim_fail
    error_summary: "The wrapper could not launch simv because it was a non-executable zero-byte file."
    root_cause: "The failed iteration 1 VCS link left a stale zero-byte simv whose timestamp caused make to skip relinking it."
    fix_applied: "Removed only the stale generated simv and relinked it with the supported system GCC toolchain."
    lesson: "After a failed VCS link, validate the simv file size and executable bit before relying on make's up-to-date decision."
