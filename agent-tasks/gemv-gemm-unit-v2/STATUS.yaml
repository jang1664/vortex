  - iteration: 5
    test: gemm_node_improve
    status: compile_fail
    error_summary: "Host DPI compilation could not find generated VX_config.h."
    root_cause: "The formal command targeted the source-tree unittest. Its Makefile derives ROOT_DIR for configured-build placement, so the source-tree invocation produced an invalid include root and could not see the existing generated build/hw/VX_config.h."
    fix_applied: "No RTL or source Makefile change is required. Refresh the configured build tree so the V2 unittest Makefiles/directories are generated, then run verification against build/hw/unittest/gemm_node_improve."
    lesson: "Vortex RTL unittests depend on configure-generated headers and Makefiles; verify_rtl must target the configured build-tree unittest rather than its source template."
  - iteration: 6
    test: gemm_node_improve_configured_build
    status: sim_fail
    error_summary: "The configured-build simulation produced no error text or log output before verify_rtl.py's 600-second run timeout."
    root_cause: "The parameter-free runner selected the large default M=256/N=1024/K=256 workload. A retained successful log for that exact shape records 4770 seconds of wall time, far beyond verify_rtl.py's 600-second limit; the timeout was workload-driven rather than a V2 deadlock."
    fix_applied: "No RTL change. Re-ran the configured build with explicit minimum legal M=32/N=32/K=32 parameters and +NO_WAVE; it completed in three seconds and exposed the separate iteration 8 numerical baseline issue."
    lesson: "Focused node smoke tests must specify a legal small shape and disable wave dumping; the parameter-free defaults are a long regression workload, not a 600-second smoke test."
  - iteration: 7
