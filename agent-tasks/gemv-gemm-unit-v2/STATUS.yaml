    root_cause: "The all-zero M32/N32/K32 failure is a documented pre-V2 gemm_node_improve baseline defect that reproduced with the former improve unit; it is not causally attributable to V2."
    fix_applied: "No production change. Use the historically green M32/N32/K128 strict accumulation case to assess V2 node integration."
    lesson: "A pre-existing failing workload cannot identify a regression; integration must be judged against a known-green numerical baseline."
