iterations:
  - iteration: 1
    test: gemm_unit_v2
    status: sim_fail
    error_summary: "QROW/reg1 non-zero load and accumulate produced zero data on multiple lanes, and the TB observed too few last_write pulses."
    root_cause: "TB request/reset drivers changed signals in the same posedge active region sampled by the DUT, so scale/zero/packet values raced. The reset branch also cleared the lifetime last_write counter immediately before its final check."
    fix_applied: "Moved request data/valid changes and reset deassertion to negedges, kept back-to-back packets stable across each accepting posedge, retained last_write_count across reset, and strengthened the expected completion count to exactly eight."
    lesson: "Clocked DUT stimulus must be stable before the accepting edge; lifetime counters used to validate reset behavior must not clear on the reset under test."
  - iteration: 2
    test: gemm_unit_v2
    status: pass
    error_summary: ""
    root_cause: ""
    fix_applied: "No additional change required after the iteration 1 testbench fix."
    lesson: "The standalone V2 pipeline, scheduler boundary cases, arithmetic modes, metadata alignment, reset behavior, and fixed-latency completion all pass the formal VCS unittest."
  - iteration: 3
    test: gemm_node_improve
    status: compile_fail
    error_summary: "The node testbench still referenced the removed V1 instance hierarchy u_VX_gemm_unit.acc_mem_wr_en and u_VX_gemm_unit.in_pipe_valid_out."
    root_cause: "VX_gemm_node migrated to u_VX_gemm_unit_v2, but the node testbench's write/input monitors and optional dual-bank checker still observed the V1 instance. VCS stopped after ten XMREs, masking additional stale references to the removed V1 FIFO, credit, and scheduler signals."
    fix_applied: "Mapped ACC write and input-pipe probes to the equivalent V2 hierarchy. Replaced the V1 FIFO-specific optional checker with a four-physical-bank V2 checker that balances nominal/early read requests, one-cycle SRAM responses, and accumulator consumes while retaining collision, early-hold underflow, pending-response, and pipeline-drain checks."
    lesson: "Hierarchical verification probes are part of an RTL interface migration. When an architecture intentionally removes a FIFO scheduler, its checker must be translated to the new request/response/consume invariants rather than only renaming the instance or deleting coverage."
  - iteration: 4
    test: gemm_unit_v1_regression
    status: pass
    error_summary: ""
    root_cause: ""
    fix_applied: "No change required."
