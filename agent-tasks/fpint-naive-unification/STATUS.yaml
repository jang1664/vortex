pitfalls:
  - >
    The current local DMA waits in TOP_SYNC after data drain, while the old
    naive controller emits synchronization separately. GEMM_NAIVE must bypass
    TOP_SYNC or the naive command stream can hang.
  - >
    GEMM unittests use explicit RTL lists and historically did not all forward
    sourced CONFIGS into VCS defines. A passing build without GEMM_NAIVE is not
    evidence for the naive topology.
  - >
    Configure-generated build Makefiles can be stale after source-tree edits.
    Reconfigure or deliberately use the refreshed generated copy before tests.
  - >
    The cvfpu parent submodule initially lacked its nested common_cells sources.
    The pinned dependency is now initialized; the original prerequisite errors
    remain saved as compile_missing_cvfpu.log in both verification builds.
  - >
    The optimized GEMM unit uses two generated accumulator read FIFOs. Any
    diagnostic hierarchy in the testbench must address gen_acc_rd_fifo[0/1]
    rather than the historical singleton u_acc_rd_fifo path.
  - >
    VCS does not permit procedural runtime indexing into arrays of interfaces.
    Per-lane interface initialization must use constant genvar indices.
  - >
    The existing improve gemm_node_improve M32/N32/K32 test currently writes
    all-zero accumulators and fails 1024/1024 outputs even when CONFIGS is
    absent and when fpnew is available. This is a baseline node-test failure,
    not evidence that GEMM_NAIVE altered the improve RTL branch.
  - >
    sim/xrtsim_vcs does not key the simv target on CONFIGS. Switching improve
    and naive CONFIGS in one build directory can silently reuse the previous
    mode's binary; verification must use separate build outputs or explicitly
    force a safe rebuild.
