pitfalls:
  - Preserve all existing prototype changes in this dirty worktree; they are the starting point, not disposable generated output.
  - Do not silently reinterpret the specialized funct3 encodings in only one implementation layer.
  - Keep softmax/rev2 unchanged as the baseline control.
  - Do not claim queue timing or blocking correctness from simx alone.
  - A naive per-thread shadow plus active implementation is likely to exceed the Phase 7 four-BRAM36 storage gate before banking overhead; treat synthesis storage as an unresolved post-functional optimization gate.
  - Do not reintroduce the removed specialized wrappers; compatibility aliases would silently reinterpret old funct7 0x05 store instructions as LD1.
  - Dedicated EX_AGEN prevents an empty POP from occupying another execution unit, but an indefinitely blocked POP can fill the existing two-entry AGEN dispatch buffer and indirectly stall its issue slice; the absolute no-cross-unit-HOL invariant needs pipeline-level resolution before final integration.
