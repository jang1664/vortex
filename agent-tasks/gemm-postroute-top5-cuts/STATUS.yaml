    fix_applied: >-
      Compare Weight consume outputs against sync_regs_q. Update the affected
      positive tests to observe the registered command-stage/prepare boundary
      and to generate only protocol-legal prepared releases and responses.
    lesson: >-
      Timing cuts that replace defensive ready feedback with interface
      contracts require assertions and directed tests to move to the same
      registered/protocol boundary.
