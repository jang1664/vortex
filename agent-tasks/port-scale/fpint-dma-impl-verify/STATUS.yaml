gaps:
  - id: GAP-1
    status: DONE
    title: "VX_tmem_subsystem: DMA ch0 switch workaround → 8-ch 1:1 direct"
    file: hw/rtl/mem/VX_tmem_subsystem.sv
    note: "Implemented. u_switch_dma removed, direct 1:1 wiring with tag adaptation."

  - id: GAP-2
    status: FIX_NEEDED
    title: "VX_gemm_tmem_dma_ctrl: wrong HBM address decomposition (>>3)"
    file: hw/rtl/core/gemm/VX_gemm_tmem_dma_ctrl.sv
    lines: "125-130 (ch_src_base, ch_src_s0, ch_dst_base, ch_dst_s0)"
    root_cause: |
      All 8 channels get the SAME src_base = (src_base >> 3), which:
      (a) divides the HBM byte address by 8, producing wrong AXI address
          (e.g., 0x10c00 → 0x2180 → sim reads wrong RAM location)
      (b) all channels read from identical address → duplicate data, not
          each channel's interleaved portion
      The >>3 was originally meant to decompose across 8 channels but was
      applied incorrectly to HBM src addresses.
    fix_plan: |
      Per-channel decomposition for INTERLEAVE=1, 8-bank, 64B-block:
        ch_src_base[ch] = src_base + ch*64   (full HBM byte addr, per-channel offset)
        ch_dst_base[ch] = dst_base >> 3       (bank-local, correct for 512-aligned TMEM)
        ch_seg_size     = 64                  (one bus word per DMA segment)
        ch_bnd0[ch]     = words_quot + (ch < words_rem)  (blocks per channel)
        ch_src_s0       = 512                 (= 8*64B stride between channel's blocks)
        ch_dst_s0       = 64                  (contiguous in bank)
        ch_bnd1         = original bnd0       (for multi-segment, currently always 1)
        ch_src_s1       = original src_s0     (stride between segments)
        ch_dst_s1       = original dst_s0 >> 3  (bank-local stride)

  - id: GAP-3
    status: NOT_NEEDED
    title: "VX_dma_engine: HBM address remap"
    note: |
      VX_axi_adapter with NUM_BANKS_OUT=1, INTERLEAVE=0 does simple passthrough:
      AXI_byte_addr = word_addr << 6 = original byte addr.
      No remap needed — gemm_dma_ctrl provides correct per-channel HBM addresses.

  - id: GAP-4
    status: NO_CHANGES_NEEDED
    title: "SW impact assessment"
    files:
      - sim/xrtsim_vcs/xrt_sim_vcs.cpp
      - tests/regression/fpint_gemm_ffn_hw_improve/kernel.cpp
    analysis: |
      - xrt_sim_vcs.cpp: AXI event handler (process_axi_events, line 322-332)
        already uses pkt.addr directly for RAM access. to_software_addr() is only
        used for host mem_write/mem_read API (line 155, 165), NOT for AXI events.
        No changes needed in sim.
      - [CORRECTED] Previous handoff incorrectly identified to_software_addr as
        the root cause. The actual issue is in gemm_dma_ctrl RTL (GAP-2).
      - kernel.cpp, runtime/host: No changes needed.

pitfalls:
  - ">>3 byte-level decomposition WRONG for sub-bus-word transfers. Scale/ZP data (256B) divided by 8 gives 32B per channel, but TMEM bus word is 64B. Must decompose at bus-word granularity, not byte granularity."
  - ">>3 on HBM src_base is WRONG. Divides HBM byte address by 8, all channels get same wrong address. Must use per-channel src_base = src_base + ch*64."
  - "[CORRECTED] Handoff incorrectly blamed xrt_sim_vcs.cpp::to_software_addr. That function is only used for host mem_write/mem_read API, NOT AXI events. AXI events use pkt.addr directly (line 332). The real issue is gemm_dma_ctrl >>3 on src_base."
  - "done_if.ready race condition: must be asserted during BOTH S_WAIT_DONE and S_DONE. If only S_WAIT_DONE, channels whose done handshake overlaps with the state transition get stuck, deadlocking subsequent DMA commands."
  - "VCS simv Makefile은 TB/DPI만 dependency. RTL 변경 후 반드시 make clean."
  - "RTL Implementation subagent가 파일 수정 시 기존 uncommitted 변경을 revert할 수 있음. 항상 grep으로 검증."
  - "xprop 디버깅: $display probe 반복 대신 FSDB + pywellen으로 persistently-X 신호를 먼저 찾을 것."
  - "[SUPERSEDED] DMA ch N → bank N 직접 연결이 spec 기준 정답. gemm_dma_ctrl가 bank-local 주소를 미리 계산하므로 switch 불필요."
  - "TMEM BANK_SIZE=4KB는 double-buffered tile layout(~160KB)에 부족. BANK_SIZE ≥ 20KB 필요."
  - "VX_gemm_node.sv에서 BANK_SIZE를 explicit override하므로 default만 바꾸면 안 됨."
  - "DMA tag width: bank expects SWITCH_TAG_WIDTH (TAG_WIDTH + BANK_SEL_BITS). Direct DMA connection must pad/truncate tags."
  - "VX_axi_adapter in VX_dma_engine uses NUM_BANKS_OUT=1, INTERLEAVE=0 (default). AXI addr = word_addr << 6 = byte_addr. No address remap in adapter."

