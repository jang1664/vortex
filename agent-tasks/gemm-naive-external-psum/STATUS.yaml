task: gemm-naive-external-psum
state: COMPLETE
updated: "2026-07-28 01:33"
pitfalls:
  - "A GEMM accumulation cycle can issue one PSUM read and one PSUM write; a single shared external request channel would add back-pressure and violates the agreed GEMM-unit contract."
  - "The ACC read FIFO previously inferred response-valid one cycle after request acceptance. External LMEM requires FIFO push and bank selection from the actual response valid/tag."
  - "A forced xrt-vcs rebuild is required; the blackbox wrapper otherwise reuses an existing simv."
  - "VCS incremental compilation did not rebuild indirectly discovered modules after CONFIGS/source changes. A clean elaboration was obtained by moving csrc, simv.daidir, and simv to timestamped backup paths before rebuilding."
  - "The sxbar_f16 config initially differed from the baseline in FP ABI flags as well as request routing. EXT_D_DISABLE/EXT_ZFH_ENABLE were removed so LMEM_REQ_OMEGA_ENABLE is the only relevant request-path difference."
