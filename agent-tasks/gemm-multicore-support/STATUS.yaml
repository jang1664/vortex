  - timestamp: "2026-07-14 13:37"
    status: ready_for_review
    attempted: Ran improve and naive xrt-vcs integration on a four-core RTL device with two active N partitions and two inactive cores.
    result: Both applications passed full output comparison; exact four-active-core xrt-vcs remains a long-running verification item because each active core must process at least one 128 x 128 tile with full FSDB enabled.
    learned: M=1, N=160 is the smallest useful xrt-vcs integration shape for proving concurrent global-N partitioning while keeping the four-core device configuration.
  - timestamp: "2026-07-14 14:31"
    status: ready_for_review
    attempted: Added asynchronous simx GEMM traffic, distinct cache and cache-bypass paths, per-channel/core contention, direct-write completion responses, and per-core GEMM performance reporting.
    result: Naive and improve pass one-core and exact four-core 256x256x128 output comparison while reporting traffic on only their intended memory paths.
    learned: Naive uses compile-time 128x128x128 DMA tiles and the cache hierarchy; improve uses descriptor tile sizes and NUM_DMA_CHANNELS direct-memory ports. The tested improve configuration saturates shared DRAM bandwidth at four cores.
  - timestamp: "2026-07-14 15:15"
    status: ready_for_review
    attempted: Compared fresh simx and xrt-vcs-sim builds using matching GEMM shapes and backend configurations, with summed per-core descriptor cycles as the common metric.
    result: All comparisons passed output validation. Improve underpredicts RTL by 46.1-59.0% for one core and 10.0% for the four-core/two-active-core boundary; naive underpredicts by 88.7-93.5%.
    learned: The improve bypass traffic model captures the multi-core boundary reasonably, while both backends still omit RTL controller, DMA programming, pipeline fill/drain, and full MXU execution costs; these omissions dominate naive timing.
  - timestamp: "2026-07-14 16:10"
    status: ready_for_review
    attempted: Added compile-time FSDB suppression and compared two remainder-free four-core partitions with all cores active.
    result: DISABLE_FSDB prevents waveform creation even when FSDB_DUMP is set. Improve overpredicts aggregate RTL cycles by 89.9-102.5%; naive underpredicts by 63.1-78.2% on 8x512x32 and 8x1024x32.
    learned: Equal per-core traffic exposes excessive serialization in the improve shared-DRAM model, while naive still lacks most RTL DMA and controller latency.
