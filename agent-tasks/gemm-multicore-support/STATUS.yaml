remaining_work:
  - Run a full 128x128 tile per core xrt-vcs case in a batch environment; DISABLE_FSDB removes waveform I/O, but the RTL workload still exceeds the interactive verification budget.
  - Calibrate simx block-level compute and DMA issue costs against RTL counters if cycle-level prediction, rather than relative cache/bypass contention studies, becomes a requirement.
pitfalls:
  - The primary checkout has an unrelated modification to ci/fpga_bin_alias_map.yaml; do not modify, copy, or revert it.
  - Checked-in config scripts must remain at NUM_CORES=1; four-core verification uses overrides only.
  - The VCS simulator must be cleaned and rebuilt after RTL changes because its Makefile does not track RTL dependencies.
  - Standalone VCS unittest Makefiles also reuse stale simv after RTL changes; run their clean target before recompilation.
  - gemm_node_improve clean does not remove simv_fpnew or compile_fpnew; move those artifacts aside before a required RTL rebuild.
  - Do not run blackbox.sh directly; use ci/run_black.sh from a configured build directory.
  - The improve RTL unit test does not produce valid output for K=32 in either single or partitioned mode; use K=128 for focused RTL verification.
  - Use --configs-extra '-DDISABLE_FSDB' to suppress FSDB generation; omit --debug entirely for non-debug runs because --debug 0 still enables DBG_TRACE defines.
  - A 256 x 256 grid assigns one full 128 x 128 tile to each core and remains expensive even without FSDB; 8 x 512 activates all four cores with equal 8 x 128 partitions and completes quickly.
  - Simx GEMM timing is a cache-line traffic and contention model; functional output remains computed eagerly, while descriptor completion is delayed until modeled compute and memory work finish.
