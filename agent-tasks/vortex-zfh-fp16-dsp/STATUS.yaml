pitfalls:
  - "The current DSP interface receives an overloaded legacy two-bit format and therefore loses the FP16 format."
  - "Existing xil_f16add/xil_f16mul IPs serve GEMM modules and are not sufficient for the scalar FPU."
  - "FP16 divide, square root, and H/S conversions have different maximum Vivado latencies from the existing FP32 units."
  - "Xilinx IP names are manually repeated in VCS, synthesis, and XRT packaging files."
  - "The core_top verifier does not compile the generated Xilinx VHDL IP libraries and therefore reports unresolved IP modules for any VIVADO/FPU_DSP build."
