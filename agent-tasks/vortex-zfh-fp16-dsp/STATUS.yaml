    fix_applied: "n/a"
    lesson: "The IP-aware DSP/Vivado path now passes arithmetic, div/sqrt, FMA, H/S and integer conversions, NCP operations, rounding, and signed-zero cases in one end-to-end regression."
  - iteration: 5
    status: SIM_FAIL
    test: "FPNEW fp16_zfh compatibility plus no-Zfh legacy FP32 DSP/Vivado basic blackbox"
    error_summary: "Legacy FP32 DSP/Vivado basic passed, but the newly expanded FPNEW fp16_zfh run mismatched negative/zero sqrt, FMA, and min results in two rows."
    root_cause: "VX_fpu_fpnew instantiated independent per-lane cores but used only lane 0 ready/valid/tag; lane-dependent SQRT special-case latency allowed other lanes to advance and mix responses from later FMA/MIN instructions."
    fix_applied: "Added one-request-in-flight tracking and all-lane request/response ready-valid barriers so every lane holds and retires the same tagged operation together."
    lesson: "The earlier FPNEW regression covered add/mul/compare/H-S conversion only; expanding DSP coverage also exposed previously untested FPNEW Zfh operations."
  - iteration: 6
    status: SIM_FAIL
    test: "source ../configs/rv64_zfh_lp64f_fpnew.sh && ci/run_black.sh xrt-vcs-sim --app fp16_zfh"
    error_summary: "The fresh FPNEW build entered X-state assertion flooding before kernel completion; the FPU tag allocator attempted to release an unknown tag."
    root_cause: "The all-lane valid reduction exposed idle/reset X values before any request was pending; partial per-lane request acceptance also needed tracking while upstream held one request."
    fix_applied: "Qualified combined response valid/ready with reset and pending state, and added a per-lane accepted bitmap so each lane accepts the held request exactly once before aggregate upstream ready."
    lesson: "A reduction across independent lane valid signals must be explicitly qualified by reset/request-pending state under VCS xprop."
  - iteration: 7
    status: SIM_FAIL
    test: "source ../configs/rv64_zfh_lp64f_fpnew.sh && ci/run_black.sh xrt-vcs-sim --app fp16_zfh"
    error_summary: "The X-valued tag release disappeared, but the first fmv.w.x remained in the scoreboard until timeout and caused assertion flooding."
    root_cause: "The per-lane fanout consumed request data before the outer ready/valid handshake committed the tag-store transaction. Direct atomic gating is impossible because pinned cvfpu defines ready as valid-dependent."
    fix_applied: "Inserted a one-entry registered FPNEW request buffer, committing and stabilizing the outer tag/control/operands before per-lane fanout; retained the accepted bitmap only behind that buffer."
    lesson: "Eliminating idle-X propagation is insufficient; the lane barrier must preserve FPnew's valid/ready contract without partial-accept deadlock."
  - iteration: 8
    status: SIM_FAIL
    test: "source ../configs/rv64_zfh_lp64f_fpnew.sh && ci/run_black.sh xrt-vcs-sim --app fp16_zfh"
    error_summary: "The registered request buffer preserved the tag transaction, but FP16 ADD deadlocked before request acceptance and eventually caused the same scoreboard timeout."
    root_cause: "FPNEW ADDMUL PipeRegs assigned latency only to FP32; FP16 had zero pipeline stages. Its combinational output became valid while input ready depended on output ready, but the wrapper withheld output ready until pending was set by input acceptance, forming a cycle."
    fix_applied: "Assigned LATENCY_FMA to FP16 ADDMUL when Zfh is enabled and to FP64 only when D is enabled; disabled/unsupported formats remain zero-stage."
    lesson: "Format-indexed fpnew pipeline configuration must explicitly include FP16; a zero-stage unit cannot sit behind pending-gated output readiness."
  - iteration: 9
    status: SIM_FAIL
    test: "source ../configs/rv64_zfh_lp64f_fpnew.sh && ci/run_black.sh xrt-vcs-sim --app fp16_zfh"
    error_summary: "Adding the FP16 ADDMUL pipeline removed the zero-stage deadlock but the experimental FPNEW barrier again released an unknown tag and flooded assertions before completion."
    root_cause: "The attempt to retrofit lockstep retirement onto the pre-existing independent FPNEW lane wrapper remains incompatible with its tag/allocator handshake and exceeds the DSP-focused task scope."
    fix_applied: "Restored the pre-existing FPNEW lane-0 retirement wrapper while retaining Zfh format transport; kept enhanced div/sqrt/FMA/min/class/W-conversion coverage DSP-specific and baseline cross-backend checks common."
    lesson: "A correct FPNEW multi-lane retirement redesign is a separate architectural task and should not be coupled to enabling the Xilinx DSP backend."
