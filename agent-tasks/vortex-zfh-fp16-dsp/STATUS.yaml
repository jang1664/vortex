    status: COMPILE_ERROR
    test: "source configs/rv64_zfh_lp64f_dsp_vivado.sh && python tools/verify_rtl.py unittest --path build_zfh_dsp_vivado/hw/unittest/core_top --sim vcs"
    error_summary: "The core_top Verilator harness could not resolve the generated Xilinx floating-point IP modules."
    root_cause: "core_top compiles SystemVerilog sources without the xrtsim_vcs VHDL IP library flow, so a VIVADO/FPU_DSP elaboration cannot resolve either existing FP32 or new FP16 Xilinx modules."
    fix_applied: "Confirmed the target limitation and moved verification to the repository's IP-aware xrt-vcs-sim flow; also corrected the H/S converter wrapper TUSER width from three bits to two."
    lesson: "The generic core_top verifier is not an appropriate compile target for a Vivado DSP configuration unless it imports the generated Xilinx VHDL libraries."
  - iteration: 2
    status: COMPILE_ERROR
    test: "source ../configs/rv64_zfh_lp64f_dsp_vivado.sh && ci/run_black.sh xrt-vcs-sim --app fp16_zfh"
    error_summary: "VCS and every Xilinx VHDL wrapper compiled and linked, but applib C++ compilation rejected a generated VX_config.h line containing bare 'elsif'."
    root_cause: "The Verilog-to-C configuration header conversion handles `ifdef/`ifndef/`else/`endif but did not translate the newly introduced `elsif directives."
    fix_applied: "Rewrote the backend validation using nested ifdef/ifndef/else/endif directives and statically checked generated C/C++ preprocessing for DSP/Vivado, FPNEW, and default configurations."
    lesson: "VX_config.vh validation logic must avoid `elsif because the same source is mechanically translated into a host C/C++ header."
  - iteration: 3
    status: SIM_FAIL
    test: "source ../configs/rv64_zfh_lp64f_dsp_vivado.sh && ci/run_black.sh xrt-vcs-sim --app fp16_zfh"
    error_summary: "RTL execution completed with one mismatch at the +0/-0 input: fmul.h returned +0 instead of -0 and fcvt.w.h returned INT_MAX instead of zero."
    root_cause: "FMA-backed multiply used a positive-zero addend, changing an exact negative-zero product to positive zero under RNE. Separately, zero mantissas fed an LZC shift into FCVT overflow detection and selected integer saturation."
    fix_applied: "Gave the multiply FMA zero addend the product sign for FP16 and FP32, clarified integer/FP sign and mantissa signals, and suppressed FCVT overflow when the mantissa is zero."
    lesson: "Special-value coverage exposed correctness issues that normal finite FP16 arithmetic did not exercise."
  - iteration: 4
    status: PASS
    test: "source ../configs/rv64_zfh_lp64f_dsp_vivado.sh && ci/run_black.sh xrt-vcs-sim --app fp16_zfh"
    error_summary: "none"
