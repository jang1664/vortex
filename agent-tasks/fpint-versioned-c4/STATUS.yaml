    message: Inspected C4 arithmetic and prior 240-case artifacts. CUDA 12.8 and RTX 3090 are available. Implementing versioned models and tile-level exact checks.
  - timestamp: '2026-10-21 16:08'
    message: Python and actual CUDA match each other and all saved C4 RTL outputs and FP32 tile sums for 240 cases. Initial VCS compile failed because legacy prealign DEBUG inherits ref direction; pass an explicit bit variable instead of its literal default.
