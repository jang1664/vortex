    message: Four-way VCS/CUDA run passed 240 cases, 7680 FP16 outputs, and 74880 FP32 tile sums. Added explicit fixed-width zero negation/merge and started expanded 380-case run including K=128, large signed zero points, and random finite bit patterns. Eleven host tests passed.
  - timestamp: '2026-10-21 16:16'
    message: Final 380-case run passed all six pairs with zero mismatches for 12160 FP16 outputs and 114304 FP32 tile sums; 6080 initial writebacks also checked. Saved-result replay and existing v2 normal unittest passed. Legacy rerun reproduced prior CSV/stimulus bytes and all 240 input/Python arrays exactly, including the expected prior numerical failures. Model hashes match the tested sources. Documentation and results recorded; compute RTL unchanged.
artifacts:
  final: build_fpint_threeway_results/rtl_c4_v1_final
  legacy: build_fpint_threeway_results/legacy_version_regression
  report: agent-tasks/fpint-versioned-c4/RESULTS.md
  usage: hw/unittest/gemm_unit_v2/FPINT_COMPARE.md
pitfalls:
  - C4 uses VX_gemm_unit_v2, 16x16, 19 extra bits for both dot and zero correction.
  - QCOL directly rebiases zero/subnormal scale exponents; preserve this behavior in rtl-c4-v1.
  - First load bypasses FP32 addition; adding an explicit zero can change signed-zero bits.
  - Legacy QROW accumulates in FP64 and legacy SV narrowing is not RNE.
  - Legacy SV prealign DEBUG is implicitly ref; calling without an explicit bit variable fails VCS compilation.
  - C4 zero_regs stores negated zero points in 16 bits and MERGE_OUT_BW is 40; preserve both widths in the frozen model.
