task: fpint-versioned-c4
state: complete
objective: Add explicit legacy and rtl-c4-v1 model selection and verify SV/Python/CUDA against unchanged C4 RTL.
constraints:
  - Preserve legacy entry points and arithmetic.
  - Reproduce current RTL including QCOL exponent-zero scale rebias.
  - Exclude NaN, Inf, and overflow; include signed zero, subnormals, and underflow.
  - Run actual CUDA kernels and configured C4 VCS simulation.
