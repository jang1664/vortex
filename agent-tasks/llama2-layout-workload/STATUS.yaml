pitfalls:
  - >
    Do not assume GEMM outputs can feed later GEMM operands directly. GEMM
    kernels are not layout-fused, so incompatible GEMM-to-GEMM boundaries need
    explicit standalone layout bridge cases.
  - >
    attn_pv does not feed o_proj directly. It first goes through head-wise
    concat; layout modeling must attach the o_proj input bridge after concat.
