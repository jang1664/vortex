pitfalls:
  - "Do not let inactive GEMM cores return before the producer fence and global barrier; every configured core must participate to avoid deadlock."
  - "Do not publish a GEMM descriptor before all producer cores have crossed the post-fence global barrier."
  - "Do not run this app without ENABLE_GEMM_ACCEL; otherwise descriptor allocation reads the unmapped/default MMIO response and reports STATUS_ALLOC_FAIL."
  - "A full 128x128 FP16 vector stage is very slow in xrt-vcs; use a supported partial M/K shape for focused ordering checks."
