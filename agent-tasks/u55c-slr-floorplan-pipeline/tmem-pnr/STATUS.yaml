pitfalls:
  - Do not retry automatically or change RTL/directives after a failed run.
  - A routing-success result is not timing signoff; check final setup and hold.
  - Existing user and other users' hardware runs must not be interrupted.
  - Vitis can produce xclbin files with an achieved frequency below the requested 100 MHz; exit code 0 does not establish target timing closure.
  - Optional report-copy failures were ignored by the Makefile; use the existing implementation reports rather than treating these warnings as a PnR failure.
