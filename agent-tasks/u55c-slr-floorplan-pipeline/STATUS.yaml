pitfalls:
  - A successful v++/make exit and generated xclbin do not prove the requested kernel frequency; inspect automatic frequency scaling and xclbin.info achieved frequency. slr_v7 succeeds at78.4MHz while failing100MHz setup.
  - A direct inter-SLR FF pair does not solve high-fanout distribution after the receiving FF. The final slr_v7 top five data paths are SLR2-local Weight selection fanout4034, despite a clock-leg SLR Crossing label.
  - get_slrs -of_objects also requires typed get_cells objects; a raw-name query can silently return empty under -quiet. Comparing two empty results on an unplaced checkpoint does not validate placed-cell lookup. Exercise known placed cells and require nonempty expected SLR results.
  - Vivado get_property returns a scalar for one object: an unset singleton PBLOCK is an empty string (llength0), whereas multi-object queries preserve empty list elements. Normalize singleton scalar values without relaxing resolved-object cardinality or adding per-leaf queries.
  - Actual Vivado primitive PARENT chains can include primitive containers such as DSP48E2 owning DSP_ALU_INST. IS_PRIMITIVE==0 hierarchy enumeration alone is not a complete parent graph; traverse primitive containers without selecting them as hierarchy anchors.
  - FP-only hierarchy anchors fix only one generated-cell family; TMEM arbiter reset helpers can independently form the same ROOT/user-pblock shape conflict during placement. Cover homogeneous ownership islands rather than enumerating individual failing registers.
  - Canonical NAME strings are not Vivado cell-object collections for get_property; resolve with get_cells and verify exact name/value correspondence. Raw property errors can expand a huge input list, so bound diagnostic console output.
  - Post-init leaf membership misses 512 opt-created ACC LUTs and later place-created reset helpers; refresh leaves and anchor only validated homogeneous IP hierarchies so shapes do not span ROOT and a hard user pblock.
  - Existing SIZE=1 launch buffer does not register reverse ready or bypass status.
  - Output bridge enqueue is not physical TMEM write commit.
  - Existing ACC d3 RAW and write-stall contracts must remain unchanged locally.
  - Historical opt_v6 results are not a merged functional or physical baseline.
  - Optional legacy DBG_TRACE_GEMM_CMD_PERF ledger rejects overlapping children in the unchanged baseline; excluded symmetrically from comparison instrumentation.
  - Preserve sink metadata independently before recycling a response RAM address; RAM output staging is separate ownership.
