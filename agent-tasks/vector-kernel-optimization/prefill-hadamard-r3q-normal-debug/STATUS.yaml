pitfalls:
  - "A single passing run cannot close a nondeterministic correctness failure; the exact large shape must pass repeatedly."
  - "The original failure is on real C4 hardware, so simulator-only success is not sufficient."
  - "vx_barrier with a participant count of one is explicitly a hardware no-op and does not provide local-scratch visibility."
  - "vx_fence follows the global/cache path after the LMEM switch; it cannot be treated as an explicit local-memory drain."
