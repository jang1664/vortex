task: vector-kernel-optimization
status: COMPLETE
started: "2026-07-12 19:14"
updated: "2026-07-24 14:42"
summary: "Completed C4 vector-kernel optimization; the Hadamard R3-Q LMEM bug is documented, its two-warp workaround is verified, and the default is intentionally restored to one warp for latency-only measurement."
log:
  - time: "2026-07-12 19:14"
    entry: "Started the ordered optimization loop: softmax, KV-cache quantize, dequantize, then remaining layout-fused kernels. Selected softmax opt_align as the first baseline and main.cpp FPGA cycles as the primary metric."
  - time: "2026-07-12 19:14"
    entry: "Reviewed partial hardware data. Attention layout conversion, KV-cache quantization, and softmax dominate the available vector-kernel results; dequantize has no usable measurement yet."
  - time: "2026-07-12 19:22"
    entry: "Measured the Makefile-default softmax rev1 decode baseline on naive_gemm_simd_th16_tcol32_hwexp_dcache: 3,325,181 cycles, 12,864,893 instructions, IPC 3.868930, correctness passed. The wrapper rebuilds the app using the Makefile default, so prebuilding opt_align alone is insufficient."
  - time: "2026-07-12 19:26"
    entry: "Existing opt_align measured 145,363 cycles but failed correctness with 58,539 errors and max absolute difference 1.499455. Rejected it as degenerate; row-1-first corruption suggests a multi-warp LMEM/DMA staging bug."
  - time: "2026-07-12 19:31"
    entry: "Added dma_row, which launches one warp per block while retaining pitched DMA, cached exponentials, and shuffle reductions. It passed hardware correctness but took 7,033,445 cycles, 2.12x slower than rev1, so it remains an experimental reference rather than the default."
  - time: "2026-07-12 19:36"
    entry: "Added dma_serial: four warps still compute four rows in parallel, but thread 0 performs each row DMA descriptor sequentially. Hardware correctness passed at 2,515,641 cycles, a 24.3% reduction from the 3,325,181-cycle rev1 baseline. Selected dma_serial as the current default pending prefill and edge verification."
  - time: "2026-07-12 19:39"
    entry: "dma_serial passed the masked partial-block/pitched-row edge shape B1/H1/Q3/K130 at 90,285 cycles."
  - time: "2026-07-12 19:42"
    entry: "dma_serial passed masked prefill B1/H1/Q2048/K2048 at 123,181,677 cycles. This may be slower than rev1, so a direct main.cpp rev1 prefill measurement is required before final promotion."
  - time: "2026-07-12 19:46"
    entry: "Direct rev1 main.cpp prefill measured 155,536,936 cycles. dma_serial is therefore 20.8% faster on prefill as well as 24.3% faster on decode. Promoted dma_serial to the softmax Makefile default."
  - time: "2026-07-12 19:53"
    entry: "For softmax_layout_fused, measured opt with the existing 64-thread launch at 3,196,292 decode cycles. Added opt_warp with the corrected 16-thread one-warp-per-row launch; it passed at 2,363,601 cycles, a 26.1% reduction."
  - time: "2026-07-12 19:58"
    entry: "softmax_layout_fused opt_warp passed masked prefill at 89,824,199 cycles versus opt at 139,200,932 cycles, a 35.5% reduction. Promoted opt_warp to the Makefile default. Softmax optimization pass is complete; KV-cache quantize is next."
  - time: "2026-07-12 20:12"
    entry: "Measured kv_cache_quant_w4a16 baseline B1-equivalent K2048/N128/QBLK128/QDIR1 at 289,624,222 cycles. Implemented the initial groupwise one-warp variant; its first build failed because NUM_THREADS requires VX_config.h, then added the missing generated-config include."
  - time: "2026-07-12 20:16"
    entry: "kv_cache_quant_w4a16 groupwise passed the primary K2048/N128/QBLK128/QDIR1 hardware case at 8,918,465 cycles versus 289,624,222 baseline cycles, a 96.9% reduction. QDIR0 and partial-group verification remain."
  - time: "2026-07-12 20:20"
    entry: "kv_cache_quant_w4a16 groupwise passed QDIR0 partial K-group K130/N34/Q32 and QDIR1 partial N-group K7/N130/Q32 hardware cases. Promoted groupwise to the default; dequantize is next."
  - time: "2026-07-12 20:26"
    entry: "Added kv_cache_dequant_w4a16 packed_pair. It processes both nibbles from one byte together, reuses a shared qparam when possible, and emits one aligned 32-bit FP16-pair store. Primary cycles improved from 7,811,805 to 7,486,701 (4.2%); QDIR0 partial shape also passed. Promoted packed_pair."
  - time: "2026-07-12 20:35"
    entry: "Tested kv_cache_quant_layout_fused_w4a16 qparam_warp. It passed correctness but regressed from 23,447,919 to 47,905,399 cycles and increased instructions from 96,995,644 to 135,503,932 because per-qparam layout decoding and control were replicated across all 16 lanes. Rejected it and retained baseline as default."
  - time: "2026-07-12 20:49"
    entry: "Added rope_layout_fused task_chunk16, hoisting flattened index decode and layout selection over 16 rotary pairs. It passed generation row-major at 737,174 versus 1,214,806 cycles (39.3%) and prefill row-major at 304,349,499 versus 560,571,693 cycles (45.7%). Fixed the variant Makefile to change VX_CFLAGS and prevent stale kernel reuse."
  - time: "2026-07-12 20:54"
    entry: "rope_layout_fused task_chunk16 passed a fully populated GEMM-W layout shape B1/S128/H4/D128. A one-token GEMM-W test exposed an existing host verification issue: unwritten output is compared against zero without initializing the VX_MEM_WRITE buffer. Promoted task_chunk16."
  - time: "2026-07-12 21:00"
    entry: "Added head_concat_layout_fused chunk16_packed. It decodes one (batch,sequence,head,chunk) task, computes tiled bases once, and copies eight aligned FP16 pairs. Primary prefill improved from 430,014,135 to 34,656,292 cycles (91.9%) with correctness passing. Promoted it."
  - time: "2026-07-12 21:07"
    entry: "Added eladd_layout_fused tile_chunk32, matching the GEMM-C microtile width so each task computes the tiled and row-major base once for 32 FP16 additions. Primary cycles improved from 305,897,032 to 198,749,359 (35.0%) with exact correctness. Promoted it."
  - time: "2026-07-12 21:12"
    entry: "Added rms_norm_layout_fused shuffle_warp. One warp now owns each row, uses shuffle reduction, computes reciprocal sqrt once, and uses no LMEM or block barriers. Fused cycles improved from 264,929,539 to 233,893,271 (11.7%) with plain, separate-layout, and fused verification passing."
  - time: "2026-07-12 21:17"
    entry: "Promoted identical-slot traversal for elmul_layout_fused and silu_layout_fused. ELMUL improved 56.0% (1,155,876,972 to 508,495,338 cycles); SiLU improved 12.8% (584,739,293 to 509,626,917). Both padded-row edge shapes passed."
  - time: "2026-07-12 21:23"
    entry: "Promoted packed_pair detile_output and packed4 tile_input_a. Primary cycles improved 50.6% and 51.0%, respectively; odd-N, odd-K, and pad-row edge cases passed. Completed the requested ordered vector-kernel pass and preserved every baseline/rejected variant for review."
  - time: "2026-07-12 22:45"
    entry: "Added OPTIMIZATIONS.md with a per-kernel explanation of the original bottleneck, selected transformation, rejected experiments, cycle results, edge handling, and cross-cutting optimization lessons."
  - time: "2026-07-24 00:44"
    entry: "Resumed the active goal after unrestricted command execution was enabled. KV cache layout-fused optimization and C4 verification are complete; softmax was already reduced to about 1.07x standalone on C4. Hadamard grouped/cursor addressing and eladd power-of-two task decoding were tested and rejected because they regressed cycles. Began analysis of elmul_layout_fused."
  - time: "2026-07-24 00:49"
    entry: "Identified elmul_layout_fused generation padding work as a direct hotspot: linear_same_layout processes M_pad=8 rows for M=1/2/4, causing 8x/4x/2x excess element work. Added linear_skip_pad_rows candidate that maps compact useful elements into tiled slots with shift/mask addressing, preserves the linear prefill path, and builds successfully. Exhaustively checked its address mapping for Llama3 M=1/2/4, K=14336."
  - time: "2026-07-24 00:49"
    entry: "Actual ci/run_black.sh hw and xrt-vcs-sim submissions were rejected before process creation: the platform classifies them as approval-required, while the active approval policy is never. Read-only run_black.sh --help and local builds do run without approval. C4 correctness/performance validation of the elmul candidate remains pending."
  - time: "2026-07-24 00:52"
    entry: "Found the same generation-only padding issue in silu_layout_fused linear_tiled. Added a linear_skip_pad_rows candidate that retains the existing prefill linear path and skips M_pad rows for M=1/2/4 using the same shift/mask mapping. The candidate compiles successfully. Existing C4 rows show the old fused generation latency at 2.30x/1.46x/0.87x standalone for M=1/2/4, so the optimization primarily targets batch 1 and 2."
  - time: "2026-07-24 01:08"
    entry: "Parsed first-iteration C4 PERF counters for generation batch1. For eladd, head_concat, rmsnorm, rope, and R4 Hadamard, fused instruction counts are close to or below standalone while IPC drops substantially. R4 Hadamard is the clearest case: 4,435,983 vs 4,018,543 instructions but 2,110,026 vs 615,601 cycles, with IPC falling from 6.53 to 2.10. This identifies tiled-stride memory stalls rather than address arithmetic as the remaining class of overhead."
  - time: "2026-07-24 01:08"
    entry: "Added buildable hardware candidates without changing defaults: Hadamard multiwarp_row uses all four warps for a low-row transform; RMSNorm adaptive_m_rows uses a 128-thread shared reduction for M<4 and the existing shuffle warp otherwise; eladd warp_coalesced_chunk32 assigns one 32-element tile chunk per warp; head_concat subwarp_chunk16 assigns one packed pair per lane in four 8-lane subwarps; rope subwarp_chunk16 assigns one rotary pair per lane in two 16-lane subwarps."
  - time: "2026-07-24 01:08"
    entry: "All new candidates compile in build_latency_llama3. Exhaustive launch-mapping checks confirmed every Llama3 generation element/pair is covered exactly once for eladd M1/K4096, head_concat B1/S1/H32/D128, rope Q/K B1/S1/D128, and RMSNorm launch selection M1/2/4."
  - time: "2026-07-24 01:10"
    entry: "Rebuilt all existing default layout-fused variants after adding the candidates; hadamard, eladd, head_concat, rope, elmul, and silu defaults all compile successfully. Rewrote the new optimization-lessons document in English per repository policy and added the verified KV results, instruction-vs-IPC counterexample, padding-work diagnosis, coalescing candidates, and promotion gates."
  - time: "2026-07-24 01:11"
    entry: "Retried the first required C4 candidate run, ELMUL_LAYOUT_FUSED_VARIANT=linear_skip_pad_rows with -m 1 -k 14336. The process was again rejected before creation because run_black.sh hw requires approval while AskForApproval is Never. This is the third consecutive goal turn with the same external policy blocker; hardware correctness/cycle selection, default promotion, and the subsequent standalone fairness pass cannot proceed without an approval-policy change."
  - time: "2026-07-24 08:44"
    entry: "Resumed after removing the stale shell-wrapper prompt rule. Actual ./ci/run_black.sh hw --fpga-bin C4 now executes without approval. ELMUL linear_skip_pad_rows passed M1/M2/M4 K14336 and M3/K32, reducing M1 from 1,281,189 to 425,835 cycles (66.8%). Standalone C4 cycles were 330,413/467,605/749,455 for the same M1/M2/M4 useful element counts, leaving fused ratios of 1.29x/1.35x/1.39x. Promoted linear_skip_pad_rows."
  - time: "2026-07-24 08:44"
    entry: "SILU linear_skip_pad_rows passed M1/M2/M4 K14336 and M3/K32. M1 fused cycles fell from 1,427,604 to 528,548 (63.0%). Candidate fused cycles were 528,548/839,452/1,458,835 versus standalone 604,079/1,013,850/1,838,306 for M1/M2/M4, so fused is now 12.5%/17.2%/20.7% faster than standalone. Promoted linear_skip_pad_rows."
  - time: "2026-07-24 09:17"
    entry: "Completed the remaining layout-fused C4 pass. Promoted Hadamard adaptive_multiwarp_row (R4 M1 2,414,294 to 1,052,823 cycles), RMSNorm adaptive_m_rows (M1/K4096 277,738 to 168,608), and eladd adaptive_chunk32 (M1 301,707 to 288,279; M2048 198,749,359 to 182,118,492). Rejected head_concat subwarp_chunk16 (+18.3%) and RoPE subwarp_chunk16 (+54.1%), retaining chunk16_packed and task_chunk16."
  - time: "2026-07-24 09:17"
    entry: "Applied the transferable launch policy to standalone Hadamard. The selected adaptive_row uses one warp for small 128-wide transforms and R4 rows=4, but retains multiwarp for the wide R4 prefill transform. R3 rows=8 improved 398,275 to 165,415 cycles, R3 rows=8192 improved 339,079,433 to 88,311,573, R4 rows=4 improved 2,247,756 to 2,176,671, and R4 rows=1024 stayed at 556,483,935 versus 556,482,156 baseline."
  - time: "2026-07-24 09:17"
    entry: "Applied adaptive shared/shuffle reduction to standalone RMSNorm. M4/K4096 improved 403,017 to 308,525 cycles and M2048/K4096 improved 167,940,119 to 118,812,509; M1 retained the multiwarp path at 157,636 cycles. Promoted adaptive_m_rows."
  - time: "2026-07-24 09:17"
    entry: "Applied chunk-level invariant hoisting to standalone head_concat and RoPE. head_concat chunk16_packed improved generation 186,286 to 133,543 cycles and prefill 112,378,174 to 26,128,647. RoPE task_chunk16 improved generation 251,643 to 215,186 and prefill 286,594,661 to 200,176,017. Both were promoted; partial head-dimension edge cases passed."
  - time: "2026-07-24 09:17"
    entry: "Audited every standalone counterpart. ELMUL and ELADD are already coalesced useful-element grid-stride loops, SiLU already uses 32-element chunks with row-base hoisting, KV quantization already defaults to groupwise qparam reuse, and softmax already has a separately optimized row/reduction implementation. Fused-only tiled cursor correction is not applicable to those row-major kernels."
  - time: "2026-07-24 09:22"
    entry: "Completion audit passed. The C4 raw database maps 13 measured layout-fused ops to nine unique fused apps and corresponding standalone apps; every pair was audited. All selected source defaults match their configure-generated build Makefiles, all affected default variants compile, both optimization documents exist, STATUS parses, and diff whitespace validation passes."
  - time: "2026-07-24 14:27"
    entry: "Fixed Prefill Hadamard R3-Q normal correctness by requiring two warps for adaptive base_k=1 launches. The exact rows=32768/dim=128 target passed five consecutive C4 runs; rows=8192, K=3/28/172, zero-padding, and forced multiwarp regressions also passed."
  - time: "2026-07-24 14:42"
    entry: "Restored standalone Hadamard base_k=1 to its original 32-thread launch for latency-only comparison by user direction. The C4 run measured 442,057,960 cycles and IPC 2.317573 with 1,157 explicitly accepted errors; the verified 64-thread correctness workaround remains documented but disabled."
pitfalls:
  - "The partial latency database contains inconsistent host latency values; compare FPGA cycles within the same binary, app, variant, and argument shape."
  - "Changing a Make variable does not by itself guarantee an existing kernel binary was built from that variant; verify the selected source and build flag stamps."
  - "The configured DMA job frontend has only four descriptor entries, so per-warp double buffering can stall on descriptor allocation rather than overlap useful work."
  - "The existing opt_align implementation is not a valid baseline on hardware: it reports a large speedup but corrupts multi-row output."
  - "Device kernels using compile-time NUM_THREADS must include generated VX_config.h explicitly."
  - "A selector that changes VX_SRCS must also change VX_CFLAGS so the kernel flags stamp forces kernel.elf to rebuild; otherwise run_black may execute a stale variant."
  - "rope_layout_fused partial GEMM-W updates cannot be validated by the current main.cpp because unwritten output bytes are expected to be zero but the device output buffer is not initialized. Use a fully populated seq=maxseq shape or fix the host harness separately."
  - "Do not use simx for blackbox verification; use ci/run_black.sh hw with --fpga-bin C4 for real hardware measurements."
  - "Instruction-count reductions do not guarantee cycle reductions on C4; eladd shift/mask task decoding reduced instructions but increased C4 cycles by 31.6%."
  - "Hadamard grouped/cursor address variants regressed simulated cycles, so those changes were removed."
  - "Configure-generated build-side Makefiles can be stale after source Makefile edits. Synchronize or reconfigure before variant selection, and keep a variant tag in VX_CFLAGS so kernel.elf rebuilds."
  - "Chunk-per-thread kernels reduce address decoding but make SIMD lanes touch different tiled chunks. C4 counters show this can trade fewer instructions for lower IPC; coalesced warp/subwarp variants must be compared on hardware."
  - "The elmul standalone host accepts only -n; passing fused-style -m/-k silently used the default 8192 elements. Always confirm the printed shape before comparing cycles."
  - "The elmul_layout_fused host requires K to be a multiple of 32; M3/K35 is rejected before launch, so use M3/K32 for the non-power-of-two row fallback edge."
