# Hadamard Layout-Fused Decode Debug

status: completed
scope:
  - tests/regression/hadamard
  - tests/regression/hadamard_layout_fused
  - analysis_workspace/latency_on_hw/docs/layout_fused_results_summary.md
findings:
  - timestamp: "2026-07-31 19:28"
    summary: >-
      The normal Makefile defaults to HADAMARD_VARIANT=r3_shuffle, while the
      fused Makefile defaults to HADAMARD_LAYOUT_FUSED_VARIANT=r3_shuffle_incremental.
  - timestamp: "2026-07-31 19:28"
    summary: >-
      For dim=128 and base_k=1 both variants use the 32-thread shuffle path.
      Normal flattens m*n into rows and caps the persistent launch at
      cores*warps blocks. Fused caps only grid.x by m and retains n in grid.y,
      producing n blocks for decode m=1. This matches the measured n-dependent
      slowdown and is the leading root-cause hypothesis.
  - timestamp: "2026-07-31 19:37"
    summary: >-
      Fixed the r3 decode path by flattening small rows-by-matrix geometry into
      at most cores*warps persistent workers. Workers advance by matrix stride,
      avoiding a workgroup per matrix and avoiding division inside the loop.
