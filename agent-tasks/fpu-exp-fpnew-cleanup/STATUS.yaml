summary: "Refactor VX_fpu_exp_fpnew to mirror the DSP exp datapath shape while using fpnew-backed add/mul leaf wrappers, and enable hardware exp in the Synopsys fpnew path."
log:
  - time: "2026-06-27 21:16"
    entry: "Initial status: git branch fpint_improve is clean and synced with origin. Current fpnew exp is an 8-stage unrolled fpnew_top pipeline; DSP exp uses VX_pe_serializer plus Xilinx/DPI arithmetic leaves. User approved cleanup to make fpnew exp follow the DSP structure and use fpnew only through add/mul-style leaf wrappers."
  - time: "2026-06-27 21:34"
    entry: "Implemented VX_fpu_exp_fpnew as a DSP-shaped serializer datapath. The main exp module now uses VX_pe_serializer and only calls local fpnew fmul/fadd leaf wrappers; fpnew_top is isolated inside the generic addmul wrapper. Added FPU_FPNEW LATENCY_FEXP formulas and enabled VX_ENABLE_HW_EXPF in the Synopsys run script."
  - time: "2026-06-27 21:34"
    entry: "Debug note: the older agent-tasks/softmax-isa-expf smoke uses wait(valid_out) and checks result in the same time slot as the output buffer update. It can report X even when a clocked trace and race-free smoke observe the correct result."
pitfalls:
