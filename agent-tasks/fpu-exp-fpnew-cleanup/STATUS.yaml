  - "Do not reintroduce a multi-step FSM under VX_pe_serializer; prior fpnew exp attempt hung because serializer valid timing was not tied to internal operation completion."
  - "Blackbox runs must use the configured build directory and ci/run_black.sh / run-bb-common flow."
