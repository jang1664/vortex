    action: "Completed the final WLOAD8 M=4 XRT-VCS functional, performance, FSDB latency, and exact HOL rerun."
    result: "Both debug/FSDB and repeated perf-class-3 runs passed numerically. The preserved final total/app/busy cycles are 2237/8532/8563; the historical 53.509% overlap used GEMM total cycles as denominator and is superseded by the DMA-union denominator follow-up. psum_underflow and rd_wr_conflict are zero, all child push/issue/complete counts match, and exact reconstructed HOL is zero."
