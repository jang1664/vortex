verification_request:
  owner: verification
  status: completed
  note: "RTL implementation intentionally did not modify tests or run VCS/simulation in the final pass."
  focused_tests:
    - name: "gemm_ctrl scheduler/lifecycle"
      command: "source configs/improve_th32_tcol32_hwexp_dcache_sxbar_f16_bigmem_w8.sh && CC=/usr/bin/gcc CXX=/usr/bin/g++ /usr/bin/python3 tools/verify_rtl.py unittest --path hw/unittest/gemm_ctrl --sim vcs --extra-sim-args \"+SCHED_DIRECTED\""
      require: "Reconcile the old two-active-entry directed case with the confirmed current single-active executor boundary: allow only empty->issue or same-cycle oldest-completion->new-issue; retain the physical 2-entry FIFO and verify in-order oldest retirement. Check exact cfg ready = fsm_idle && scheduler_quiescent and back-to-back entry IDs."
    - name: "gemm_node exact completion integration"
      command: "source configs/improve_th32_tcol32_hwexp_dcache_sxbar_f16_bigmem_w8.sh && CC=/usr/bin/gcc CXX=/usr/bin/g++ /usr/bin/python3 tools/verify_rtl.py unittest --path hw/unittest/gemm_node_improve --sim vcs --params \"M=4 N=256 K=256 QBLK=32 WTRANS=0 QDIR=1\""
      require: "Emit and compare endpoint markers proving child1 done coincides with the last actual weight-register write, child2 done with the last SC/ZP-register write, child3 done with the final accepted destination write, and child4 done with the current-cycle effective all-channel completion. Prove one done per start and no scheduler retirement from legacy ctrl.done/S_SYNC/S_DONE."
    - name: "local DMA terminal-write unit"
      command: "source configs/improve_th32_tcol32_hwexp_dcache_sxbar_f16_bigmem_w8.sh && CC=/usr/bin/gcc CXX=/usr/bin/g++ /usr/bin/python3 tools/verify_rtl.py unittest --path hw/unittest/lmem_dma_misal --sim vcs"
      require: "For DIR=0 and DIR=1, verify write_done is exactly the final accepted destination write, one pulse per descriptor, earlier than wrapper S_DONE, and GEMM_IMPROVE never enters/uses legacy S_SYNC."
    - name: "global TMEM DMA unit"
      command: "source configs/improve_th32_tcol32_hwexp_dcache_sxbar_f16_bigmem_w8.sh && CC=/usr/bin/gcc CXX=/usr/bin/g++ /usr/bin/python3 tools/verify_rtl.py unittest --path hw/unittest/gemm_tmem_dma_ctrl --sim vcs"
      require: "Update expectations to direct all-channel completion in S_WAIT_DONE; cover both DMA_LD and DMA_ST, current-cycle final-channel bypass, single done pulse, store_done alignment, and rejection of removed OP_NOTIFY."
  phase6_rerun:
    command: "From a configured build directory, use ci/run_black.sh xrt-vcs-sim --app fpint_gemm_ffn_hw with the established WLOAD8 M=4,N=256,K=256,QBLK=32,WTRANS=0,QDIR=1 arguments, following run-bb-common."
