    result: "The audit also found delayed W/SZ/output completion sources, one 39-cycle real child-4 HOL interval, weak prior-G/RID_O test oracles, and incomplete non-input source-identity coverage. A partial unverified write_done patch remains in the worktree; child-4 depth and global completion fixes were not applied."
