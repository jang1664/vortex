  - timestamp: "2026-08-06 18:42"
    action: "Completed the exact architectural completion, dormant-notify removal, strict lifecycle, and trace-proven HOL RTL pass without changing verification infrastructure."
    result: "Weight and SC/ZP scheduler done now come from counted final register-write pulses exported by VX_gemm_unit_v2; output done comes from the final accepted local-DMA destination write; global DMA done comes from the current-cycle effective all-channel completion. GEMM_IMPROVE local DMA bypasses legacy S_SYNC, and VX_gemm_tmem_dma_ctrl no longer decodes OP_NOTIFY or contains S_NOTIFY. Child4 command FIFO depth is parameterized to 8 while children 0-3 remain 4. Config ready is exactly fsm_idle && scheduler_quiescent, with separate active/done entry IDs for same-cycle old completion/new accept."
    learned: "The 2-entry per-child inflight FIFO is an in-order metadata boundary, not permission for two currently active executor commands. RTL now gates issue to empty or same-cycle oldest completion and asserts that boundary; completion tags remain unnecessary."
  - timestamp: "2026-08-06 18:40"
    action: "Ran implementation-side static integration checks only."
    result: "git diff --check passed. Verilator lint passed with exit 0 for VX_gemm_ctrl, VX_gemm_tmem_dma_ctrl, VX_lmem_dma_misal, and the full VX_gemm_node source set under the WLOAD8 improve configuration. The full-node pass reported pre-existing/project-wide warnings (FSM local-variable latch diagnostics, DMA helper missing idle pins, and known combinational-loop warnings), but no syntax, missing-new-pin, or new multi-driver error. VCS compile/simulation was deliberately deferred to verification."
    learned: "The first full-node lint attempts failed only because standalone lint lacked project common_cells/FPNEW/platform defines; after matching the build includes/defines, the source set elaborated successfully."
  - timestamp: "2026-08-06 17:18"
    action: "Recorded the user's completion-order decision and resumed the RTL improvement loop."
    result: "Inflight metadata remains a separate two-entry FIFO per child. Current executors allow at most one active command per child; future two-entry use must still complete in order. Completion tags are deferred until out-of-order completion becomes possible."
    learned: "The scheduler does not need to distinguish completion identities under the confirmed per-child in-order contract; executor-boundary assertions must preserve that contract."
  - timestamp: "2026-08-06 17:12"
    action: "Stopped implementation after the final requirement audit found a contradiction in the confirmed completion contract."
    result: "The source design simultaneously assumes in-order completion within each child and requires a scheduler out-of-order-completion assertion, but executors return only an untagged done bit. The scheduler cannot distinguish an A/B completion swap across its two inflight entries. No architectural choice was made."
    learned: "Continuation requires an explicit decision: retain in-order completion as an executor contract and replace the scheduler assertion with executor-local order checks, or add issue/completion sequence tags across the interfaces."
  - timestamp: "2026-08-06 17:12"
