      Write-side (per channel):
        - burst_wr_dst_base_byte_r [AXI_ADDR_WIDTH]
        - burst_wr_words_captured_r [32]
        - burst_wr_window_base_r [32]
        - burst_wr_prefetch_started_r [1]
        - burst_wr_issue_group_r [GROUP_IDX_W], burst_wr_issue_beat_r [BEAT_IDX_W]
