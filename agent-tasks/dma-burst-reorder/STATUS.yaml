        - burst_wr_group_base_addr_r [READ_BURST_GROUPS][AXI_ADDR_WIDTH]
        - burst_wr_window_data_r [READ_WINDOW_WORDS][DATA_WIDTH]   ← big FF
        - burst_wr_window_byteen_r [READ_WINDOW_WORDS][DATA_SIZE]  ← big FF
        - write_state_r : write_state_t (3-bit enum, 5 states)
      With READ_WINDOW_WORDS=16, DATA_WIDTH=512, DATA_SIZE=64, 8 channels:
        window_data (read + write) = 2 × (16×512) × 8 = 131072 bits FF
        window_byteen (write)      = 16×64 × 8        = 8192   bits FF
        + group/state overhead     ≈ O(1KB) FF per ch
