  - timestamp: "2026-07-28 11:59"
    phase: implementation_fix
    status: ready_for_verification
    summary: "Moved bank-set pending-write retirement from the wide splitter handshake to the actual narrow psum_wr_lmem_bus_if downstream handshakes."
    root_cause: "The wide write handshake only proves that all lanes entered splitter skids. Independent read lanes could still pass while matching writes remained in splitter, write-arbiter, or node-output buffering, reproducing the same stale value in the isolated iteration 6 run."
    fix_applied: "Pending counters now count narrow lanes: add sixteen at raw write-queue ingress and subtract the popcount of marked PSUM write lanes completing downstream request handshakes for each bank set. Narrow address bit four selects the set. A node-internal flags marker distinguishes PSUM writes from final-output writes after their shared write arbiter. Counters are seven bits for the four-entry queue's maximum 64 lanes, combine simultaneous push/pop arithmetically, guard against underflow, and retain the existing same-cycle write gate."
    evidence: "git diff --check passes. Queue SIZE remains four. Read-valid ordering depends only on registered pending counts and current write valid/address; downstream ready affects only sequential counter retirement. Opposite bank sets remain independently eligible."
    lesson: "Ordering state must retire at the last acceptance point before independently routed requests can no longer overtake, not merely when a width adapter captures the transaction."
  - timestamp: "2026-07-28 12:05"
    phase: implementation_fix
    status: ready_for_verification
    summary: "Serialized PSUM read bank-set transitions until all wide responses from the active set have been consumed, while retaining multiple outstanding reads within one set."
    root_cause: "Iteration 7 retained write pending state through the node-output handshakes yet reproduced the identical mismatch. In the stream-response configuration, each read requester alternates between bank i and bank 16+i, and VX_local_mem response arbitration can return those banks out of issue order. VX_mem_bus_split consumes each lane's response FIFO in issue order without an address sequence tag, so mixed-set outstanding reads can be assembled against the wrong wide request."
    fix_applied: "Added a seven-bit wide-read outstanding count and active bank-set bit in VX_gemm_node_naive. Wide request handshakes increment the count, consumed wide responses decrement it, and a read selecting the other set is held until the count reaches zero. Requests to the active set may remain multiply outstanding. Overflow and underflow are guarded and asserted."
    evidence: "git diff --check passes. Set-switch gating uses only registered count/set state and the presented read address. Response/request ready signals affect sequential count updates only, so no ready-to-valid combinational loop is introduced. Existing pending-write gating, disjoint read/write concurrency, and PSUM write queue SIZE=4 remain intact."
    lesson: "A tag that routes a response back to its requester does not by itself preserve ordering among different banks feeding that requester."
