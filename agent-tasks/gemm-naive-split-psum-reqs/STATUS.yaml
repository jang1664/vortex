  - timestamp: "2026-07-28 11:46"
    phase: implementation_fix
    status: ready_for_verification
    summary: "Added GEMM_NAIVE node-side pending-write bank-set ordering while preserving simultaneous read/write issue to disjoint bank sets and retaining the four-entry write queue."
    root_cause: "The GEMM-unit conflict gate observes only a write generated in the current cycle. After that write entered the node queue, a later read to the same physical 16-bank footprint saw no conflict and could advance on the independent read request path before the queued write was safely ahead in the lane pipeline."
    fix_applied: "Inserted a raw read interface in VX_gemm_node_naive and two bank-set pending counters. A counter increments when a write enters the four-entry queue and decrements when the wide write handshake confirms all sixteen lanes entered the lane-split skids. A read is withheld when its wide-address bit zero selects a pending set or a simultaneously presented raw write selects the same set. No downstream ready participates in read-valid generation."
    evidence: "git diff --check passes. The read FSM still advances only through VX_gemm_unit acc_mem_accum_rd_accept = req_valid && req_ready; opposite bank-set reads are not blocked by the node ordering predicate."
    lesson: "Current-cycle producer arbitration and downstream bank arbitration do not replace ordering metadata for writes buffered between them."
