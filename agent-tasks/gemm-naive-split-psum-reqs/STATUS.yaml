task: gemm-naive-split-psum-reqs
state: COMPLETE
updated: "2026-07-28 12:15"
pitfalls:
  - "LMEM request-port count and LMEM bank count are distinct; both are 32 only in the target configuration."
  - "The physical bank-set comparison must use outgoing LMEM address bits, not the GEMM logical accumulator-bank signal."
  - "Existing unrelated modifications in VX_config.vh and VX_local_mem.sv belong to concurrent work and must be preserved."
  - "Sharing each of the 32 local-memory request slots requires one extra response-route tag bit; the local-memory tag width must match the second-stage priority arbiter output."
  - "The upper halves of the 32-entry PSUM read/write interface arrays are inactive in the split topology and must be explicitly terminated."
  - "The configured gemm_node unittest reaches VCS simulation but its DMA source uses an unsupported 8-byte gearbox width and it does not instantiate VX_mem_unit, so it cannot provide functional coverage for the split topology."
  - "Passing CONFIGS to the blackbox wrapper does not force VCS to rebuild an existing simv; the VCS incremental artifacts must be moved aside before changing between GEMM_IMPROVE and GEMM_NAIVE configurations."
  - "Current-cycle GEMM-unit gating alone does not guarantee ordering across the independent read path and the four-entry PSUM write queue."
  - "The shared build/sim/xrtsim_vcs directory is concurrently used by other blackbox jobs; a dedicated configured build directory is required for authoritative CONFIGS and VCS artifacts."
  - "A queued write must remain ordering-visible until all sixteen lanes have entered the write lane-split skids; dequeueing from the four-entry queue is the corresponding wide-request handshake."
  - "Wide splitter acceptance is still too early for ordering: pending state must survive until each marked narrow PSUM lane completes psum_wr_lmem_bus_if valid/ready downstream handshake."
  - "The stream response xbar does not preserve issue order when one requester alternates between bank i and bank 16+i; VX_mem_bus_split lane assembly therefore requires draining one PSUM read bank set before switching to the other."
