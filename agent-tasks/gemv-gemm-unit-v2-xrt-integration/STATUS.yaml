iterations:
  - iteration: 1
    test: gemm_unit_v2_and_node_metadata_k32
    status: sim_fail
    error_summary: "V2 unit and K32 numerical checks passed, but an invalid raw-stream metadata probe expected constructor flags 111111 and observed job-FSM flags 001111."
    root_cause: "VX_cmd_constructor is not instantiated in the active improve node/controller path. Raw frontend writes program the job frontend and are regenerated by VX_gemm_fsm, so the probe was not testing the constructor or a direct raw input command."
    fix_applied: "Iteration 2 removes the unrelated constructor delta/raw probe and replaces the artificial M-multiple constraint with a real config/FSM M1,K64 numerical test."
    lesson: "Verify that a module is instantiated in the authoritative top-level path before adding a behavioral integration probe for it; an earlier numerical PASS marker can also cause verify_rtl to miss a later fatal."
  - iteration: 2
    test: gemm_node_metadata_k32_and_gemv_m1_k64
    status: pass
    error_summary: ""
    root_cause: ""
    fix_applied: "Removed the invalid raw-constructor probe, retained the independent semantic metadata/lifecycle scoreboard, and relaxed only the artificial config-test M-multiple constraint."
    lesson: "The active config/FSM path supports M=1: M1/N32/K64 produces two one-packet commands that reuse one PSUM row and gives direct numerical load-to-accumulate coverage."
  - iteration: 3
    test: gemm_node_metadata_bubble_wtrans_qrow
    status: pass
    error_summary: ""
    root_cause: ""
    fix_applied: "No additional change required."
    lesson: "Admission-driven metadata survives deterministic LDMA bubbles and WTRANS/QROW command variants; all command, last-admission, last-write, and done counts remain balanced."
  - iteration: 4
    test: xrt_vcs_fpint_gemm_ffn_hw_m1_k32_smoke
    status: sim_fail
    error_summary: "XRT-VCS stopped at 5 ns before device initialization: V2 input-scaler backpressure assertion fired during the top-level reset-unknown window."
    root_cause: "The full XRT wrapper's internal vx_reset is still X in the active region of the first clock edge. V2 and new node assertions used logical !reset guards, allowing X-propagation assertion attempts before reset was known deasserted."
    fix_applied: "Iteration 5 will make non-synthesis assertion guards require reset === 1'b0 and real valid === 1'b1 without changing functional datapath behavior."
    lesson: "Unit test reset initialization did not cover the XRT wrapper's first-edge reset-X window; integration assertions need explicit four-state reset/valid gating."
  - iteration: 5
    test: assertion_regression_and_xrt_vcs_m1_k32_stale_rebuild_check
    status: sim_fail
    error_summary: "V2 and node M1,K64 regressions passed, but the wrapper reused the 14:40 XRT simv and reproduced the old 5 ns assertion before executing the updated RTL."
    root_cause: "The xrtsim_vcs simv target discovers RTL through -y directories but does not list those RTL sources as Make prerequisites; the V2 source timestamp was 14:45 while simv remained 14:40."
    fix_applied: "Iteration 6 will force a non-destructive `make -B simv` under the same improve configuration, verify the rebuilt timestamp, and rerun the exact smoke case."
    lesson: "After source-only RTL edits, configure plus run_black is insufficient to guarantee an XRT-VCS rebuild; compare source/simv timestamps or force the simv target before interpreting a repeated failure."
  - iteration: 6
    test: forced_rebuild_xrt_vcs_m1_k32_smoke
    status: sim_fail
    error_summary: "The rebuilt simulator passed the V2 5 ns startup point, then stopped at 280 ns before device initialization on an existing FP16 FMV.H.X checker with source, expected, and actual all X."
    root_cause: "The simulation-only VX_fpu_ncp checker is not reset-aware and can retain startup-X bookkeeping until the AFU globally reenables assertions after reset. The functional FPU datapath is not implicated by the all-X pre-workload failure."
    fix_applied: "Iteration 7 will harden only the simulation checker bookkeeping with reset-aware/four-state-safe qualification, rebuild simv, and rerun the smoke case."
    lesson: "A forced rebuild exposed the next genuine integration blocker; assertion bookkeeping must be initialized by architectural reset rather than relying only on an initial block when XRT delays global assertion enable."
  - iteration: 7
    test: xrt_vcs_m1_k32_after_ncp_checker_fix
    status: sim_fail
    error_summary: "The NCP checker false fatal disappeared, but XRT stopped at the same 280 ns startup boundary on an unchanged FCVT checker whose input exponent and classification operands were X."
    root_cause: "The FCVT simulation assertion uses two-state-style logical qualification under VCS -xprop=tmerge and can attempt its finite-fraction property on reset/startup-X pipeline data."
    fix_applied: "Iteration 8 will make the FCVT checker reset-aware and explicitly require known qualifying/property operands, while auditing sibling FPU simulation assertions for the same startup-X pattern."
    lesson: "Once AFU assertion enable is delayed, every procedural simulation checker that continues sampling startup state must use reset- and four-state-safe qualification; fixing only the first reported checker causes serial false failures."
  - iteration: 8
    test: xrt_vcs_m1_k32_post_startup_checker_smoke
    status: sim_fail
    error_summary: "XRT initialized and launched the kernel with no assertion/fatal, but the full-FSDB run reached only 991 post-reset core cycles in 12 wall-minutes and had not yet issued any GEMM command."
    root_cause: "The wrapper's unconditional FSDB_DUMP=1 caused roughly order-of-magnitude waveform overhead; the preserved waveform proves this was premature wall-time interruption before GEMM, not a node completion hang."
    fix_applied: "Iteration 9 will retain the required run_black wrapper while using GNU make command-line precedence (`MAKEFLAGS=FSDB_DUMP=`) to build/run without full FSDB, then rerun the exact smoke."
    lesson: "Host poll count and wall time do not measure simulated core progress. Check a cycle counter and whether the unit under test was reached before classifying a full-wave XRT run as an RTL hang."
  - iteration: 9
    test: non_fsdb_hwexp_xrt_vcs_m1_k32_smoke
    status: sim_fail
    error_summary: "The non-FSDB hwexp smoke had no assertion or numerical failure but remained kernel-busy until the 1800-second timeout, producing 657998 status polls and no completion."
    root_cause: "Full waveform overhead was eliminated, but the FPU_DSP/hardware-exp configuration is still too slow to reach a useful GEMM integration result within the established 30-minute XRT-VCS budget."
    fix_applied: "Iteration 10 will use the repository's simulation-oriented TH32 dcache config, which preserves GEMM_IMPROVE/node/V2/memory topology while omitting only the custom hardware-exp/FPU_DSP path, and run the full directed matrix through xrt-vcs-sim."
    lesson: "Integration verification should preserve the RTL path under test while removing orthogonal simulation bottlenecks; an app-level timeout before any result is not evidence against GEMM correctness."
  - iteration: 10
    test: backend_latency_fix_and_directed_xrt_vcs_matrix
    status: pass
    error_summary: ""
    root_cause: "FPnew contributes a mandatory one-cycle input buffer even with operator LATENCY=0, but the XRT-VCS DPI backend is combinational at LATENCY=0. V2 control assumed one-cycle FP16 multiply, FP32 multiply, and FP32 add stages, so DPI scaler valid arrived one cycle before control and the final ACC write/last_write was dropped."
    fix_applied: "Selected operator latency per backend: FPnew keeps LATENCY=0 while DPI/Xilinx use LATENCY=1; applied the contract to FP16 multiply, FP32 multiply, and FP32 add, and added load-stage alignment assertions plus event-only V2 write traces."
    lesson: "A fixed-latency sideband pipeline must specify effective wrapper latency, not just the IP parameter. Verify each simulation backend independently and assert load control/data alignment so the first packet identifies a mismatch."
pitfalls:
  - "The job FSM populates cmd.eff_mt, while the uninstantiated legacy VX_cmd_constructor does not. Only the active job-FSM path is in scope; changing the dead constructor path would not prove or improve xrt integration."
  - "VX_cmd_constructor is not instantiated by the current improve node path. A raw-stream probe through the active job frontend exercises VX_gemm_fsm instead, so constructor behavior is not valid node-integration evidence."
  - "verify_rtl.py reported pass when a numerical PASS marker preceded a later required-coverage fatal; authoritative sim logs must be checked through the final line."
