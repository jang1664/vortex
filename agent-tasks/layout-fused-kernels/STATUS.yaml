pitfalls:
  - "rope_k layout_to=gemm_w_tiled is not packed int4 tile_weight_w4a16 format; it is W-like fp16 tiled latency-model storage and still needs kv_cache_quant_w4a16 before the packed GEMM-W path."
  - "bench_util uses --warmup=N and --iterations=N. Passing '-warmup 0 -iterations 1' is ignored and runs the default, much longer bench loop."
  - "KV cache quant/dequant WTRANS is CLI parity only; packed dynamic cache storage remains row-major n-pair order and is not tile_weight_w4a16 byte layout."
