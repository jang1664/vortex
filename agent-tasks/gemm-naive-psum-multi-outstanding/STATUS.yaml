    verification: "Static inspection confirms same-set burst size 8, restored set-switch guard, bounded outstanding assertion, both write-conflict guards, FIFO depth/almost-full behavior, and final queue SIZE=4. No simulation run by RTL implementation agent."
    lesson: "Same-set batching can amortize drain latency without exposing the wide response assembler to cross-set lane reordering."
