task: gemm-naive-psum-multi-outstanding
state: COMPLETE
updated: "2026-07-29 13:03"
goal: "Allow bounded same-set PSUM reads to remain outstanding, drain before switching LMEM bank sets, and reduce exact-config GEMM_NAIVE M256 cycles without correctness regressions."
pitfalls:
  - "The original alternating selector plus set-switch block makes the PSUM stream effectively one-wide-request-at-a-time."
  - "Mixed physical bank-set overlap is unsafe because lanes can observe different cross-set response order; requests must be batched within one set and drained before switching."
  - "The M256 baseline is 177213 kernel cycles; DEBUG=3 VCS wall time is not a hardware performance metric."
  - "Existing unrelated dirty files belong to the user and must be preserved."
