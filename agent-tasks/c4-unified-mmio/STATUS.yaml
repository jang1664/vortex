resolved_harness_issues:
  - Missing XLEN_64 in the new serializer unit Makefile caused address truncation; corrected without weakening allocation assertions.
  - Fresh configured build needed make -C hw config to generate VX_config.h for the DPI compiler.
  - Publication stimulus needed falling-edge alignment to observe 20 complete blocked cycles; assertion retained.
  - Early-return test exceeded the initial 300-second wall budget and passed unchanged with 1200 seconds.
