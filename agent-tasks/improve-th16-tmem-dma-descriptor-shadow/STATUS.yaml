    action: "Corrected the focused TB's compact store cursor unit check. Production RTL, scheduling, descriptor construction, shadow ownership, and the original verification request were not changed. No simulation or blackbox was run in this fix iteration."
    root_cause: "The pre-refactor assertion observed candidate_desc_q[1][0] byte addresses: SRC_BASE_LO=512 and DST_BASE_LO=0x00402000. Iteration 1 translated the source-byte offset directly into candidate_store_cursor_q==512, but candidate_store_cursor_q is a bank-local beat index, not a byte offset. Under PLATFORM_MEMORY_NUM_BANKS=32, NUM_CHANNELS=8, and MEM_BLOCK_SIZE=64, the store TMEM/HBM beat strides are 256/2048 bytes. The first chunk is two bank beats, so the correct compact candidate state is cursor=2 and remaining=2; this reconstructs 2*256=512 and 0x00401000+2*2048=0x00402000 exactly."
    diagnosis:
      committed_cursor: "store_bank_beat_cursor_q remains 0 while the active first store chunk and paused fallback coexist; speculative progress is not committed into foreground owner state."
      compact_fallback: "candidate_store_cursor_q[1]=2 and candidate_store_remaining_q[1]=2 represent the next paused-store chunk in beat units. candidate_owner_q[1] retains the original store command/tag."
      priority_lifecycle: "The prepared high owner remains authoritative. The compact fallback owner is retained even when its decoded shadow is invalidated or replaced; no fallback retirement or cursor commit occurs."
      test_objectivity: "The test was objectively wrong because it compared quantities with different units. The corrected assertion still proves the exact legacy descriptor addresses by multiplying the compact beat cursor by the configuration-derived TMEM/HBM strides."
    fix:
      file: hw/unittest/gemm_tmem_dma_ctrl/tb_VX_gemm_tmem_dma_ctrl_misalign.sv
      change: "Added configuration-derived STORE_TMEM_BEAT_STRIDE/STORE_HBM_BEAT_STRIDE constants and changed the priority-pause check to require cursor=2, remaining=2, unchanged compact owner bases, reconstructed source offset=512, reconstructed destination base=0x00402000, and committed cursor=0."
