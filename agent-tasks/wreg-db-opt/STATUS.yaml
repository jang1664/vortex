pitfalls:
  - "The source plan is authoritative; do not replace separate W/SC/Z consume RIDs with RID_G or one shared consumer event."
  - "Non-final input-command completion proves ingress completion, not GEMM-tree weight consumption."
  - "QCOL scale consumes late; all post-snapshot datapath reads must use immutable pipelined values rather than mutable scale_regs."
  - "The current worktree contains unrelated untracked planning files; preserve them."
  - "A two-entry descriptor queue is insufficient unless source requests for command N+1 execute while command N drains; passive storage alone does not remove start-to-first-write latency."
  - "W_RD_OUTSTANDING currently conflates beats per Weight command, aligned-DMA payload slots, and TMEM wide-read contexts; the new implementation must separate layout invariants from shared capacity."
  - "The confirmed follow-up removes W/S/Z index equality: Weight has four banks, Scale/ZP remain independent two-bank snapshot resources, and ARM has five wait dependencies."
  - "Same-cycle Weight overwrite is legal only for the exact matching final consume with no other incoming/earlier same-bank consumer."
  - "gemm_ctrl has no Makefile lint target and gemm_sync has no vlt.mk; use a direct configured Verilator lint command for implementation-only static checks."
  - "Input overlap must move W/S/Z/ACC readiness to a per-command admission fence; simply deleting prior_g_wait would permit unsafe GEMM admission."
  - "VX_gemm_unit_v2 currently defines input_fire as req_valid because ready is tied high; admission backpressure requires converting every input-side state update to a true valid-ready handshake."
  - "Eight Input response slots can hold two M=4 payloads, but four descriptor contexts are required to hide source startup across four consecutive bursts."
  - "Qparam final-write completion and full-FIFO capacity must cross a registered causal boundary; same-cycle GEMM-ready/completion/scheduler feedback recreates the hierarchy zero-time loop."
