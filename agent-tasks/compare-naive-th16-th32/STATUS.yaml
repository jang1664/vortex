pitfalls:
  - "CPU LSU request-channel analysis is not representative of fpint_gemm_ffn_hw_naive because only thread 0 drives MMIO and gemm_node_naive performs the bulk data movement and computation."
  - "A fresh configured build does not contain kernel/libvortex.a; build it with make -C kernel before the blackbox application link."
  - "The th16 configuration currently hangs in the scalar kernel/store path in xrt-vcs-sim, including without PERF_ENABLE; this prevents a valid paired end-to-end timing measurement and must not be misreported as slower GEMM execution."
  - "VX_cache_bypass instantiates VX_mem_arb with NUM_INPUTS=DCACHE_CORE_NUM_REQS and NUM_OUTPUTS=L1_MEM_PORTS. VX_mem_arb does not encode a response-route selector when NUM_INPUTS <= NUM_OUTPUTS, so the 2-input/4-output non-cacheable bypass topology loses/misroutes responses. Keep L1_MEM_PORTS <= DCACHE_CORE_NUM_REQS or redesign the arbiter response routing."
