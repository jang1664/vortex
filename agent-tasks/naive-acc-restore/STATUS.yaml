pitfalls:
  - "Old naive output source strides are FP32 bytes with 64-byte bus address decoding; do not mix in feat/gemv's virtual FP16 address convention."
  - "Output wide-bus acceptance does not mean writes have committed to LMEM; track narrow issue and actual bank commit, and drain lane skids."
  - "The splitter can issue early lanes before wide req_ready; reserving pending writes only on wide handshake can underflow."
  - "VCS simv must be built independently for ON/OFF/C2; CONFIGS changes alone may not invalidate it."
  - "verify_rtl.py blackbox CLI hardcodes build/ and directly calls blackbox.sh; reuse its report helpers with the user-required wrapper instead."
  - "With default_nettype none, VCS requires output_path_idle declaration before its use in output_notify_req."
  - "The blackbox wrapper redirects application PASS output to build/run.log; classify and archive that log as well as wrapper stdout and simv.log."
  - "Direct C2 make simv in a fresh build needs make -C hw first to generate VX_config.h; the blackbox wrapper normally supplies that prerequisite."
  - "DEBUG_LEVEL=3 emits expensive per-lane FP traces (hundreds of MB per partial M256 run). DEBUG_LEVEL=1 retains required unconditional sequence markers and assertions."
  - "The mixed-language VCS flow does not forward --debug level to vlogan or DPI C++; explicitly define DEBUG_LEVEL=1 in CONFIGS and VCS_CPPFLAGS for compact traces."
  - "Historical naive has no explicit post-STORE wait, but depth-four DMA queue plus ordered prefetch can indirectly delay next-tile compute until STORE ends. No actual compute/STORE overlap was observed in the requested cases."
