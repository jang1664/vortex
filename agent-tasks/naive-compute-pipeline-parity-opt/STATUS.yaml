  - id: phase5-rtl-qparam-opcode-demux-fix-46
    status: static_pass
    time: "2026-08-22 10:58 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 optional QBLK16 qparam ownership fix"
    verification_input: "phase5-vcs-qblk16-independent-owner-45"
    root_cause:
      - "VX_gemm_node_naive split the combined quant DMA request into Scale or ZP using `addr >= 2*GEMM_SCALE_ZERO_DATA_SIZE`. That address threshold is not a resource-ownership contract once QROW emits multiple narrow destination segments into the wide register bus."
      - "For QBLK16 QROW bank-1 Scale, the command starts at byte 64 and emits 32 four-byte segments. The first 16 writes use wide address 64, while the remaining 16 use wide address 128; the old threshold therefore reclassified the same live Scale command as ZP exactly at write 16/32. QBLK32 QROW spans only one 64-byte wide window, and QCOL writes full wide beats, explaining why the required matrix and QBLK16 QCOL passed."
    fix:
      - "Replaced the physical-address threshold demux with the authoritative registered quant-command opcode owner. An active owner routes every request to only its Scale or ZP port until its exact descriptor-derived write count retires."
      - "Handled command turnover explicitly: while the prior owner has remaining writes it retains routing priority, including the cycle where its final write and the next command start coincide; with no live owner, an accepted incoming command opcode can route an immediate request. Existing sequential ownership logic then retires the old generation and installs the new owner on that same edge."
      - "Made the common core's already-separated Scale and ZP ports authoritative for resource classification. Address-derived bank selection remains unchanged, and request address, payload, byte enables, flags, and tag pass through unchanged."
      - "Added production assertions for a recognized opcode owner on every combined qparam request, legal final-write command turnover, Scale/ZP write-to-owner identity, and mutual exclusion of Scale and ZP register-write pulses."
    static_validation:
      - "Fresh NAIVE WLOAD8 VCS parse and full VX_gemm_node_naive hierarchy elaboration passed with the common core, LMEM ACC adapter, packetizer, and opcode-owned qparam route. RTL Implementation did not run simulation."
      - "Fresh IMPROVE WLOAD8 gemm_unit_v2 VCS compile/elaboration passed, covering the common-core split Scale/ZP port decode after resource ownership became port-authoritative. RTL Implementation did not run simulation."
      - "git diff --check and STATUS YAML parsing passed. No testbench, row-major FSM formula, DMA topology, or physical request address/payload/byte-enable source was edited."
    hard_rule: "none; the existing serialized quant DMA command and descriptor-derived remaining-write counter provide a finite authoritative owner, so the fix requires no extra storage, forwarding, topology change, or reordered install"
    test_requests:
      - test_type: "unittest"
        test_path: "hw/unittest/gemm_node and hw/unittest/gemm_unit_v2"
