          - "hw/rtl/core/gemm/VX_lmem_weight_gather_dma.sv"
        notes: "Use the already corrected production-like 64B DCache-to-256B LMEM TB topology and force a fresh rebuild. In the first case, prove four ordered Weight handshakes per command, observe psum_wr_pending_by_set[0] cross 112 to 128 without becoming zero, require reads to remain blocked until corresponding lane pops drain the set, and require no PSUM shadow mismatch plus numerical/count/clean-completion PASS. Retain the previously passing exact WLOAD8 gather test as a regression; do not alter row-major layout, WLOAD, or functional case parameters."
