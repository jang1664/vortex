  - id: phase6-rtl-dma-sink-final-sideband-fix-95
    status: static_pass
    time: "2026-08-27 02:34 +0900"
    role: "RTL Implementation"
    phase: "Phase 6 step 4 passive sink final-beat binding correction"
    verification_input: "phase6-vcs-dma-interface-contract-gates-retry-94"
    diagnosis:
      observed_sequence: "The existing qparam trace accepted one-beat sequences 0 and 1 at 225/235 ns, then deliberately held sequence 2 while destination_ready=0. At 275 ns the TB restored ready and the production destination write fired correctly; the existing qparam destination checker accepted sequence2/beat0/last with the expected address and payload before the passive monitor fatal."
      actual_channel: "While stalled, gemm_bus_if.req_valid, req_data, drain owner/sequence/beat and monotonic writer release remain authoritative and stable. The monitor stored that tuple. There is no consume+refill turnover because the write had not fired and the writer head/count cannot advance under ready-low."
      root_cause: "The passive binding incorrectly connected `write_last` to `destination_last_write`, which is the accepted-final-write event and therefore includes req_ready. It was 0 throughout the genuine valid&&!ready hold and became 1 on the release edge solely because ready rose, making the monitor report a held tuple change even though payload ownership was unchanged. VCS's started/failed-at-275ns wording reflects the immediate assertion check on that release edge, not a first-stall-cycle sampling race. The same latent misbinding existed in both overlap monitors and the NAIVE gather sink monitor."
    fix:
      - "Changed both VX_lmem_dma_input_overlap and VX_lmem_dma_weight_overlap passive sink bindings so `write_last` is `req_valid && (writer_count + 1 == descriptor_total)`, independent of destination ready. `install_complete` remains ctrl_if.write_done/destination_last_write and therefore still denotes only the accepted final physical write."
      - "Changed the NAIVE Weight gather passive sink binding analogously to `retire_valid && (retired_groups + 1 == total_groups)` while retaining ctrl_if.write_done as the final accepted install event."
      - "Did not modify VX_gemm_dma_sink_if assertions: strict next-cycle valid&&!ready tag/payload/owner/release/last stability, owned/released acceptance and exact install-complete equality remain unchanged. The existing qparam directed stall is the focused reproducer, so no TB change was necessary."
    hard_rule: "none; this corrects passive metadata/event classification only and does not feed any production datapath, ready, writer-fence or completion signal"
    changed_files:
