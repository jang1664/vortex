  - id: phase0-rtl-dma-width-audit-4
    status: test_request_correction
    time: "2026-08-22 01:29 +0900"
    role: "RTL Implementation"
    phase: "Phase 0B"
    verification_input: "phase0-vcs-naive-node-3"
    diagnosis:
      - "The reported in=8/out=8 gearbox is the DCache-side identity gearbox inside an overall unequal-width generalized DMA path, not the production endpoint contract. The node TB fixes DCACHE_BYTES=LSU_WORD_SIZE=8 while its LMEM side is 32*8=256 bytes, so the enclosing path is actually 8B-to-256B (32:1)."
      - "VX_dma_misal_gen_path independently requires both endpoints to be power-of-two widths >=16 bytes and the maximum width ratio to be <=8:1. Relaxing only the identity gearbox assertion would therefore hide the first symptom and immediately expose the enclosing path's two real contract violations."
      - "The production Phase-0 config has NUM_THREADS/NUM_LSU_LANES=32, L1_LINE_SIZE=64, DMA_DCACHE_PORTS=1, and LMEM_NUM_PORTS=32. VX_core therefore connects a 64-byte aggregate DMA DCache interface, while VX_dma_node builds a 256-byte LMEM interface: the intended supported production conversion is 64B-to-256B (4:1)."
      - "The same one-lane 8-byte gemm_node TB topology was previously recorded as the blocker in agent-tasks/can-coalesce-dim0-pipeline/STATUS.yaml; this WLOAD8 change did not create it."
    decision: "No production RTL change. An 8B-to-256B generalized DMA is outside the documented and asserted production contract, and weakening VX_dma_gearbox would mask rather than fix the testbench topology defect."
    hard_rule: "none in production RTL; verification must model the production 64B DCache endpoint before numerical WLOAD8 testing can proceed"
    static_validation:
      - "Audited the failing hierarchy through VX_dma_misal_gen_path and confirmed that its dcache_source_gearbox has IN_BYTES=DCACHE_BYTES=8 and OUT_BYTES=MIN_BYTES=8 only because the enclosing endpoints are 8 and 256 bytes."
      - "Audited VX_core/VX_config-derived production widths: DCACHE_WORD_SIZE=min(32*8,64)=64 bytes and DMA_DCACHE_PORTS=1; VX_dma_node LMEM_WIDE_BYTES=32*8=256 bytes, yielding the supported 4:1 ratio."
