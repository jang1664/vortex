  - id: phase5-tb-improve-dma-completion-acceptance-contract-84
    status: static_pass
    time: "2026-08-27 01:33 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 deterministic IMPROVE global-DMA completion endpoint contract correction"
    verification_input: "phase5-vcs-improve-supported-qblk-deterministic-83"
    audit:
      child_identity: "IMPROVE VX_gemm_ctrl child 5 is the tagged global HBM/TMEM DMA command child. OP_DMA_LD and OP_DMA_ST route to index 5; indices 0..4 are Input, Weight, Scale, Zero-point and Output/ACC2LMEM. Child 5 uniquely uses a tagged inflight scoreboard and a decoupled command valid/ready contract."
      start_semantics: "gemm_ctrl_if.dma_ctrl.start and cmd_valid are the same held-valid level from the child queue. VX_gemm_ctrl defines the authoritative logical issue as child_issue_fire_v[5] = start && dma_flag.cmd_ready, pops the command queue only on that handshake, allocates exactly one DMA tag/inflight record on it, and clears that record only on the matching tagged completion. Unlike local child start signals, raw child-5 start is not a one-cycle fire and may remain high while VX_gemm_tmem_dma_ctrl is backpressured."
      done_semantics: "VX_gemm_tmem_dma_ctrl asserts done only at logical_complete: every active physical channel has completed, prepared data is released, and a chunked store is on its last chunk. done_tag restores the logical load/store owner. VX_gemm_ctrl rejects a stray tag, inflight overflow and completion without the matching valid record. Therefore one accepted logical command has one scheduler retirement even if the executor internally programs multiple channels or store chunks."
      iteration83_classification: "The observed child5 start=72/done=24 compared raw valid-high cycles against logical completion pulses. It does not mean three accepted starts per completion and is not evidence of segmented-completion loss. The authoritative accepted-start cardinality is 24, equal to the 24 tagged done/retire events; the numerical, metadata, four-bank ACC and production ownership checks completed before the stale TB fatal."
    authoritative_formula:
      global_loads: "Four logical global loads (Input, Weight, Scale, Zero-point) are emitted per DMA tile: 4*ceil(M/128)*ceil(N/128)*ceil(K/128). QBLK and QDIR change Scale/ZP descriptor sizes and layouts, not their logical command count."
      global_stores: "Only the last K tile stores output, with one OP_DMA_ST per 32-column output microtile: ceil(M/128)*ceil(N/32). Store chunking inside VX_gemm_tmem_dma_ctrl remains one logical tagged completion."
      total: "child5 accepted starts = child5 done = 4*ceil(M/128)*ceil(N/128)*ceil(K/128) + ceil(M/128)*ceil(N/32). For M=4,N=K=256 this is 4*1*2*2 + 1*8 = 24 for every QBLK={32,64,128} and both QCOL/QROW."
    fix:
      - "Changed only the existing gemm_node_improve completion endpoint monitor: child5 start_count now increments on dma_ctrl.cmd_valid && dma_flag.cmd_ready instead of raw dma_ctrl.start. Children 1..4 retain their existing pulse counters and exact architectural endpoint checks."
      - "Kept every production endpoint assertion and TB requirement intact: child done must equal its architectural endpoint, every done must pop the scheduler, global DMA done must include current-cycle all-channel completion, local wrapper-done must not retire, and start/done accepted cardinality must balance."
    hard_rule: "none; the production tagged issue/completion contract is balanced and the failure is an objectively stale TB monitor that treated a decoupled valid as a fire"
