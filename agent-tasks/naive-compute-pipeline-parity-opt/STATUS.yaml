      focused_test: "Added a stable binding endpoint and directed timing checks to the existing Weight focused TB: same-cycle request reuse of the currently released drain slot is fatal, at least one following-cycle reuse of that slot is required, and a PASS marker reports the exercised count. Existing reverse 7..2,0,1, logical128B, backpressure, four-beat, fence, completion and reset coverage remains intact."
