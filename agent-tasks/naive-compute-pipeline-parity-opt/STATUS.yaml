  - id: phase5-rtl-m64-weight-count-contract-audit-78
    status: analyzed_no_change
    time: "2026-08-27 00:31 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 NAIVE WLOAD8 M64 Weight-fire count contract audit"
    verification_input: "phase5-xrt-vcs-m64-supported-qblk-matrix-77"
    audit:
      - "The M64 QBLK32 QCOL execution is functionally clean: all 16384 outputs matched, Input fire=4096, ACC read/write=3584/4096, scaler/output=4096/4096, Weight fire=256 with zero Weight stall, and there was no production assertion, ownership, stale/duplicate, mixing/drop or shutdown failure. The iteration-77 sim_fail is exclusively an incorrect external expected count of 512."
      - "VX_config.vh defines the NAIVE DMA tile as MT=NT=KT=128 and the compute microtile as MXU_KT=MXU_NT=32. The FSM derives mt_dim=ceil(target_M/128), nt_dim=ceil(target_N/128), and kt_dim=ceil(target_K/128); its scan order is kt then mt then nt."
      - "For each live DMA tile, nt_mxu_dim=ceil(nt_eff/32) and kt_mxu_dim=kt_eff/32. Exactly one OP_W_LDMA_MXU command is issued for each (nt_mxu,kt_mxu), before OP_I_LDMA_ARM streams mt_eff Input rows through that resident Weight bank. Thus a Weight microtile is intentionally reused across every output row within one up-to-128-row M tile; it is reloaded when the FSM advances to a distinct M tile and is not reused across the 128-row tile boundary."
      - "Each OP_W_LDMA_MXU command is exactly 32*(32/2)=512 bytes. Under explicit WLOAD8, GEMM_WEIGHT_DATA_SIZE=32*8*4/8=128 bytes and W_LMEM_DMA_CMD_BEATS=32/8=4. VX_lmem_weight_gather_dma emits one accepted common-core Weight request per assembled 128-byte beat, and VX_gemm_compute_core's PERF weight counter increments on that exact weight_bus_if valid&&ready handshake. The counter therefore observes four fires per Weight microtile command, not one fire per Input row."
    authoritative_formula: "For supported K divisible by 32, Weight_fire = ceil(M/128) * ceil(N/32) * (K/32) * 4. Equivalently, sum over all DMA (mt,nt,kt) tiles of ceil(nt_eff/32) * (kt_eff/32) * W_LMEM_DMA_CMD_BEATS. For N=K=256 this reduces to 256*ceil(M/128)."
    thresholds:
      M4: "mt_dim=1; Weight fire=256"
      M32: "mt_dim=1; Weight fire=256"
      M64: "mt_dim=1; Weight fire=256"
      M128: "mt_dim=1 exactly because zero remainder maps to m_last=128; Weight fire=256"
      M256: "mt_dim=2; Weight fire=512"
      boundary: "M=1..128 uses 256 fires; M=129..256 uses 512 fires for N=K=256. The step occurs at the 128-row DMA-tile boundary, not at the 32-row MXU width."
    evidence:
      - "The existing M4 QBLK32/QBLK64/QBLK128 QCOL/QROW gates consistently report Input=256 and Weight=256. M32 QBLK32/QBLK64/QBLK128 QCOL/QROW consistently report Input=2048 and Weight=256. Both shapes occupy one M tile despite different numbers of Input rows."
      - "The existing M256 QBLK32 QCOL and QROW gates report Input=16384 and Weight=512, exactly matching two 128-row M tiles. M64 iteration77 reports Input=4096 and Weight=256, completing the same formula's intermediate evidence."
      - "The other M64 exact counts independently validate the loop geometry: Input/write=64*8*8=4096 and ACC read=64*8*7=3584, where eight N microtiles and eight K microtiles are used and only the first K microtile omits the accumulator read. There is no missing compute work that could be masked by the lower Weight count."
    decision: "Weight fire=256 is authoritative for M64,N=K=256 and for M128,N=K=256. No production RTL, counter, FSM, generation, address, testbench, plan, config or simulation artifact was changed. The iteration-77 first case should be reclassified as a functional/count PASS after correcting the external Weight expectation, then the remaining M64 supported-QBLK matrix should continue."
    hard_rule: "none; this is a verification-contract correction supported by the production FSM and exact accepted-request counter, not a functional masking case or RTL defect"
    changed_files:
      - "agent-tasks/naive-compute-pipeline-parity-opt/STATUS.yaml (count-contract audit and corrected Test Request only)"
    static_validation:
      - "Read-only source audit covered VX_gemm_fsm_naive tile dimension/scan and WLOAD issue states, VX_config.vh MT/NT/KT/MXU/WLOAD8 width derivations, VX_lmem_weight_gather_dma retire handshake, VX_gemm_node_naive bus wiring, and VX_gemm_compute_core's accepted Weight-fire counter."
      - "The derived N=K=256 table is internally exact: M={4,32,64,128,256} maps to Weight fire={256,256,256,256,512}; the recorded M4, M32, M64 and M256 observations all match. No RTL compile was necessary because no production RTL or TB changed."
      - "STATUS YAML parsing, exact iteration-id cardinality, git diff --check, and untracked STATUS whitespace validation passed after append. No simulation was run."
    test_requests:
      - test_type: "blackbox"
        test_path: "build/tests/regression/fpint_gemm_ffn_hw_naive through configured build/ci/run_black.sh xrt-vcs-sim"
        test_params: "Retry the M=64,N=256,K=256,WTRANS=0 supported matrix in strict order: QBLK32 QCOL/QROW, QBLK64 QCOL/QROW, QBLK128 QCOL/QROW, all --perf 3 under the exact NAIVE WLOAD8 config. Reuse the validated simv only if SHA/config/source freshness remain exact; otherwise rebuild. Stop on the first genuine failure."
        sim_tool: "xrt-vcs-sim"
        changed_files: []
        notes: "Use the corrected exact gate for every M64 case: numerical outputs=16384, Input fire/stall=4096/0, Weight fire/stall=256/0, ACC read/write/scaler/output=3584/4096/4096/4096, underflow/conflict=0/0, no ownership/stale/duplicate/mixing/drop, and clean shutdown. The already preserved iteration-77 QBLK32 QCOL result may be recorded as PASS if freshness/artifact identity are retained, but rerunning it is acceptable for a uniform matrix. Keep QBLK16, M128/256 and WTRANS1 excluded in this verification turn."
