  - id: phase6-rtl-stream-dma-queue-isolated-98
    status: static_pass
    time: "2026-08-27 03:08 +0900"
    role: "RTL Implementation"
    phase: "Phase 6 step 5 isolated common GEMM stream-DMA queue"
    verification_input: "phase6-xrt-vcs-dma-interface-contract-blackbox-97"
    design:
      descriptor_ownership: "Added isolated VX_gemm_stream_dma_queue with CMD_FIFO_DEPTH restricted statically to 1 or 4, independent fetch/install pointers, a bounded descriptor count and parameterized wrapping sequence number. Accepted nonzero descriptors store only command id, total beats and opaque `{source_metadata,destination_metadata}`. Accepted zero-size descriptors are explicit no-ops: they remain ready even at nominal FIFO capacity but allocate no descriptor, request or slot and never become progress-valid. Same-cycle final install pop plus descriptor enqueue reuses the retired entry without reducing capacity."
      fetch_and_slots: "The fetch head emits `{opaque source metadata,beat}` with a bounded slot tag. A power-of-two response-slot table owns `{command index,sequence,beat}` plus completed logical response data. Requests hold their tag/payload until source acceptance; responses may return out of order and are accepted only for a live WAIT_RSP tag with matching descriptor sequence. Duplicate/stale tags are backpressured. Descriptor requested/fetched counters and per-owner final fetch completion are updated only on actual request/response handshakes."
      ordered_install: "The install head searches only a READY slot whose command/sequence/beat equals its next write count, emits `{opaque destination metadata,beat,data}`, and advances installed progress only on the actual sink handshake. External registered writer_release_i gates write valid for W/S/Z fences. Final-beat metadata is ready-independent; install completion is exactly the accepted final write. Fetch and install completion export their own command id and sequence."
      turnover_and_latency: "When all slots are occupied, an accepted ordered sink write can recycle that exact slot to a new source request in the same cycle. This creates only a one-way sink-ready to source-valid opportunity; sink valid never depends on source request/response ready, so there is no combinational source/sink ready loop. Response data uses direct-indexed bounded slot registers and the module encodes no mandatory payload-RAM latency. That keeps both a future NAIVE gather adapter and the current IMPROVE synchronous-RAM schedule possible; no Hard Rule is reached while the module remains isolated."
      interface_adjustment: "Corrected VX_gemm_dma_fetch_if.queue ownership of rsp_last: the queue, not the backend source, derives final-response status from authoritative descriptor progress. The interface now explicitly permits an accepted zero-size no-op while retaining the rule that progress_valid always has a nonzero total. Existing passive monitors and operand paths remain unchanged."
      isolation: "No existing NAIVE or IMPROVE operand DMA instantiates the new queue. VX_lmem_dma_misal, VX_lmem_weight_gather_dma, VX_tmem_subsystem, scheduler, bank mapping, row/tile address equations, WLOAD assembly, VX_dma_unit/node/engine and all runtime schedules are untouched. Product source generation auto-discovers the new core/gemm SystemVerilog file; only the new focused-test manifest was added."
    assertions:
      - "Static depth, slot power-of-two, tag capacity and every fetch/sink field width are checked without an unsized wide shift."
      - "Runtime assertions cross-check live descriptor/slot scans against registered occupancy, descriptor progress `installed<=fetched<=requested<=total`, owner/fence validity, zero-size no-allocation and request/response/write bounds."
      - "Phase-6 fetch/sink interface assertions retain held valid/payload/tag/owner/release/last stability and bounded request-before-response/no-duplicate ownership."
    hard_rule: "none; direct-indexed bounded response storage leaves physical RAM latency outside the common contract, and the module is not yet connected to either backend"
