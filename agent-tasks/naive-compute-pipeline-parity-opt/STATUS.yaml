  - id: phase6-rtl-qparam-binding-contract-fix-111
    status: static_pass
    time: "2026-08-27 04:30 +0900"
    role: "RTL Implementation"
    phase: "Phase 6 step 8a focused qparam shared-queue binding-check correction"
    verification_input: "phase6-vcs-qparam-stream-dma-queue-focused-failure-110"
    root_cause:
      classification: "focused TB contract defect; production shared-queue configuration is correct"
      evidence: "The failing line combined three checks. VX_lmem_dma_qparam_queue instantiates VX_gemm_stream_dma_queue with RING_SLOT_ORDER=1 and SINK_PIPELINE=1 in production, and the four direct queue-array checks immediately before line265 had already passed. The remaining check incorrectly required `$bits(dut.u_overlap.dma_fetch_if.req_tag)==8`. The focused Makefile defines NDEBUG, so VX_gpu_pkg selects UUID_WIDTH=1; VX_mem_bus_if splits its TAG_WIDTH=8 into uuid[0:0] plus value[6:0]. The qparam queue correctly receives LMEM_TAG_VALUE_W=TAG_WIDTH-UP(UUID_WIDTH)=7, not eight. Iteration110 therefore failed before functional stimulus solely because the TB compared the queue-visible tag-value field against the aggregate memory tag width."
    fix:
      tb_contract: "Removed the hard-coded aggregate width and child-parameter XMRs. The TB now compares the adapter's declared fetch-tag width against `$bits(lmem_bus_if.req_data.tag.value)`, which is the actual field carried by request/response ownership, and checks stable adapter-boundary mode markers for shared queue, modulo ring and registered sink. Existing structural XMRs to the queue-owned command arrays remain and had already proven that u_stream_queue is elaborated and authoritative."
      debug_marker: "Added constant qparam adapter debug endpoints `dbg_overlap_shared_queue_bound`, `dbg_overlap_fetch_tag_width`, `dbg_overlap_ring_slot_order` and `dbg_overlap_sink_pipeline`. These expose the elaborated contract without reaching into simulator-dependent child parameter representations. They do not feed a datapath, ready path, scheduler signal or completion signal and therefore cause no functional production change."
      preserved: "No descriptor, slot, source address, destination address, writer fence, Scale/ZP RID, priority, install/generation, Input, Weight, Output, NAIVE, common queue or TMEM behavior changed. All focused functional assertions and stimulus remain intact."
    hard_rule: "none; the failure was a stale aggregate-versus-value tag-width assertion, and the correction is a nonfunctional debug/TB contract repair"
    changed_files:
