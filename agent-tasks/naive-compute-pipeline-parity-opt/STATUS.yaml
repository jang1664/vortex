pitfalls:
  - "Do not validate a wide tag capacity with an unsized `1 << TAG_WIDTH`: debug UUID widths can exceed the host integer width and make the shift wrap to zero even when the tag is ample. Compare logarithmic widths directly or use a deliberately wide typed constant."
  - "The legacy NAIVE config name does not reveal that it inherits WLOAD4; inspect the elaborated define manifest."
  - "Standalone Verilator lint of an interface-port module gives default interface widths; use a width-owning wrapper or full hierarchy."
  - "The existing gemm_node Verilator hierarchy has two identical WLOAD4/WLOAD8 errors from $bits(interface.req_data); they are not Weight-width regressions."
  - "The gemm_node VCS Makefile omits an explicit top and can elaborate unused interface modules as tops; direct static compile must name tb_VX_gemm_node."
  - "An 8B-to-8B identity gearbox in the gemm_node hierarchy can be only the narrow-side adapter of an unsupported 8B-to-256B generalized DMA; inspect the enclosing endpoint ratio before relaxing an identity-path assertion."
  - "A PSUM pending counter counts narrow-lane credits, not wide writes: eight queued 16-lane writes require representing 128, so a seven-bit counter can alias a nonempty set to zero and admit a stale read."
  - "Do not assign an entire packed memory-bus request across unequal tag widths: it shifts address/flags as well as truncating the tag. Use the tag-aware _EX interface assignment so only the tag is adapted."
  - "A focused NAIVE job must program the external FP32 PSUM base at registers 40/41 and allocate it separately. Leaving the pair zero aliases PSUM with IBUF0 and produces correctly ordered reads of Input data that look like a PSUM fence failure."
