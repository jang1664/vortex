  - id: phase6-rtl-dma-interface-contracts-91
    status: static_pass
    time: "2026-08-27 02:22 +0900"
    role: "RTL Implementation"
    phase: "Phase 6 step 4 backend-independent operand-DMA interface contracts"
    verification_input: "phase5-acceptance-phase6-dma-audit-90"
    design:
      fetch_contract: "Added VX_gemm_dma_fetch_if with an accepted descriptor channel, opaque command/request/response payloads, tagged source request/response ready-valid channels, authoritative response ownership/final-response indication, descriptor-derived request/response progress, bounded slot occupancy and a fetch-complete event. Simulation assertions enforce valid&&!ready stability, nonzero accepted descriptors, request-before-response ownership, no duplicate live request tag, no accepted duplicate/stale response, bounded tag/slot occupancy, response<=request<=total progress, exact final-response completion and reset cancellation. The bounded tag scoreboard supports response reorder, zero-latency response and same-cycle response/request tag reuse without storing backend addresses or layout semantics."
      sink_contract: "Added VX_gemm_dma_sink_if with opaque tagged destination writes, explicit write ownership, registered writer-release permission, final-write indication, descriptor-derived install progress and install-complete. Assertions enforce held write payload/tag/owner/release/last stability, forbid unowned or fenced accepted writes, keep write progress below the descriptor total, and require install completion to be exactly the accepted final destination write. Fetch completion and install completion remain distinct by construction."
      transparent_bindings: "Bound fetch+sink interfaces as SYNTHESIS-excluded passive monitors inside the existing IMPROVE Input/qparam and Weight overlap executors. Every monitor input is assigned only from existing descriptor, source-bus, response-slot, writer-fence and destination-bus signals; no monitored signal feeds a production ready/valid/control/data path. Bound only the sink interface in NAIVE VX_lmem_weight_gather_dma because its sixteen private lane responses complete directly into a slot and there is no honest logical fetch-response ready/valid boundary yet; aliasing ordered retire to fetch completion would violate the plan's separate fetch/install ownership. The gather's source-side interface remains a Phase-6 queue/source-adapter extraction task."
      unchanged_ownership: "VX_dma_unit, VX_dma_node, VX_dma_engine, descriptor storage, response RAMs, slot state, command heads, scheduler priority, writer fences, address/layout equations, generation install, WLOAD8 lane assembly, PSUM/final paths and all ready equations are unchanged. VX_gemm_stream_dma_queue was not created or integrated."
    hard_rule: "none; simulation-only passive bindings cannot alter synthesis or cycle behavior, and the NAIVE gather deliberately avoids a false fetch binding until a real bounded logical response channel exists"
    changed_files:
      - "hw/rtl/core/gemm/VX_gemm_dma_fetch_if.sv"
      - "hw/rtl/core/gemm/VX_gemm_dma_sink_if.sv"
