      - "Scaled-result matching, ACC request/response tags, held requests, pending-result and d1/d2 forwarding tags, committed history, write requests, and accept/retire ownership events now use acc_txn_tag. Logical scheduler/consumer reporting continues to use work_seq unchanged."
