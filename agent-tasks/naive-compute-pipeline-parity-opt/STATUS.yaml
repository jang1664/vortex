        test_params: "Return to the confirmed QBLK32 gates. Force a fresh NAIVE WLOAD8 compile and rerun M4 QCOL/QROW smoke after the opcode-owner demux change, then the required M={4,256},WTRANS={0,1},QDIR={0,1},N=K=256,QBLK=32 8-case matrix and focused IMPROVE common-core regression."
