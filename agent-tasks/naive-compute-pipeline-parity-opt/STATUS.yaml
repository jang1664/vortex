  - id: phase5-rtl-psum-read-ooo-join-60
    status: static_pass
    time: "2026-08-26 22:32 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 bounded cross-set PSUM read OOO join"
    verification_input: "phase5-rtl-postfix-residual-audit-59 and the confirmed 2026-08-26 plan update, especially sections 4.5, 8.3, Phase 5 steps 7-12, and Hard Rule 12"
    implementation:
      - "Added production VX_gemm_psum_read_ooo_join with PHYS_RESPONSE_SLOTS=4 and RESPONSE_FIFO_DEPTH=2. Each accepted 128-byte read captures the original logical ACC tag, physical set, address, flags and request payload in a bounded slot. A registered allocation/issue sequence preserves wide-request issue order while isolating wide request readiness from physical LMEM lane ready."
      - "The sixteen 64-bit lane requests carry only the zero-extended physical slot ID. Per-lane responses directly index slot_data[slot][lane] and a sixteen-bit response bitmap; no associative logical-tag search or lane-head coincidence is used. A slot becomes complete only when all sixteen owned lane responses are present."
      - "A completed slot restores its original ACC tag and enters a two-entry tagged FIFO. The last skewed lane and FIFO push may occur in the same cycle using next-state bitmap/data, but slot ownership is cleared and becomes allocatable only on the successful FIFO push. FIFO full preserves complete slot data; valid-without-ready preserves the output tag/data."
      - "Added production static/runtime contracts for power-of-two bounded capacity, physical tag fit, all-lane read shape, no live-slot reuse, no ownerless/duplicate/stale lane response, complete-only FIFO push, set-metadata stability, lane request hold, and wide response hold. Reset clears slots, lane ownership, issue/allocation sequence, and the response FIFO."
      - "Replaced only VX_gemm_node_naive's PSUM read VX_mem_bus_split instance. Input/S/Z/output/final and PSUM-write generic splitters remain unchanged. Pending/current PSUM-write set fences and the existing per-lane read/write arbiters remain the physical grant and RAW authority. Removed only the obsolete node read-read active-set drain counter/fence."
      - "Removed VX_gemm_acc_lmem's same-active-set issue filter now that the node has independent response assembly. It still selects the oldest accepted unissued slot, retains its exact older-write RAW scan, registers a held request under LMEM backpressure, preserves per-tag response demand/join, and keeps the bounded physical outstanding count. No common-core, IMPROVE adapter/runtime, FSM/address, PSUM-write, final-write, generic splitter, or LMEM mapping logic changed."
    safety:
      - "Capacity is finite at four physical assembly slots plus two complete responses. An accepted read reserves its assembly storage before any lane request; therefore arbitrary lane skew cannot require unbounded buffering or drop a response."
      - "Different sets may now be physically outstanding because every lane response carries a unique live slot ID and writes one fixed lane index. Logical completion order may differ, but VX_gemm_acc_lmem restores/join-delivers the stored original tag and the common core remains transaction-tag authoritative."
      - "There is no combinational LMEM-ready to common Input-ready path: wide request acceptance depends only on registered slot-valid state, and each physical request is emitted from captured slot metadata. The adapter's existing issue hold preserves valid/payload when the node or lane arbiter stalls."
      - "Slot reuse cannot precede complete-FIFO ownership transfer. Duplicate or stale lane responses receive ready=0 and trigger a production simulation assertion if held valid through a clock edge. Reset invalidates every owner so post-reset stale responses cannot be consumed."
    hard_rule: "none; the cross-set behavior is contained entirely in the new NAIVE PSUM-read bounded join and the two local read-read issue restrictions. Generic VX_mem_bus_split, IMPROVE ACC/common core, row-major mapping, PSUM write ownership, final semantics, and LMEM topology are unchanged, satisfying Hard Rule 12."
    changed_files:
      - "hw/rtl/core/gemm/VX_gemm_psum_read_ooo_join.sv"
      - "hw/rtl/core/gemm/VX_gemm_node_naive.sv"
