  - id: phase5-rtl-lmem-acc-prefetch-batching-55
    status: static_pass
    time: "2026-08-26 20:09 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 NAIVE LMEM accumulator read-overlap performance fix"
    verification_input: "phase5-xrt-vcs-psum-shadow-fix-52, phase5-xrt-vcs-required-wt0-matrix-53, and phase5-xrt-vcs-m4-qcol-fsdb-capture-54"
    fsdb_analysis:
      artifact: "build/run_logs/naive_compute_pipeline_parity_opt/iteration54_phase5_m4_qcol_fsdb/m4_qcol_wt0.fsdb"
      identity: "size=35,252,976 bytes; sha256=0fda0e832feedfd3db060c26699e3b68ab9faaeb703ec3b5761f2e1b6557420f"
      scope: "/tb_vcs_xrtsim/dut/vortex_axi/vortex/g_clusters[0]/cluster/g_sockets[0]/socket/g_cores[0]/core/gemm_node_naive"
      counts: "All transaction stages balance exactly: 224 txn_accept entries with rd_en, 224 common-core rd_req handshakes, 224 physical PSUM LMEM requests, 224 physical responses, and 224 common-core responses. The core launched 256 post transactions and the adapter accepted 256 writes. Read tags at txn_accept, core request, and core response are unique and exactly ordered (tags 16..255 excluding the 32 load-only transactions); write tags are 0..255."
      latency: "txn_accept->core rd_req min/max/mean=12/33/19.723 cycles with histogram {12:112,21:3,22:53,32:3,33:53}; core rd_req->physical request=0/12/8.741 with histogram {0:56,10:2,11:54,12:112}; physical request->response is exactly 11 cycles for all 224; physical response->core response is exactly 1 cycle for all 224; every core response coincides with post_txn_launch; core response->write is 1 cycle for 192 and 2 cycles for 32. End-to-end txn_accept->write is 25..59 cycles, mean 41.607."
      serialization: "Every one of the 56 four-read commands issued physical reads in exactly 36 cycles and received them over exactly 36 cycles. The physical bank-set sequence is exactly 0,1,0,1 for every command, confirming that the node's mandatory cross-set drain fence serializes the alternating logical request order."
      stalls: "Over the 69.035us..128.915us read window (5,988 clocks): set-switch/order block=1,846 cycles, current-write conflict=96, pending-write conflict=192, adapter exact-address RAW=1,216, core rd_hold=1,173, and adapter issue_hold=1,958. No-slot while a core request was present=0 and post-full=0. Max read_slot_valid=2, issued/outstanding=1, psum_rd_outstanding_r=1, post_txn_count=3, and accepted txn_count=4. Thus neither POST_TXN_DEPTH nor READ_SLOTS capacity is the primary cause."
    root_cause: "The old adapter learned a PSUM read only at the common core's rd_req, 12..33 clocks after txn_accept, and then presented requests in alternating set order. The NAIVE node correctly drains the current set before switching, so only one read could be outstanding and the fixed 11-cycle LMEM latency was paid four times per command. The existing eight-slot tagged backend and early txn_accept metadata were sufficient to overlap and group these reads; no core-depth or topology expansion was needed."
    changes:
      - "In hw/rtl/core/gemm/VX_gemm_acc_lmem.sv, allocate an opportunistic bounded read slot from txn_accept tag/rd_en/rd_addr. Core read demand has priority for the final free slot, lack of speculative capacity never backpressures txn_accept/Input, and the original demand-time late allocation remains the fallback."
      - "Retain each prefetched response by slot/full core tag until the normal common-core rd_req handshakes, then deliver it through the existing registered response hold. Core rd_req_ready is isolated from physical LMEM ready and depends only on authoritative accepted ownership plus bounded slot capacity; valid&&!ready tag/data stability remains structural."
      - "Track physical outstanding reads and the active LMEM bank set. Select the oldest accepted unissued read when empty, then the oldest eligible read from that same active set while any physical read remains outstanding. This changes the NAIVE adapter's physical issue order only; common-core demand/response, post/write/retire order, opaque row-major address, and node set-switch fence remain unchanged."
      - "Before every physical issue, rescan the authoritative accepted-transaction ring and block the candidate behind any older exact-address write. Added slot transaction ownership, completion/data retention, duplicate-demand/address/live-slot assertions, physical outstanding bound, and response-retire completion checks. Final conversion/write and nonfinal write paths are unchanged."
    safety:
      - "Boundedness: READ_SLOTS remains 8 and TXN_DEPTH remains 64; prefetch never allocates beyond a free slot and cannot stall Input. Arbitrary physical response order remains rejoined by the existing LMEM slot tag."
      - "Ordering: only independent physical reads may be regrouped by bank set. An older same-address accepted write blocks physical issue, and common-core response visibility still requires the original rd_req handshake. Post transaction launch, write destination, in-order retirement, generation ownership, and final notify semantics are untouched."
      - "Isolation: no combinational LMEM-ready-to-Input-ready path was introduced. VX_gemm_compute_core.sv, VX_gemm_acc_internal.sv, VX_gemm_unit_v2.sv, IMPROVE runtime RTL, VX_gemm_fsm_naive.sv address equations, and VX_gemm_node_naive.sv LMEM topology were not changed in this iteration."
    hard_rule: "none; the waveform proved a bounded adapter-local scheduling opportunity. The implementation adds only READ_SLOTS-bounded address/data/completion state required to retain an early response; it adds no unbounded storage, forwarding, alternate completion authority, or fixed-path timing change."
