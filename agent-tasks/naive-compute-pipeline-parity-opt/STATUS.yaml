      common_queue: "Added parameter SAME_CYCLE_SLOT_RECYCLE, default 1, and gated only the existing sink_write_fire/request-slot availability clause. The default preserves the established isolated queue, Input and Scale/ZP same-cycle recycle contract and keeps the existing one-way sink-ready-to-source-valid path; no combinational source/sink ready loop was added."
