    status: analyzed_no_change
    time: "2026-08-26 20:50 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 post-prefetch M4 QCOL residual performance audit"
    verification_input: "phase5-rtl-lmem-acc-prefetch-batching-55 through phase5-xrt-vcs-m4-qcol-postfix-fsdb-capture-58"
    fsdb_analysis:
      artifact: "build/run_logs/naive_compute_pipeline_parity_opt/iteration58_phase5_m4_qcol_postfix_fsdb/m4_qcol_postfix.fsdb"
      identity: "size=33,561,469 bytes; sha256=532b419167ac65179250d9468833433169b6d67bd788c2fce6d5b8de3e994399"
      comparison_artifact: "iteration-54 prefetch baseline build/run_logs/naive_compute_pipeline_parity_opt/iteration54_phase5_m4_qcol_fsdb/m4_qcol_wt0.fsdb, size=35,252,976 bytes, sha256=0fda0e832feedfd3db060c26699e3b68ab9faaeb703ec3b5761f2e1b6557420f"
      exact_ownership: "Post-fix counts balance exactly: Input=256, read-bearing txn_accept/prefetch=224, core rd_req=224, physical req=224, physical rsp=224, core rsp=224, post launch=256, write/retire=256, nonfinal physical write enqueue=224, and final physical write=32. Read tags 16..255 excluding the 32 load-only tags are unique and exact at every stage; write/retire tags are exactly 0..255. late_read_alloc=0. Numerical/checker/ownership pass from -58 therefore has no hidden drop, duplicate, reorder, or terminal leak."
      latency_delta: "txn_accept->core rd_req changed from pre min/max/mean 12/33/19.723 to exactly 12 cycles for all 224. Post txn_accept->physical req is 1..15, mean 7.237, histogram {1:112,12:4,13:52,14:55,15:1}; core req->physical req is -11..3, mean -4.763, proving most physical reads launch before normal demand. Physical req->rsp is 11 cycles for 223 and 12 for one versus pre exactly 11; physical rsp->core rsp is 1 cycle for 113 and 2 for 111 versus pre exactly 1, because an early response remains hidden until normal demand. Core rsp->write is {1:48,2:104,3:8,5:8,13:48,15:8}; the longer cases are already-returned data waiting for the in-order common post/scaler schedule, not LMEM blockage. txn_accept->write is now 16..30, mean 24.487, versus pre 25..59, mean 41.607."
      batching_delta: "All 56 four-read commands changed from physical set sequence 0101 to 0011. Pre issue/rsp spans were exactly 36/36 cycles for every command; post issue spans are 15 cycles for 55 and 16 for one, and response spans are 14 for one, 15 for 54, and 16 for one. The read-active window fell from 5,988 clocks to 4,265. Max read-slot valid rose 2->4 and adapter/node physical outstanding rose 1->2; post_txn_count remains max3 and accepted txn_count max4."
      stall_delta: "Within the complete post read window, set-switch=0, pending-write conflict=0, current-write conflict=0, combined node order block=0, adapter candidate RAW=0, common-core rd_hold=0, adapter issue_hold=0, no-slot=0, and post-full=0 cycles. Pre values were respectively 1,846,192,96,2,134 combined-order,1,216 RAW,1,173 rd_hold,1,958 issue_hold,0 no-slot,0 post-full. In particular, the proposed conservative-RAW-after-physical-commit hypothesis is rejected: candidate RAW never asserts in the post-fix waveform, so a physical-write-completion relaxation cannot remove one cycle."
      command_and_tail: "The total counter is exactly job_active_q residency, cycles 5,986..11,259 inclusive =5,274. Pre/post controller boundaries are invariant: job-active start->first compute command fire=661 cycles; last compute command done->last output_store_done=71; output_store_done->controller done=7; last final physical write->last command done=3. Pre/post command/final milestones are first/last command fire 6,641/12,806 versus 6,647/11,122, command done 6,687/12,894 versus 6,693/11,181, final physical write 9,362/12,891 versus 8,616/11,178, and controller done 12,972 versus 11,259. The 1,719-cycle -54->-58 improvement and the remaining 374-cycle legacy gap are therefore inside the serialized 64-command compute region, not startup, final conversion/write, output DMA, or controller shutdown tail."
    residual_classification:
      - "At txn_accept the adapter sees one alternating logical PSUM address per Input handshake. For a representative command the first set-0 read issues immediately, its second set-0 peer becomes available only after the intervening set-1 acceptance, and both set-0 reads must complete the fixed approximately 11-cycle LMEM path before the preserved node wide-response coherence fence permits set 1. The resulting 15/16-cycle two-wave issue span is the minimum visible under the current metadata and no-cross-set-outstanding contracts."
      - "The legacy approximately-30-response startup watermark could hide this latency before its non-backpressurable compute burst. Phase 5 intentionally removed that watermark as a correctness dependency and supplies opaque ACC metadata only on actual common-core Input acceptance. Reaching the legacy 4,900-cycle number from 5,274 now requires one of: publishing future-command/transaction metadata before Input acceptance, allowing cross-set outstanding reads with new per-set wide-response assembly/ownership, changing the common-core post schedule, or retiring completion before the actual destination drain. None is an adapter-local correction allowed by this iteration."
    decision: "No production RTL change. The strict <=4900 QCOL gate is blocked by the confirmed physical-latency/metadata contract within the allowed scope, not by a remaining implementation bug. Use 5274 as the measured Phase-5 bounded common-path reference if the architecture is accepted; otherwise open an explicit design discussion for pre-admission ACC metadata or independent per-set response assembly. Do not weaken RAW, node set/write fences, response-before-demand protection, or completion semantics to force the legacy number."
    hard_rule: "A further <=4900 optimization cannot be guaranteed without violating at least one requested boundary: no cross-set fence bypass, no common-core/FSM/address/final semantic change, and no response delivery before normal demand. No unsafe change was made."
