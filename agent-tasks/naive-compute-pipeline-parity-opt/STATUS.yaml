  - id: phase5-acceptance-phase6-dma-audit-90
    status: analyzed_no_change
    time: "2026-08-27 02:18 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 final acceptance and Phase 6 operand-DMA steps 1-3 read-only audit"
    verification_input: "phase5-vcs-improve-prefetch-directed-and-supported-qblk-89"
    phase5_acceptance:
      decision: "PASS; every mandatory Phase-5 gate in the confirmed plan is backed by fresh focused, node, XRT or FSDB evidence through iteration 89. Phase 6 may open. QBLK16 remains excluded, and no WTRANS1 coverage beyond M4 is claimed."
      ooo_focused_and_integration: "Iterations 67 and 72 pass the four-slot/two-FIFO join, alternating-set ACC-LMEM adapter, fixed IMPROVE isolation and NAIVE M4 QCOL/QROW node gates. The focused join covers lane skew/reorder, held request/response, slot saturation/reuse, same-cycle complete/push, FIFO backpressure, stale/duplicate protection and occupied reset."
      strict_performance_fsdb: "Iteration 68 M4 QBLK32 QCOL XRT/FSDB passes numerical1024 and total/busy=4738/11824, 162 cycles below the legacy WLOAD8 4900 gate. It proves 563 cycles with simultaneous live issued incomplete set-0/set-1 slots, 168 issues while the opposite set remained incomplete, maximum join occupancy four and response-FIFO occupancy one, exact logical join/adapter/core request-response=224 each, physical lane request-response=3584/3584, exact restored tag/data, and terminal drain."
      minimum_xrt: "Iterations 68, 69, 70 and 73 pass M4 and M256 QBLK32 QCOL/QROW WTRANS0. Exact common-path counts are M4 Input/Weight=256/256 and ACC read/write=224/256; M256 Input/Weight=16384/512 and ACC read/write=14336/16384, with numerical, ownership and shutdown clean."
      supported_qblk: "Iterations 74 and 75 pass M4 QBLK64/128 QCOL/QROW in deterministic node VCS and XRT. Iterations 76, 79 and 80 pass the complete WTRANS0 M32/M64/M128 QBLK32/64/128 QCOL/QROW XRT matrix. Iteration 81 passes only the explicitly bounded M4 WTRANS1 QBLK32/64/128 QCOL/QROW XRT matrix; larger-M WTRANS1 was not run and is not represented as complete."
      improve_parity: "Iteration 82 passes matched IMPROVE XRT QBLK32/64/128 QCOL/QROW with the common VX_gemm_compute_core SHA f9c52629518f72087f68b5d5428865ccc6e79dab8fe4d2465133d4b2304a0e4d. Iteration 89 passes deterministic QBLK64/128 node lifecycle/ACC/completion contracts plus the positive gemm_ctrl and gemm_tmem_dma_ctrl prepare/release suites."
      watermark_contract: "The common NAIVE packetizer admits on actual source valid/ready and no fixed approximately-30-response watermark remains in the correctness path. Iteration-68 FSDB has offered Input fire/stall=256/0 and exact terminal ownership; the read-only stall classification below observes only actual bounded source/response/ACC state."
    phase6_step1_wload8_baseline:
      geometry: "GEMM_WEIGHT_DATA_SIZE=128 bytes, NUM_LANES=16, eight packed 16-byte rows per assembled beat and W_LMEM_DMA_CMD_BEATS=4. One command therefore owns four response slots, 64 physical 8-byte lane requests/responses and four ordered 128-byte common-core Weight writes."
      m4_qcol_exact: "64 Weight commands produce 4096 physical lane requests, 4096 lane responses, 256 common-core Weight writes and 64 generation advances. Input request/response/write=256/256/256. Scale and Zero-point each request/response/write/generation=64/64/64/64. ACC logical reads/responses=224/224, PSUM/final writes=224/32 and total ACC writes=256. All terminal owners are zero."
      shape_formula: "For supported K divisible by 32, Weight_write = ceil(M/128)*ceil(N/32)*(K/32)*4. At N=K=256 this is 256*ceil(M/128), matching M={4,32,64,128,256} observations {256,256,256,256,512}. Weight is reused across rows inside one MT=128 DMA tile."
      focused_lock: "The standalone lmem_weight_gather_dma gate remains the authoritative one-command lock: groups/requests/responses=4/64/64, every lane 0..15 participates exactly four times, two output backpressure cycles preserve payload, and all four wide writes retire in order."
    phase6_step2_fsdb_stall_audit:
      source: "Read-only analysis used iteration-68 m4_qcol_cross_set.fsdb (32952268 bytes, SHA bdca644885dc7b7210ab5e23178deb1647d341bd0b5ee4da923b829c0ffa7802) and sampled the existing packetizer, generic Input DMA, common-core, ACC adapter and OOO-join signals at the 10 ns clock contract. No waveform or source file was modified."
      source_empty: "Across 2922 packetizer-active cycles, ingress remained open for 2858. Input offered and fired 256 cycles with zero ready-low offer. There were 2666 ingress-open/no-offer cycles: 1635 with generic Input DMA occupancy zero are true command/source-empty time; 1031 had owned response slots and are response/assembly wait, subdivided into 843 cycles with no source response presented and 188 response-arrival/assembly cycles. Source request stall and destination write stall were both zero."
      response_wait: "The dominant measured response wait is the 1031-cycle Input source response/assembly class above. In the ACC post join, a live head waited for its PSUM response for only three cycles; ACC read request and response held-ready-low stalls were both zero. The OOO join independently proves cross-set response overlap rather than a fixed startup gate."
      install_wait: "Registered consumer_block_valid was zero for the entire capture and offered Input had zero ready-low cycles. W/S/Z writes and generation advances are exact, so no Weight/Scale/Zero-point install shortage backpressured this case."
      acc_wait: "No admission-visible ACC capacity wait occurred: post-full=0, rd-issue-hold=0 and Input ready-low offer=0. Bounded downstream activity comprised post live=402 cycles, scaler/data-arrival wait=135, ACC-response wait=3, launch-credit wait=8 and ACC write valid&&!ready=32; those waits overlapped source gaps and did not reduce the 256 offered Input handshakes."
      max_occupancy: "Input generic DMA slots=4/16; combined QCOL Scale/Zero generic DMA slots=1/16; NAIVE Weight gather slots=4/4; output generic DMA slots=0/16 in this direct-final-write case; PSUM OOO join slots=4/4 and response FIFO=1/2; ACC-LMEM read slots=4/8, physical outstanding=4/8 and transaction queue=4/64. Every observed structure ended at zero."
      classification: "Current M4 QCOL residual is source-empty plus real LMEM response/assembly latency, not install starvation, fixed startup watermark, slot overflow, ACC read-request backpressure or post-queue exhaustion. Phase 6 may refactor ownership only if it preserves these bounded counts and the 4738-cycle strict gate."
    phase6_step3_generic_dma_audit:
      shared_global_path: "hw/rtl/core/VX_dma_unit.sv selects the aligned or misaligned backend. NAIVE global descriptors originate in VX_gemm_dma_ctrl_naive and reach the core-level VX_dma_node, which instantiates VX_dma_unit. IMPROVE global descriptors pass through VX_gemm_tmem_dma_ctrl and VX_tmem_subsystem/VX_dma_engine, whose per-channel engines instantiate the same VX_dma_unit. Thus aligned descriptor, width-conversion, request-buffer and completion fixes are already shared by both global paths."
      naive_local_path: "VX_gemm_node_naive keeps contiguous Input, combined Scale/Zero and Output on VX_lmem_dma_misal, which delegates to VX_dma_unit with ENABLE_MISALIGN=1 and the configured 16 read slots. Weight alone remains VX_lmem_weight_gather_dma because row-major 16-lane assembly is backend-specific."
      improve_local_path: "VX_tmem_subsystem local Input, Weight, Scale and Zero use VX_lmem_dma_input_overlap, VX_lmem_dma_weight_overlap and VX_lmem_dma_qparam_overlap. These are bounded custom descriptor/slot/ordered-drain engines and intentionally do not instantiate VX_dma_unit; Output remains on generic VX_lmem_dma_misal. The IMPROVE Weight wide-switch 128-byte fragment join remains outside the future common queue."
      duplicated_ownership: "The overlap executors duplicate command-valid/descriptor arrays, read/write command heads, per-command request/response/write progress, physical response-slot owner/sequence/beat metadata, payload RAM and ordered drain. The qparam module specializes the Input engine with a two-bank writer fence; the Weight engine adds independent bank-consume ownership. NAIVE Weight gather duplicates a single-command four-slot ring around its 16-lane source adapter. These are the only Phase-6 queue-extraction candidates; address/lane mapping, TMEM fragment assembly, scheduler priority and final/ACC paths remain backend-owned."
      module_map:
        - "hw/rtl/core/VX_dma_unit.sv:12 wrapper; hw/rtl/core/VX_dma_unit_align.sv:31 aligned backend; hw/rtl/core/VX_dma_unit_misal.sv:17 bounded misaligned backend"
        - "hw/rtl/core/VX_dma_node.sv:3/96 NAIVE/global node wrapper and shared unit instance; hw/rtl/mem/VX_dma_engine.sv:30/155 IMPROVE multi-channel wrapper and shared per-channel unit"
        - "hw/rtl/core/gemm/VX_gemm_tmem_dma_ctrl.sv:11 and hw/rtl/mem/VX_tmem_subsystem.sv:184 global IMPROVE descriptor/channel ownership"
        - "hw/rtl/core/gemm/VX_lmem_dma_misal.sv:11/320 generic local wrapper; :513 Input overlap, :1298 qparam specialization, :1395 Weight overlap"
        - "hw/rtl/core/gemm/VX_gemm_node_naive.sv:1232/1253/1267/1288 local Input/Weight/qparam/Output ownership; hw/rtl/core/gemm/VX_lmem_weight_gather_dma.sv:5 NAIVE row-major gather"
      focused_tests: "Existing focused owners are hw/unittest/{dma,dma_node,dma_engine,dma_mem_unit,dma_mem_unit_misal,lmem_dma_misal,lmem_dma_input_overlap,lmem_dma_qparam_overlap,lmem_dma_weight_overlap,lmem_weight_gather_dma,gemm_tmem_dma_ctrl,tmem_wide_read_switch}; gemm_node and gemm_node_improve provide full hierarchy integration. Their Makefiles already name the relevant production sources explicitly."
    next_implementation: "Implement Phase 6 step 4 only: add backend-independent VX_gemm_dma_fetch_if.sv and VX_gemm_dma_sink_if.sv plus held-valid, accepted-progress, bounded-owner and reset protocol assertions/tie-offs. Connect them at adapter boundaries without replacing storage or changing valid/ready timing. Do not introduce VX_gemm_stream_dma_queue until the interface-only compile/count/cycle gate passes."
    hard_rule: "none; Phase 5 prerequisites are objectively closed and the next interface-only step can preserve the existing bounded storage, writer fences, held-valid semantics and backend-specific mapping. A shared queue extraction remains gated behind its own focused test."
    changed_files:
      - "docs/future_optim/gemv/gemm_naive/naive_compute_pipeline_parity_opt.md (evidence-backed Phase 5 closure and Phase 6 audit status/checklist only)"
      - "agent-tasks/naive-compute-pipeline-parity-opt/STATUS.yaml (this iteration only)"
    validation:
