  - id: phase5-rtl-psum-read-per-lane-ownership-fix-71
    status: static_pass
    time: "2026-08-26 23:41 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 bounded cross-set PSUM read OOO join partial-request response ownership fix"
    verification_input: "phase5-xrt-vcs-m256-cross-set-matrix-70"
    diagnosis:
      artifact: "build/run_logs/naive_compute_pipeline_parity_opt/iteration70_phase5_m256_cross_set_xrt/m256_qrow/m256_qrow.fsdb"
      identity: "size=36,976,580 bytes; sha256=79263d5be2100a53b1dc48f9af5b76721a6c093279664df539451bbcce1865e8"
      method: "Read the retained simv/wrapper logs first, then used tools/fsdb_cli to inspect only the join scope and the final 108000000..110405000 ps window around the production fatal. No simulation was run and the preserved artifact was not modified."
      slot3_lifecycle: "Slot 3 was allocated at 110265000 ps with slot_valid=0xf, allocation order=3, set=1 and its original logical metadata. It became the issue slot at 110305000 ps. Lanes 8..15 fired together at 110305000 ps (lane_req_fire=0xff00), while lanes 0..7 remained held, leaving slot_req_pending[3]=0x00ff and slot_req_done[3]=0 at 110315000 ps. At 110395000 ps lanes 8..15 returned with physical tag 3, including the reported lane 8 response. Slot 3 was still live and incomplete, and no FIFO push, slot free, reuse or tag truncation had occurred."
      root_cause: "The response owner predicate required blanket slot_req_done[slot], so a legitimate independently accepted lane response was rejected until every other lane request of the wide slot had fired. M256 QROW exposed normal LMEM latency shorter than the stall interval of the other eight lane arbiters. This was neither a duplicate/stale response nor premature complete/free/reuse."
    implementation:
      - "Changed only VX_gemm_psum_read_ooo_join response ownership to require that the responding physical lane's own request has been accepted: its pending bit is clear, or that exact lane fires in the current cycle. Live-slot, physical-tag, not-complete and per-lane not-already-received guards remain conjunctive."
      - "Included same-cycle lane request fire in ownership so a zero-latency physical backend cannot lose a valid response. Slot completion still requires the full sixteen-lane response bitmap, FIFO push remains the only ownership transfer/free event, and a slot remains unavailable for allocation until that registered transfer."
      - "Kept the production duplicate/stale assertion unchanged. A response without a live slot, without its own accepted request, after completion, or for an already received lane still receives ready=0 and triggers the assertion."
      - "Extended the focused join TB with the exact reproducer: hold lanes 0..7, accept lanes 8..15, return their tag-0 responses before slot_req_done, prove bitmap 0xff00 is retained with no wide response, then release/return the lower lanes and complete the original logical tag. Existing backpressure, FIFO, reorder, stale/duplicate and reset coverage remains intact."
    safety:
      - "The fix changes no capacity or ordering contract: PHYS_RESPONSE_SLOTS=4 and RESPONSE_FIFO_DEPTH=2 remain bounded, logical metadata remains slot-owned, and all sixteen direct-indexed lanes are still required before completion."
      - "No generic VX_mem_bus_split, VX_gemm_acc_lmem, VX_gemm_node_naive, IMPROVE/common-core, row-major mapping, pending/current PSUM-write RAW fence, per-lane arbiter, PSUM write or final destination logic changed. There is no new combinational LMEM-ready to Input-ready path."
      - "valid&&!ready lane request and wide response payload stability are unchanged. The newly accepted case is a response whose own request already crossed ready/valid; responses for a still-pending lane remain unowned."
    hard_rule: "none; the preserved waveform proves a local overly strict ownership predicate, and per-lane accepted-request ownership fixes it within the confirmed four-slot/two-FIFO architecture without weakening stale detection or crossing Hard Rule 12 boundaries"
    changed_files:
      - "hw/rtl/core/gemm/VX_gemm_psum_read_ooo_join.sv"
      - "hw/unittest/gemm_psum_read_ooo_join/tb_VX_gemm_psum_read_ooo_join.sv"
