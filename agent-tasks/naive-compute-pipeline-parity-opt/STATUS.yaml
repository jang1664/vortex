    role: "RTL Implementation"
    phase: "Phase 6 step 7 IMPROVE ordinary-beat Input overlap migration to the common stream-DMA queue"
    verification_input: "phase6-vcs-tmem-wide-read-switch-retry-104"
    design:
      input_only_migration: "Preserved the public VX_lmem_dma_input_overlap parameter/port boundary but replaced its private four-entry descriptor FIFO, eight response slots and ordered write drain with VX_gemm_stream_dma_queue. The adapter retains Input-only 3-D source address progression, TMEM request mapping/tagging, scheduler source gate and registered urgency/priority hold, destination Input-base mapping, sync tie-offs, completion/progress outputs and performance/debug counters. VX_tmem_wide_read_switch remains the sole 128-byte WLOAD8 fragment join; this ordinary-beat Input path adds no fragment assembly."
      common_queue_contract: "Extended the layout-agnostic queue with explicit FETCH_TAGW and opt-in RING_SLOT_ORDER contracts, an optional registered SINK_PIPELINE, fetch-head writer progress and consecutive install-ready-ahead reporting. The generic default retains the previously verified lowest-free slot selection; only the Input adapter selects modulo-ring allocation/install to preserve its exposed LMEM tag order. SINK_PIPELINE=1 reproduces the prior Input response-RAM read stage: a legal response becomes staged for destination write on the following registered boundary, held valid/tag/payload remain fixed until ready, and a consumed beat may stage the next ordered READY beat and recycle the released ring slot in the same cycle. Default SINK_PIPELINE=0 preserves the previously verified isolated queue path. WAIT_RSP slots are excluded from ready-ahead."
      qparam_isolation: "Renamed the prior implementation to private VX_lmem_dma_input_overlap_legacy and bound VX_lmem_dma_qparam_overlap directly to it. Scale/Zero therefore retain their destination-stride progression, writer generation fence, completion timing, XMR-visible ownership and all prior behavior; qparam was deliberately not migrated. Weight, Output, NAIVE DMA, TMEM arbitration and address/layout formulas are unchanged."
      timing_and_loop_safety: "Command acceptance still permits final-pop/enqueue turnover at depth four. Slot allocation and ordered installation remain modulo-eight rings, with response acceptance guarded by slot state plus command generation. The optional sink stage owns a DRAINING slot until actual destination fire. Sink ready can only make the released slot available to the source request side; source ready/response ready do not feed sink valid, so no combinational ready loop was introduced. Scheduler total/request/response/write progress remains descriptor-derived, and source valid/priority plus destination payload are asserted stable across valid&&!ready."
      focused_coverage_update: "The existing Input focused TB retains all prior stimulus and exact terminal markers, and now additionally checks that both public occupancy aliases and u_stream_queue internal depth-four/eight-slot ownership agree at saturation and reset. It prints an explicit shared-queue binding marker. Source manifests add the fetch/sink interfaces and queue to the focused Input and full fixed888 IMPROVE node hierarchies."
