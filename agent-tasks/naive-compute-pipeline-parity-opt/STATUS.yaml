  - id: phase5-rtl-psum-shadow-tag-fix-51
    status: static_pass
    time: "2026-08-22 11:30 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 required NAIVE XRT PSUM shadow fix"
    verification_input: "phase5-xrt-vcs-required-naive-50"
    diagnosis:
      - "The fresh XRT FSDB proves that the first failure is a simulation-checker false positive, not a datapath read-before-write, RAW-fence, or LMEM-response-order failure. Lane 0 accepted the physical PSUM write at 66.885 us to full word address 0x3ff83a00 with data 0x43ff000043d38000. Its first PSUM read request was accepted at 69.235 us with the same full address and LMEM slot tag 0; the corresponding response was presented at 69.325 us and consumed at 69.335 us with tag 0 and the exact written data. No earlier PSUM read was outstanding."
      - "The checker read-address queue implicitly truncated the request to its 17-bit local-LMEM word index 0x3a00, but its write side indexed the 131072-entry shadow array with the untruncated 31-bit lane word address 0x3ff83a00. That out-of-range array write did not initialize shadow[0x3a00], so the response compared known-correct data against X. VX_local_mem independently confirms that only the configured local bank/address bits select physical storage; upper system-address bits are not part of the LMEM array index."
      - "The failing first transaction happened in request order, so FIFO reorder did not cause this specific fatal. However, VX_gemm_acc_lmem deliberately permits eight tagged outstanding reads and may return slots in arbitrary order; retaining a FIFO-only assertion would be unsound for later legal traffic."
    fix:
      - "Normalized both PSUM shadow writes and recorded read addresses to the same LMEM-local word-index width before indexing the simulation-only shadow array. This preserves detection of a genuine uninitialized/read-before-write access because the normalized shadow entry still remains X until a physical write handshake occurs."
      - "Replaced the simulation-only 64-entry address FIFO with one live address/full-tag record per authoritative VX_gemm_acc_lmem read slot. Each lane request claims the slot encoded in its request tag; each response selects and validates that exact slot/tag before comparing the corresponding address and releases it only on response handshake. Added assertions against live-slot reuse, ownerless response, and full-tag mismatch."
      - "Made the existing adapter READ_SLOTS=8 contract explicit at the node instantiation and shared that constant with the checker. No request, response, write, fence, address, payload, completion, or datapath signal changed; all checker state remains under `ifndef SYNTHESIS."
    static_validation:
      - "Fresh VCS compile and full tb_VX_gemm_node elaboration passed under configs/naive_gemm_th32_tcol32_hwexp_dcache_sxbar_f16_w8.sh with GEMM_NAIVE, MXU_COL_TILE=32, MXU_WLOAD_NUM=8, LMEM_LOG_SIZE=20, LMEM_NUM_PORTS=32, and the common core/LMEM adapter hierarchy. VCS recompiled VX_gemm_acc_lmem and VX_gemm_node_naive and reported 80 modules, zero compile/elaboration errors; only inherited warnings remained. RTL Implementation did not run the simulation binary."
      - "git diff --check passed for the production RTL. STATUS YAML parsing passed after this entry. No testbench, plan, FSM formula, common-core datapath, LMEM topology, or generated build-tree source was edited."
    hard_rule: "none; the FSDB demonstrates correct physical write-before-read data and tag return, and the repair is confined to a bounded simulation checker whose slots exactly mirror the existing adapter contract"
    test_requests:
      - test_type: "blackbox"
