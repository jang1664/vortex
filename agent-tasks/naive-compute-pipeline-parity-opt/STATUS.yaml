  - id: phase5-rtl-qblk16-qrow-capacity-audit-48
    status: blocked
    time: "2026-08-22 11:15 +0900"
    role: "RTL Implementation"
    phase: "Phase 5 optional QBLK16 QROW design-scope audit"
    verification_input: "phase5-vcs-qparam-opcode-demux-47"
    scope: "The optional QBLK16 QROW extension is blocked pending a separate design decision; the confirmed Phase-5 acceptance remains QBLK32 and is not blocked by this finding."
    diagnosis:
      - "The configured MXU has MXU_ROW=MXU_COL=32 and 16-bit Scale/ZP. VX_gemm_compute_core stores exactly 32 Scale and 32 ZP elements per ping-pong bank, so each resource bank is 64 bytes. VX_gemm_unit has the same 2x32-element arrays and the same four 64-byte legacy address windows."
      - "QROW layout is S[k,ng]/ZP[k,ng], where ng=n/QBLK. With MXU_KT=MXU_NT=32 and QBLK16, ng_mxu=2, so one microtile requires 32 K lanes times two N groups times two bytes = 128 bytes per Scale bank and independently 128 bytes per ZP bank. The descriptor's 32 four-byte segment writes are therefore mathematically correct and expose twice the available per-bank state."
      - "The failure is not repairable by folding or normalizing the second 64-byte address window. The QROW input scaler reads one scale_regs[bank][k] value and sends that single scaled K-vector into the shared 32-column MXU; the QROW zero-point path similarly reads one zero_regs[bank][k] vector and duplicates its reduced correction across all output columns. Correct QBLK16 requires S/Z[k,0] for columns 0..15 and S/Z[k,1] for columns 16..31 at the same logical microtile. Folding the address can only overwrite one group with the other."
      - "The legacy unit did not support this case: its first/second 64-byte windows are decoded as different ping-pong/resource regions, so a 128-byte bank command spills into another bank or resource before computation. The repository's canonical gemm_node test.sh explicitly constrains QROW to qblk>=MXU_KT, qblk>=MXU_NT, and divisibility by both, selecting only QBLK={32,64,128,...}."
      - "The reported QBLK16 QCOL PASS is not counter-evidence for arbitrary QBLK16 support. Its focused TB initializes every K-group with the same per-column Scale/ZP values, so missing group-distinct storage is numerically invisible; the canonical QCOL matrix also begins at QBLK32."
    design_decision:
      - "No additional production RTL change was made. Supporting QBLK16 QROW needs at least doubled S/Z storage per ping-pong bank plus group-aware datapath selection. Viable architectures would either add per-output-group preprocessing/correction to the common core or split a 32-column microtile into multiple group-specific compute/ACC transactions in the NAIVE FSM/packetizer. Both alter arithmetic scheduling, packet/retire accounting, and possibly IMPROVE cycle behavior; choosing between them is outside the confirmed Phase-5 QBLK32 migration scope."
      - "A new confirmed feature spec is required before implementing QBLK<MXU_NT. It must define maximum groups per microtile, storage sizing, register address mapping, group metadata, Weight/ACC column masking or duplicated preprocessing, generation lifetime, partial-tile behavior, and IMPROVE equivalence expectations."
    hard_rule: "design-scope stop: a local address normalization cannot provide the missing simultaneous group state. Extending the common core risks Hard Rule 5 (IMPROVE functional/cycle behavior), while a NAIVE-only compute split changes the preserved FSM/packet/address schedule. Do not select either architecture inside this Phase-5 fix loop."
    static_validation:
      - "Read-only source audit covered VX_config.vh, VX_gemm_compute_core, legacy VX_gemm_unit, VX_gemm_fsm_naive, the focused verifier log/TB data generation, canonical gemm_node test.sh constraints, and the confirmed plan/spec. No source or test file was edited and no simulation was run."
