  - id: phase0-rtl-psum-tag-boundary-fix-8
    status: static_pass
    time: "2026-08-22 01:52 +0900"
    role: "RTL Implementation"
    phase: "Phase 0B"
    verification_input: "phase0-vcs-psum-credit-fix-7"
    root_cause:
      - "At timeout, the aggregate physical-write pending count had drained to zero, but psum_wr_pending_by_set[0] and [1] were both stuck at 128. Both per-set lane-pop counts were zero, raw PSUM reads remained conflict-blocked, gemm_done was never asserted, and the NAIVE FSM was backed up in state 14 (S_MXU_PRE_CUR_SC). This is the first stuck ownership state, upstream of output-store/done handling."
      - "FSDB showed the marked internal lane write leaving g_psum_lane_arb[0].wr_out_if with addresses 0x0,0x10,0x20,0x30 and flags 3'b001, but the exposed psum_wr_lmem_bus_if carried 0x0,0x20,0x40,0x60 and flags 3'b010. The entire packed request was shifted one bit, so the PSUM-write marker disappeared and no physical lane completion decremented either per-set counter."
      - "The boundary used a whole-req_data assignment. wr_out_if has the production PSUM_ARB_TAG_WIDTH, while the focused hierarchy can expose the narrower PSUM_LMEM_TAG_WIDTH on the response-less write port. Packed assignment across those widths truncates/alines the whole struct rather than just the tag. The production core's equal-width hookup hid this structural hazard."
    bank_set_audit:
      - "PSUM_LANE_BANK_SET_BIT remains correctly derived as CLOG2(GEMM_PSUM_LANES)=4. VX_mem_bus_split forms each narrow address from the wide address plus the four-bit lane index, so wide PSUM address bit 0 is narrow address bit 4. The FSDB address corruption appeared only after the tag-width boundary and is not an incorrect bank-set formula."
