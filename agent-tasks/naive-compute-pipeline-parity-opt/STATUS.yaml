  - id: phase0-rtl-psum-credit-fix-6
    status: static_pass
    time: "2026-08-22 01:42 +0900"
    role: "RTL Implementation"
    phase: "Phase 0B"
    verification_input: "phase0-vcs-naive-node-width-corrected-5"
    root_cause:
      - "The production PSUM same-bank-set ordering counter was only seven bits even though it counts narrow-lane credits, sixteen per accepted wide PSUM write. In the failure FSDB, set 0 advanced 0,16,32,48,64,80,96,112 and then wrapped to 0 on the eighth queued write before any set-0 lane pop."
      - "That false empty state admitted the first PSUM read at 337635ns. The lane-0 requests for addresses 0 and 0x20 were accepted at 337645/337655ns, and the first response at 337725ns returned stale LMEM data 0x4400420040003c00 instead of the last accepted PSUM write shadow 0x43ff000043d38000. The assertion reported the real ordering violation; it was not a WLOAD4-only reference assumption."
    weight_contract_audit:
      - "The standalone gather result and failing-node FSDB agree that every WLOAD8 command retires exactly four ordered 128-byte beats and VX_gemm_unit consumes those same four handshakes."
      - "For WTRANS=0, gather beat g packs source rows 8g..8g+7 into weight_i[0..7]. The legacy row-direction register load shifts existing rows upward by eight and inserts the new beat at rows 24..31, so beats 0,1,2,3 leave source rows 0..31 in register rows 0..31. The analogous column-direction path transposes each eight-column group while shifting right-to-left."
      - "The GEMM destination address remains constant across the four logical beats by design: address bits carry only {load_dir, register_bank}; FIFO-style register shifting supplies the beat position. The 128-byte address shift preserves those control bits exactly as the legacy 64-byte WLOAD4 path did."
    changes:
      - "Widened both per-bank-set PSUM pending counters and their push/pop arithmetic from seven bits to the existing authoritative 12-bit aggregate write-lane pending width."
      - "Derived PSUM/final lane-credit increments from GEMM_PSUM_LANES and GEMM_OUTPUT_LANES instead of fixed 16/8 literals. No queue, FSM, Weight mapping, LMEM topology, address, or ready/valid behavior changed."
    static_validation:
      - "Fresh incremental VCS compile/elaboration of the corrected 64B-to-256B WLOAD8 gemm_node hierarchy passed: 78 modules, only VX_gemm_node_naive recompiled, exit code zero, and Verdi KDB generated. No simulation was run by RTL Implementation."
      - "Config shell syntax and git diff --check passed. Existing unrelated DMA-port/task-sensitivity/job-register warnings remained unchanged; the counter change introduced no compile warning or error."
    hard_rule: "none; the fix preserves the existing write-accept/read-admit contract and prevents a representational false-empty without adding buffering or changing ordering"
    test_requests:
      - test_type: "unittest"
        test_path: "hw/unittest/gemm_node"
        test_params: "TEST=NAIVE_WLOAD8_M4_QCOL_WT0 M=4 N=256 K=256 QBLK=32 WTRANS=0 QDIR=0; after this first case passes, run the unchanged M=4,N=K=256,QBLK=32 QDIR={0,1},WTRANS={0,1} matrix."
