      first_divergence: "The private legacy Weight request valid at VX_lmem_dma_misal.sv:2704 required alloc_slot_r to be registered SLOT_FREE. Its destination write changed a DRAINING slot to FREE only on the accepting edge, so the same slot could first be offered on the following cycle. The common queue pre-fix request_slot_available also treated sink_write_fire for the ring slot as immediately available, allowing the next Weight source request to enter TMEM arbitration on the release edge itself. This one-cycle-earlier wrap offer is absent from legacy and is the only identified executor schedule difference; it can perturb shared-bank Input admission without changing final counts, matching the QCOL-only +2 bubbles/prior-RAW drift and the exposed Q128 tail."
    root_cause: "Weight inherited the generic common queue's same-cycle consumed-slot recycle optimization even though the legacy Weight executor exposed only registered next-cycle FREE state. It was not SINK_PIPELINE, ring allocation, ready-ahead, idle, wide logical completion, writer completion or generation timing."
