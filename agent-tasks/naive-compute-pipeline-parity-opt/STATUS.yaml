  - id: phase6-rtl-weight-response-driver-handshake-fix-116
    status: static_pass
    time: "2026-08-27 05:18 +0900"
    role: "RTL Implementation"
    phase: "Phase 6 step 8b focused Weight response-ownership failure correction"
    verification_input: "phase6-vcs-weight-stream-dma-queue-focused-failure-115"
    root_cause:
      classification: "focused TB response-driver race; production queue ownership and tag mapping are correct"
      tag_mapping_evidence: "The fixed focused build has NDEBUG and no SCOPE, hence UUID_WIDTH=1. The 8-bit VX_mem_bus tag is packed as {uuid[0],value[6:0]}; the Weight fetch interface and queue both use LMEM_TAG_VALUE_W=7. The production request assigns req_tag to `lmem_bus_if.req_data.tag.value`, the response assigns that same value field to rsp_tag, and the focused request checker observed exact slot values 0..7. There is no width truncation, aggregate/value inversion or wide-switch fragment tag at this boundary."
      race_evidence: "The TB's send_response changed valid/data/tag at a negedge, then polled rsp_ready only at negedges before separately waiting for a posedge. After reverse tag7 was accepted, changing to tag6 initially observed the old consumed-tag ready=0. The new owned tag made ready=1 before the intervening posedge, where production legally accepted it and changed its slot WAIT_RSP to READY. Because the TB did not sample that accepting posedge, it kept the already-consumed response valid; the next production assertion correctly saw the duplicate/stale logical response with rsp_owned=0. This exactly explains why eight requests and ownership markers passed before the first response-loop failure."
      waveform_availability: "Iteration115 preserved no FSDB/VPD waveform for the focused Weight gate. The 315000ps log, deterministic TB edge schedule and queue WAIT_RSP-to-READY transition are sufficient to identify the missed-fire race without rerunning simulation, as explicitly required for this implementation iteration."
    fix:
      tb_driver: "Changed only send_response so, after driving valid/tag at a negedge, it samples rsp_ready on each posedge and deasserts valid only on the following negedge after the actual accepting edge. A ready rise between negedges can no longer be missed, and a consumed tag cannot be held into a second posedge. The existing reverse 7..2,0,1 sequence remains the directed reproducer."
      preserved: "No production RTL, queue, interface, assertion, tag mapping, source priority, wide-switch, writer fence, completion, Output or NAIVE behavior changed. The production `Weight logical response has no queue owner` assertion remains strict and unchanged."
    hard_rule: "none; correcting the test driver's ready/valid edge ownership restores the intended contract without changing or weakening production behavior"
    changed_files:
      - "hw/unittest/lmem_dma_weight_overlap/tb_VX_lmem_dma_weight_overlap.sv"
      - "agent-tasks/naive-compute-pipeline-parity-opt/STATUS.yaml"
