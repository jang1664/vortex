pitfalls:
  - >-
    C4 is an experiment alias, not a four-core configuration. Its config sets
    NUM_CORES=1 and instantiates the eight-channel improve DMA engine.
  - >-
    The historical C4 report is post-route full-design utilization. It is not
    directly comparable to a DMA-engine OOC post-synthesis report.
  - >-
    Vivado automatic source management may silently replace an OOC top that is
    assigned before the source hierarchy is resolved. Resolve compile order,
    assign the top, then set source_mgmt_mode to None.
  - >-
    Treat third_party/axi/src as an explicit source set, not a directory-wide
    dependency. Directory-wide collection pulls modules with additional Bender
    dependencies that VX_dma_engine does not use.
  - >-
    hw/scripts/gen_sources.sh collects every source in each include directory;
    it does not compute a top-specific dependency closure.
  - >-
    Alias config files do not contain every XRT platform define. In particular,
    PLATFORM_MEMORY_DATA_SIZE=64 and PLATFORM_MEMORY_ID_WIDTH=32 come from
    hw/syn/xilinx/xrt/platforms.mk and must be recorded by standalone OOC flows.
