pitfalls:
  - >-
    Old-RTL OOC baselines must be captured before integrating the generated
    datapath; otherwise the comparison is not reproducible.
  - >-
    Subagents share the same worktree in this environment. Units that modify
    overlapping files or run shared build targets must be serialized.
  - >-
    tools/hw_draw/hw_tool.py cannot read the existing
    agent-tasks/port-scale/hw_arch.simple.json with list_modules because the
    simplified instances omit moduleRef. Do not edit that JSON directly; use
    RTL and the confirmed spec as the architecture source for this task.
  - >-
    A clock-only XDC is insufficient for the node-backend OOC top. Explicit
    input and output delay constraints are required or WNS can look positive
    while I/O timing groups remain unconstrained.
  - >-
    Vivado Tcl does not provide Synopsys remove_from_collection. OOC port
    collections must use Vivado-native get_ports filters; failed report-stage
    attempts remain immutable and a new output directory is required.
  - >-
    Fresh configured xrt-vcs-sim builds do not populate kernel/libvortex.a;
    build the kernel prerequisite under the same sourced CONFIGS before the
    application run, without rebuilding or changing the pinned simv config.
  - >-
    The historical fpint_gemm_ffn_hw_naive C4 workload now violates the
    eight-channel tensor-DMA slot-alignment assertion. Its failed attempt is
    preserved, and the reproducible current-ABI C4 baseline uses
    fpint_gemm_ffn_hw with the same 128-cubed problem shape.
