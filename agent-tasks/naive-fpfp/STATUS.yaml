pitfalls:
  - Existing GEMM_NAIVE guards must not force FPINT into an FPFP-only build.
  - Removing quantization commands requires removing source-join and consumer dependency obligations.
  - FP16-result multiplication is not a substitute for widened FP32 products.
  - Physical LMEM_SIZE may be smaller than the power-of-two address envelope.
  - Keep all concurrent simulations in separate configured build directories.
  - FPFP WLOAD4 at NT128 requests four rows from the same four banks; grouped request width is not sustained bandwidth.
  - CONTROL bit1 is allocator occupy state; datatype uses reviewed free bit23.
  - VCS nested make cannot inherit inaccessible make jobserver descriptors; use serial make for the initial unit fixture.
  - VCS created an undriven implicit net for an instance connection referencing input_fire before its explicit declaration.
