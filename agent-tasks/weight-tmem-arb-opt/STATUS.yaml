iterations:
  - iteration: 1
    timestamp: "2026-08-16 03:01"
    status: compile_error
    test: hw/unittest/tensor_mem_bank
    error_summary: "VCS elaborated VX_sp_ram_compiled_unsupported_shape as an unintended top."
    root_cause: "The unittest VCS harness lacked an explicit top-module restriction while wildcard library sources included the compiled-SRAM dispatcher."
    fix_applied: "Added -top $(TOP_MODULE) plus explicit RTL/TB/harness dependencies and a compile stamp to the tensor_mem_bank VCS harness; synchronized the current configured build copy. No production RTL or TB semantics changed."
    lesson: "Standalone interface/module unittests must pass -top TOP_MODULE when library source discovery can expose uninstantiated roots."
  - iteration: 2
    timestamp: "2026-08-16 03:04"
    status: sim_fail
    test: hw/unittest/tensor_mem_bank
    error_summary: "Held-request stability assertion failed on port 1 at 475 ns."
    root_cause: "Confirmed TB protocol error in both persistent-source loops: after aggregate coverage became true, the next exit-check posedge still granted one source, then the blanket negedge cleanup deasserted every source, including unselected ports whose previous cycle was valid&&!ready."
    fix_applied: "Changed urgent-RR and normal-fairness stimuli so every persistent source deasserts only on the negedge after its own final valid&&ready handshake; the urgent source remains asserted until its own post-coverage handshake. Production RTL and the stability assertion are unchanged."
    lesson: "Persistent arbitration stimuli must retire each asserted source only after that source's own final valid/ready handshake."
  - iteration: 3
    timestamp: "2026-08-16 03:09"
    status: sim_fail
    test: hw/unittest/lmem_dma_input_overlap
    passed_before_failure: "tensor_mem_bank passed urgent/normal class RR, bounded fairness, reset, and response checks."
    error_summary: "Input overlap timed out after 16 source requests but only the first 8 destination beats drained."
    root_cause: "The directed TB response model disabled response_release after the initial eight slots and never returned responses for seq2/seq3 requests issued into recycled slots."
    fix_applied: "After the initial reverse/nonconsecutive/threshold checkpoint, re-enabled continuous lowest-tag response servicing on a negedge. Added request/response/pending accounting and an explicit stale/duplicate-tag guard. Production RTL and the directed READY-ahead checks are unchanged."
    lesson: "An overlap TB that recycles response slots must service later tagged requests after the initial occupancy/ordering checkpoint."
  - iteration: 4
    timestamp: "2026-08-16 03:12"
    status: sim_fail
    test: hw/unittest/tmem_wide_read_switch
    passed_before_failure: "tensor_mem_bank preserved PASS; Input and Weight overlap VCS suites passed ready-ahead, recycling, fence, ordering, and reset coverage."
    error_summary: "Wide-switch held-input assertion failed in case_wload32 at 95 ns."
    root_cause: "The full-depth directed check held one extra request for a stalled edge, then deasserted valid/urgency on the next negedge without an acceptance handshake."
    fix_applied: "Split full-depth coverage into a dedicated probe: the one-extra request remains data/urgency-stable across the stalled edge and is canceled only while a case-local DUT reset is asserted. Functional batches then restart from empty state with their original OUTSTANDING counts/order. Production RTL and the held-input assertion are unchanged."
    lesson: "A FIFO-full check cannot withdraw a valid request after observing ready low; it must hold until handshake or cancel only through reset."
  - iteration: 5
    timestamp: "2026-08-16 03:18"
    status: compile_error
    test: hw/unittest/gemm_unit_v2_backpressure
    passed_before_failure: "Wide switch, actual Scale and ZP builds, lmem_dma_misal, and legacy gemm_unit_v2 passed; prior tensor/Input/Weight PASSes remain valid."
    error_summary: "Make could not find the focused backpressure TB under build/hw/unittest."
    root_cause: "The configured-build Makefile overrides SRC_DIR to its build directory, but configure does not copy this focused TB there; the authoritative TB remains in source hw/unittest."
    fix_applied: "Changed the focused wrapper to resolve its TB through deferred VORTEX_HOME source-tree expansion in both the authoritative and configured Makefiles, and made the shared GEMM VCS recipe honor TOP_MODULE explicitly. The compile target now depends on the existing source TB and selects tb_VX_gemm_unit_v2_backpressure. Production RTL and TB semantics are unchanged."
    lesson: "Configured-build unittest wrappers must resolve specialized TB sources from VORTEX_HOME when configure does not generate a local copy."
  - iteration: 6
    timestamp: "2026-08-16 04:00"
    status: pass
    test: "full VCS unittest and node integration matrix"
    passed:
      - "tensor_mem_bank: urgent/normal class arbitration, independent RR, bounded fairness, reset"
      - "lmem_dma_input_overlap: READY-ahead thresholds, WAIT_RSP exclusion, recycled-slot responses"
      - "lmem_dma_weight_overlap: four descriptors/eight slots, READY-ahead, writer fence, ordering, reset"
      - "tmem_wide_read_switch: 8/8/2/1 contexts, full-depth reset cancellation, all-lane urgency"
      - "lmem_dma_qparam_overlap: separately rebuilt Scale TEST_ZP=0 and ZP TEST_ZP=1"
      - "lmem_dma_misal, gemm_unit_v2, gemm_unit_v2_backpressure, gemm_fsm, gemm_ctrl, gemm_sync"
      - "gemm_node_improve M=4/256 x QDIR=0/1 numerical and metadata lifecycle"
    node_results:
      m4_qdir0: "1024 outputs; commands=64 packets=256 scheduler_retire=64"
      m4_qdir1: "1024 outputs; commands=64 packets=256 scheduler_retire=64"
      m256_qdir0: "65536 outputs; commands=128 packets=16384 scheduler_retire=128"
      m256_qdir1: "65536 outputs; commands=128 packets=16384 scheduler_retire=128"
    hard_rule_blocker: false
    next: "XRT-VCS baseline/skew-only/priority-only/skew+priority comparison, then QCOL-first FSDB gate"
notes:
  - "2026-08-16: Confirmed ready-ahead TMEM urgency arbitration plus resource-aware allocation skew plan."
  - "2026-08-16: Weight skew is measured in GEMM_WEIGHT_DATA_SIZE wide-bank groups, not fixed 64 B units."
  - "2026-08-16: Eight TMEM banks are retained; bank-count expansion is out of initial scope."
  - "2026-08-16: RTL implementation is ready for verification; no Hard Rule blocker was found."
pitfalls:
  - "A shared RR cursor across urgency classes is not starvation-bounded: urgent grants can repeatedly perturb the normal rotation. The implementation uses independent urgent and normal cursors."
