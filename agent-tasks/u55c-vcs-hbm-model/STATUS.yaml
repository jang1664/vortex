pitfalls:
  - Configuration tests must set baseline clocks explicitly: inheriting LOGIC_FREQ_HZ=250000000 makes a subsequent change to 250 MHz a no-op and produces a false incremental-invalidation failure.
  - VCS can rerun compilation while retaining native DPI objects after C++ header-only changes. Verify object timestamps, not just simv timestamp; header-content hash is now included in native CFLAGS to invalidate its cache.
  - This VCS build may return exit 0 on SV $fatal. Negative tests must require the specific expected fatal diagnostic and bounded termination; positive tests must reject Fatal/Error logs independently of exit status.
  - VCS queue.size() in always_comb can leave ready stale after queue drain. Production ready now uses explicit model credits; per-negedge DPI response-room budgets separately bound TB egress.
  - platform_config.mk undefines CONFIGS before reevaluation, removing inherited export status. Nested test Make calls must explicitly pass U55C_INPUT_DEFINES and compare resulting manifest; otherwise a four-port test can silently run default eight-port geometry.
  - Never reuse third_party/ramulator/build here: its CMake cache and generated output paths refer to vortex_fpint. Use explicit -S third_party/ramulator -B build/ramulator-u55c and verify CMAKE_HOME_DIRECTORY.
  - SP_FLAGS expresses reachable HBM regions, not a verified physical switch ingress mapping.
  - HBM AXI frequency and DRAM tCK must be configured separately.
  - Kernel AXI port count is not the physical DRAM channel or pseudo-channel count.
  - Moving DramSim into DPI also requires one authoritative RAM and ordered BO transfers.
  - Existing configured Makefile copies are stale after source edits; configuration tests explicitly use the source Makefile from the configured working directory.
  - Current DramSim reset only clears its ratio accumulator, not Ramulator queues; device reset must recreate or explicitly drain the timing model.
  - Generated DRAM tCK currently records the known preset value; runtime validation against Ramulator remains required.
  - Correction to the initial organization note: HBM2 DQ is 128 bits but channel_width defaults to 64 bits, yielding 16-byte transactions in the legacy path. U55C now explicitly selects channel_width=128 and 32-byte transactions.
  - Including Ramulator dram/dram.h breaks C++17 builds because its implementation headers require C++20. Use the public memory-system API and explicit organization configuration instead.
  - Original DramSim destruction only finalized Ramulator; reset leaked its component and HBM-node trees. Destructor fixes now touch the Ramulator submodule and require rebuilding libramulator.so before validation.
  - improve_th32_tcol32_hwexp_dcache.sh specifies stale TMEM geometry: time-zero assertions require 512 KiB total capacity and 1024/2048 physical words per bank. Functional PASSED does not establish a clean simulation.
  - Changing only NUM_HBM_PORTS to 4 with NUM_DMA_CHANNELS=8 is invalid RTL geometry; use the dedicated hbm4_tmem8 config. Original session 55577 terminated with exit 1 at time zero.
