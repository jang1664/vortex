pitfalls:
  - The worktree contains a pre-existing user change in hw/rtl/core/VX_core.sv; do not overwrite or fold it into this fix.
  - "The first rev1 failure is duplicate request-buffer release, not a timeout: the same LMEM load completes with eop more than once."
  - The requested config filename is improve_th32_tcol32_hwexp_dcache.sh; no tccol32 file exists.
  - The xrtsim_vcs simv target depends only on the testbench and DPI source, not the discovered RTL or a CONFIGS stamp. Use `make -B -C sim/xrtsim_vcs simv` with the exact configuration after RTL changes; no cleanup or file deletion is required.
  - ci/run_black.sh forces FSDB_DUMP=1 for xrt-vcs-sim even without --debug. LOG_MAX_BYTES is only applied by blackbox.sh when --debug is enabled, so assertion flooding can create multi-gigabyte simv.log files.
  - The focused Verilator tests are two-state. Iteration 4 first failed through X-valued control state before the original LMEM allocator assertion, so the next focused check should exercise Omega and its added buffered arbiters under VCS xprop semantics.
  - The early selected-output ready hypothesis was disproved: the priority arbiter emits a zero one-hot grant while idle, and the original Omega stage xbar already performs destination routing. The experimental Omega changes were fully reverted.
  - Disabling both LMEM Omega macros does not remove the failure: iteration 6 reaches the same empty IPDOM-stack pop and X-valued control-state cascade at essentially the same time. Further Omega direction isolation is not useful until the common thread-32 rev1 baseline failure is understood.
  - A full `make -B` with VIVADO also rebuilds the shared Xilinx VCS simlib. In iteration 7 that regeneration prepended a self-referential OTHERS mapping and VHDLAN hit its include-depth limit. Restore the shared setup to its library mappings, reuse the existing compiled VHDL libraries, and force only the direct tb-to-simv dependency with `make -W <tb_vcs_xrtsim.sv> simv`.
  - The VIVADO diagnostic changes the failure shape: it avoids the early IPDOM/X cascade seen without VIVADO, but still exposes duplicate LSU allocator release and scoreboard writeback with concrete metadata around 330.8 us. Do not treat VIVADO as an exact-config fix.
  - VIVADO direction isolation does not identify a single bad side: request-only and response-only Omega both reproduce the same duplicate LSU completion signature. The request-only first failure is around 330.8 us; response-only is around 342.3 us.
  - In the VIVADO mixed-language path, `DEBUG=2` is not included in VLOGAN_FLAGS; wrapper debug still enables the trace macros, while VX_gpu_pkg and DPI tracing otherwise use their debug defaults. Add `-DDEBUG_LEVEL=2` to CONFIGS when an explicit RTL debug level is required. LSU/LMEM handshake messages are TRACE level 2.
  - Iteration 9 demonstrates that request Omega changes response timing but does not itself duplicate the failing transaction: request inputs, bank requests/responses, and local-memory source-port responses are exactly-once. The first duplicate is observable only after the per-lane response arbiters and adapter merge, where lanes 0 and 1 remain present across six same-tag output beats.
  - Iteration 10 corrects that boundary placement: VX_lsu_adapter consumes each of the 32 lane responses exactly once and constructs six disjoint masks whose union is all lanes. Corruption occurs after its packed output because lmem_arb_if uses LMEM_TAG_WIDTH while VX_lsu_mem_arb uses LSU_TAG_WIDTH; the two-bit width excess transforms each mask to ((mask << 2) | 3). Fix this interface/arbiter tag-width contract before changing Omega or stream_pack.
  - Iteration 12 acceptance passes with the original Omega implementation restored. The required functional change is the CPU-specific LMEM tag-width contract in VX_mem_unit, not an Omega datapath rewrite.
  - mem_unit_top is compile coverage only: main.cpp initializes Verilator and exits without driving transactions or printing a pass marker. Its default Makefile also inherits a sibling VORTEX_HOME/config, so command-line VORTEX_HOME and exact CONFIGS overrides are required for meaningful current-worktree thread-32 compilation.
  - Iteration 13 removes the prior VIVADO diagnostic qualification: the current fix passes fresh non-VIVADO VCS with xprop enabled in build, both for the minimal seqk-8 masked smoke and the seqk-129 unmasked boundary case.
