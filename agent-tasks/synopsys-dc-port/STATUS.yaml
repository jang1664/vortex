pitfalls:
  - id: P1
    note: |
      Samsung 28LPP compiler module names use the format
      `cmos28lpp_<module>[r][w][p][a]_<arch>_<D>x<W>m<MUX>`. The `[opt]`
      flags must come immediately after the module name (no underscore
      separator) and BEFORE the `_hd|_hs` arch tag. The hwexplorer regex
      `(ra1|ra2|rf1|rf2|vrom)r?w?p?_(hd|hs)` enforces this ordering. Don't
      put `_w` after `_hd` (that would not match).
  - id: P2
    note: |
      `rf*_hd` mux1 has width STEP 2, not 1. So 16x583 is invalid; use
      16x584 or pad to even (we picked 16x146 ×4 = 584 for L2 MSHR).
      Same applies to ICACHE MSHR 16x44 (already even).
  - id: P3
    note: |
      `ra1_hd` width caps tighter than expected: m8→36, m16→72, m32→144
      with min depth 4096 for m32. So 2048×128 cannot use ra1_hd at all;
      ra1_hs is required (width up to 144 at m8, depth 256-4096).
  - id: P4
    note: |
      `ra2_hd` (1R1W) max depth is 1024. Anything deeper (e.g. L2 tag
      2048×18) must depth-bank by 2× — wrapper picks the right macro
      using the high-order address bit.
  - id: P5
    note: |
      Async-read shapes (#3, #7, #13 in sram_inventory.md) cannot be
      compiled via memory_compiler. They use OUT_REG=0 + RADDR_REG=1 to
      fake a 0-cycle read. Falling back to flops in this round; defer
      VX_async_ram_patch Synopsys port to async-ram-patch-port subtask.
  - id: P6
    note: |
      BWE (byte-write-enable) is encoded by the `w` flag in the [Option]
      field of the family name (e.g., `ra1w_hs_2048x128m8`). The `w`
      flag declares write-mask capability; the WEN bus width is derived
      from the data width — for byte (8-bit) granularity, the wrapper
      ties every 8 WEN bits together (or the compiler's WEN-group size
      is set to 8 at instantiation time).
  - id: P7
    note: |
      hwexplorer/memory_compiler's tcl/make_db.tcl is invoked via
      dc_shell, but dc_shell v2023.12-SP5-3's `read_lib` silently fails
      (returns 0, no error message) on ARM-generated 28LPP `.lib` files.
      The same files load cleanly in `lc_shell`. The framework's
      validate_fe_output requires `*.db`, so this bug causes ALL specs
      to fail validation and not get cp'd to /home/data/.../genSEC.
      FIXED in hwexplorer (3 patches):
      - frontend.py: dc_shell → lc_shell
      - tcl/make_db.tcl: drop enable_write_lib_mode; parse `library(NAME)`
        from .lib file (not from filename) since lc_shell read_lib
        returns 1/0 not the lib name; remove brace-comment that broke
        Tcl parser
      - preprocess.py: check_mem_exist requires *.db in genSEC dir, so
        empty dirs from prior failed runs trigger re-compile
  - id: P8
    note: |
      Framework's main.py runs `rm -rf $work_dir` at the very end of all
      specs (regardless of success/failure). When validation fails for
      every spec, this wipes ALL accumulated artifacts (.lib, .v, .lef)
      AND the empty genSEC dirs (created by mkdir -p) remain — a worst
      of both worlds. Watch for this when iterating: a single bad spec
      will not kill the run, but a bad make_db.tcl that fails them all
      will erase everything.

