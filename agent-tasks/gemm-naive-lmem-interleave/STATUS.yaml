  - date: "2026-07-16"
    iteration: 4
    result: sim_fail
    summary: >
      The first modified prefill run stopped in S_PRE_NEXT_LD_W after the
      output DMA reader completed 128 x 4 segments but its writer advanced
      only 123 segments.
    root_cause: >
      Reader and writer segment-boundary events could occur in the same cycle.
      Two nonblocking assignments to rd_ahead_count_r then overwrote one
      another, understated the prefetch distance, and discarded five buffered
      output segments.
    fix: >
      Compute both segment-advance events and update rd_ahead_count_r once so
      simultaneous increment and decrement events cancel.
  - date: "2026-07-16"
    iteration: 5
    result: pass
    summary: >
      The depth-four local DMA regression completed all aligned and misaligned
      round trips, including the failure-shaped 16-byte x 128 x 4 transfer.
      The testbench now explicitly enables the misaligned datapath used by the
      naive GEMM node.
    verification: >
      From configured build_naive_lmem_interleave:
      make sim SIM_EXEC=vcs RD_PREFETCH_DEPTH=4
  - date: "2026-07-16"
    iteration: 6
    result: sim_fail
    summary: >
      Focused FSDB analysis of M=128 found the output DMA completed all 512
      source reads and responses but issued only 511 LMEM writes. It stopped
      at the final writer index with empty slots and an empty writer window.
    root_cause: >
      rd_ahead_count_r excludes response slots and the writer window, so it
      understated the actual reader/writer distance. The writer used this
      count to discard buffered data at segment boundaries and dropped the
      final prefetched slot.
    fix: >
      Count final reader segment completion as a boundary event, and preserve
      all residual writer-window bytes for aligned full-beat prefetch. Only
      non-prefetchable misaligned transfers clear an over-read tail.
