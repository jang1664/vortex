task: flash-attn-c4
state: BLOCKED_ON_C4_REBUILD
updated: "2026-07-20 15:41"
summary: >-
  Implemented a single-kernel C4 W4A16/KV4 attention schedule that executes QK
  GEMM with progress-driven online softmax, joins the softmax workers, fences
  once, and then executes PV as a second improve-GEMM descriptor. The source
  RTL and a reset-free back-to-back descriptor unittest pass; full FPGA
  confirmation requires rebuilding the C4 image with the RTL fix.
log:
  - timestamp: "2026-07-20 14:08"
    action: actual C4 descriptor and intermediate-tensor diagnostics
    result: >-
      QK scores were bit-exact and online-softmax probabilities matched the
      host reference, but a second PV descriptor produced deterministic stale
      values. A standalone PV-shaped GEMM passed, isolating the failure to
      back-to-back descriptor state rather than PV arithmetic or layout.
    learned: >-
      Output progress and job retirement make DRAM output visible but do not
      reset improve-GEMM internal synchronization state.
  - timestamp: "2026-07-20 14:35"
    action: vector-PV baseline on actual C4
    result: >-
      The earlier QK-GEMM plus vector-PV fallback passed M=16 non-causal and
      causal cases, with final-output relative L2 of 6.70e-4 and 7.89e-4.
    learned: >-
      The QK/progress/online-softmax path is numerically sound independently of
      the second accelerator descriptor.
  - timestamp: "2026-07-20 14:58"
    action: sequential same-kernel QK/softmax/fence/PV implementation
    result: >-
      Replaced vector PV with a PV GEMM submitted after all online-softmax
      workers join and the control hart executes one fence. Added a PV-only
      diagnostic that uploads reference probabilities and makes PV the first
      descriptor.
    learned: >-
      PV-only is bit-exact on the deployed C4 image, while the full path fails
      only when PV is the second descriptor.
  - timestamp: "2026-07-20 15:04"
