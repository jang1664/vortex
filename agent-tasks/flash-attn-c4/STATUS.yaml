pitfalls:
  - >-
    A core fence publishes the vector-written probability tile, but cannot
    clear accelerator synchronization registers left by an earlier descriptor.
  - >-
    Job allocation begins with occupy=1, working=0, valid=0. Retirement checks
    must use generation change or both occupy and working deasserted; valid
    alone can report false completion.
  - >-
    The current regression intentionally covers one 128-key KV tile. Multi-tile
    attention remains follow-up work after rebuilt-C4 validation.
