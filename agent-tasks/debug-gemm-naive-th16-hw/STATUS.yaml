    root_cause: "The GEMM_NAIVE prefetch gate required acc_rd_prefetch_count >= acc_cnt before accepting input. For acc_cnt=64 this demanded that a two-bank FIFO system with total capacity 32 buffer all requested rows, creating a closed backpressure cycle."
    fix_applied: "Permit input once all requested PSUM rows are prefetched or both per-bank FIFOs reach their almost-full prefetch window. The almost-full threshold leaves one physical entry per bank available for already-issued responses while allowing consumption to release read credits."
    verification: "RTL implementation only; no blackbox run by rtl-impl. git diff --check passed for VX_gemm_unit.sv."
    lesson: "A startup-prefetch requirement must be bounded by realizable buffering capacity; full-tile row counts can exceed the FIFO window and must transition into streaming producer/consumer operation."
