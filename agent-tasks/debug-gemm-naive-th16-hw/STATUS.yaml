task: debug-gemm-naive-th16-hw
state: COMPLETE
updated: "2026-07-28 23:38"
goal: "Make fpint_gemm_ffn_hw_naive pass the th16/b32 configuration through M256, including M128/M256 K256 N256 and the existing M64 regressions."
pitfalls:
  - "The shared xrt-vcs build may contain stale defines; only an isolated build with vlogan define evidence is authoritative."
  - "The target config previously used L1_MEM_PORTS=4 with only two D-cache core requesters, which can lose scalar bypass responses; the current config uses L1_MEM_PORTS=2."
  - "Existing unrelated dirty files belong to the user and must be preserved."
  - "The blackbox wrapper can return before detached VCS child processes finish; authoritative completion evidence is the generated run.log/simv.log plus process termination, not the initial wrapper tool return."
  - "M128 crosses accumulator address 0x20000; a command-static read-bank group becomes stale at that boundary even though parity scheduling remains valid."
iterations:
  - timestamp: "2026-07-28 23:15"
    iteration: 7
    phase: verification
    status: sim_fail
    test: "Exact-config xrt-vcs fpint_gemm_ffn_hw_naive M128 K256 N256 on the iteration-6 RTL"
    error_summary: "The simulation terminated at 112.625 us with an accumulator read-bank invariant fatal, not a timeout or FIFO underflow: address 0x20000 decoded to physical bank 2 while the scheduler reported bank 0."
    root_cause: "The two parity read addresses advance by 256 bytes, but acc_mem_accum_rd_group is captured only at command start. The M128 command started at 0x1d000 and crossed the physical bank-group boundary after reading address 0x1ff80, leaving the static group bit stale for the next request."
    fix_applied: "None in the verification step. A confirmed follow-up spec requires deriving the physical bank from the selected address while preserving parity FIFO/credit scheduling."
    verification: "The existing exact th16/b32 iteration-6 build used GEMM_NAIVE, NUM_THREADS=16, L1_MEM_PORTS=2, and MXU_COL_TILE=32. The M128/K256/N256 run exited with wrapper status 2 after the RTL fatal."
    lesson: "Parity identifies the consumer FIFO, but it is not sufficient to identify the four-bank accumulator SRAM once an address stream crosses a bank-group boundary."
  - timestamp: "2026-07-28 23:17"
    iteration: 8
    phase: implementation
    status: pending_verification
    test: "Address-derived accumulator read-bank scheduling for exact-config M128/M256 K256 N256 and M64 regression"
    error_summary: "M128 crossed from accumulator address 0x1ff80 to 0x20000, where the decoded physical bank changed from group 0 to group 1 but the command-static scheduled group remained zero."
    root_cause: "The scheduler owns two long-lived parity address streams, but acc_mem_accum_rd_group represented only the command's initial address. A parity stream can cross a physical bank-group boundary while retaining its parity, making the static group stale."
    fix_applied: "Decode acc_mem_accum_rd_bank directly from the currently selected address with get_acc_mem_idx(), remove acc_mem_accum_rd_group state, and change the simulation invariant to verify that decoded bank parity matches acc_mem_accum_rd_sel. Preserve full physical-bank PSUM tags and parity-based FIFO/credit scheduling."
    verification: "RTL implementation only; no blackbox run by rtl-impl. Static reference search found no remaining acc_mem_accum_rd_group use and git diff --check passed. Pending fresh exact-config XRT-VCS M128, M256, then M64 K256 N256."
    lesson: "Physical bank group is an address property that may change within one command; only parity is stable for the two FIFO/credit scheduler streams."
