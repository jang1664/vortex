  - timestamp: "2026-07-28 22:20"
    iteration: 2
    phase: implementation
    status: pending_verification
    test: "Trace-directed review of the exact-config M32/M64 K32 N32 VCS failure"
    error_summary: "The final FP32-to-FP16 stream is in correct row order, but the first output-store DMA descriptor used src stride 256B and bound 64 for M32. The GEMM writer had stored successive active rows 64B apart, so DMA destinations received source rows 0,4,8,... and the first mismatch was output index 32."
    root_cause: "Two command/layout contracts were inconsistent. VX_gemm_node_naive advanced final LMEM writes by active MXU width (groups_eff*2) while VX_gemm_dma_ctrl_naive describes output LMEM rows with padded NT*2 stride. Separately, VX_gemm_fsm_naive did not carry mt_eff_cur in DMA_ST, so the controller fell back to MT=64 when M_target was unavailable."
    fix_applied: "Use padded NT*2 final-output LMEM stride; carry eff_mt and active N on output DMA_ST; use the command's eff_mt for the output DMA row bound with compatibility fallback."
    verification: "RTL implementation only; no blackbox run by rtl-impl. git diff --check passed for the three modified RTL files."
    lesson: "The row-order signature was caused by overlapping compact final writes followed by padded-stride DMA reads, not by the generalized DMA gearbox. Edge-tile dimensions must be propagated explicitly rather than reconstructed from optional target registers."
