  - time: "2026-07-03 16:45"
    entry: >
      Added fixed-power-mode controls. measure_power.py now defaults to
      --no-power-auto-duration, --power-measure-latency, and one fixed power
      iteration via --power-iterations 1 / latency_bench --iterations 1. The
      auto-duration and power-latency modes can be toggled from both
      measure_power.py and run_power.sh environment variables.
pitfalls:
  - Existing latency_bench CLI requires pandas in the active Python env; system
    python3 currently fails importing pandas.
  - Power sample failures should remain visible as power_samples_low rows
    instead of being hidden, because small shapes may legitimately be too short.
  - Shape regex filters must match shape_id independently from the descriptive
    label; anchoring against a combined string drops valid s00/s01 filters.
  - If latency_bench is executed from repo root, generated suite paths must be
    absolute or repo-root relative; CWD-relative paths from latency_on_hw will
    otherwise fail with FileNotFoundError.
