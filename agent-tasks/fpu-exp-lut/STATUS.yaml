pitfalls:
  - "VX_pe_serializer depends on LATENCY_FEXP, so LUT mode must keep the same output latency unless VX_config.vh is changed consistently."
  - "A shared logical LUT may still be replicated by synthesis for fanout/timing."
  - "Software-compatible linear interpolation needs FP subtraction for f and df. Use xil_f32add with sign-flipped second operand instead of spending an FMA."
  - "xrt-vcs Makefile must include every generated Xilinx IP wrapper in XILINX_FPU_IPS; otherwise VCS elaboration cannot bind the module even if the IP exists on disk."
