pitfalls:
  - 'All eight VX_dma_unit channels share INSTANCE_ID; DMA_WRITE_EB attribution must include the %m hierarchy scope, not inst string alone.'
  - 'Scaling the legacy local-DMA misalignment TB from16B to32B doubles its transfer footprint; fixed source/destination addresses8KiB apart overlap a16KiB transfer. Repair TB allocation/bounds, not RTL, when validating32B.'
  - 'Legacy dma_mem_unit cfg_send_desc holds valid through an extra busy clock and clears at posedge; old held-request assertion can fail independently of write EB. Verify baseline and repair TB edge discipline, not RTL handshake safety.'
  - 'Registered dependency readiness requires monotonic state within an epoch; legal old decreasing SET behavior was explicitly removed by user authorization, not assumed away.'
  - 'Existing TMEM chunk issue trace can print the prior live tag during turnover; parser must validate interval pairing and report tag mismatches instead of silently mispairing descriptors.'
  - 'A two-entry buffer changes acceptance ownership; enqueue is not physical register/bank write completion.'
  - 'Using registered dependency values alone does not cut same-cycle inflight capacity or idle/completion bypasses.'
  - 'A registered ready bit without skid capacity can lose transfers; use the actual two-entry elastic-buffer implementation.'
  - 'Existing performance reports predate parts of the current baseline; remeasure HEAD with a freshly built simulator.'
