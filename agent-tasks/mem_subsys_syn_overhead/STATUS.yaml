pitfalls:
  - "VX_user_config.vh is NOT include'd by any RTL — old PLAN claim was wrong; configure step not needed for this synth."
  - "WORD_SIZE / XLEN must stay at default (XLEN_64 → WORD_SIZE=8 for LMEM). Overriding produces shapes outside macro inventory."
  - "Tag width is bank-count-invariant ONLY when CACHE_SIZE is held constant. Holding LINES_PER_BANK constant instead would shrink tag by 1 bit per NUM_BANKS doubling."
  - "Mux factor m16 has supported depth window — 1024×64m16 fails the ra1_hd compiler (out-of-range), use m8 instead. Always sanity-check by inspecting work/ for empty output dirs."
  - "axi_adapter has no SRAM — it can be synthesized directly without a wrapper."
  - "DC chokes on `__LINE__` triple-tick concat in BUFFER/POP_COUNT/REDUCE_TREE/NEG_EDGE macros. Hand-expand them before analyze (see expand_macros.py)."
  - "SS corner string is `ss_0p900v_0p900v_125c` (3-digit voltage), NOT `ss_0p9v_0p9v_125c`. The legacy lpp_28_compiled_sram.tcl had the wrong name."
  - "Skip `.v` macro files from analyze — some (e.g. ra2_hd_1024x16m16.v) declare `real` for timing, DC rejects with VER-177. The .db alone gives DC the macro module."
  - "+define+VIVADO is required so `VX_platform.vh's `STRING macro expands to empty (`string` SV type → DC reject)."
  - "Skip rtl/verification/* + a few sim-only library files; their `string` argument types fail DC analyze. See SKIP set in run_sweep.py."
  - "AXI adapter NUM_PORTS_IN scaling needs TAG_WIDTH_OUT >= TAG_BUFFER_ADDRW + log2(NUM_PORTS_IN) (log2(64)+4=10 for our biggest). Set TAG_WIDTH_OUT=16 for headroom."
