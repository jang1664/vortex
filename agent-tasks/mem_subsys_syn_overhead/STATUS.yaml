    - {label: "L4", num_reqs: 64, num_banks: 64, size_bytes:  524288, sram_shape: "1024x64 BWE8"}
  cache:
    - {label: "C1", num_reqs:  8, num_banks:  8, mem_ports:  8, cache_size: 4194304, lines_per_bank: 2048, data: "2048x512 BWE64", tag: "2048x16"}
    - {label: "C2", num_reqs: 16, num_banks: 16, mem_ports: 16, cache_size: 4194304, lines_per_bank: 1024, data: "1024x512 BWE64", tag: "1024x16"}
    - {label: "C3", num_reqs: 32, num_banks: 32, mem_ports: 32, cache_size: 4194304, lines_per_bank:  512, data:  "512x512 BWE64", tag:  "512x16"}
    - {label: "C4", num_reqs: 64, num_banks: 64, mem_ports: 64, cache_size: 4194304, lines_per_bank:  256, data:  "256x512 BWE64", tag:  "256x16"}
  axi:
    - {label: "A1", num_ports_in:  8, num_banks_out: 32}
