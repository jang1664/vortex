name: mem_subsys_syn_overhead
goal: |
  Quantify Synopsys DC area / timing overhead of Vortex's memory-subsystem
  interconnect (xbars) as bank/port count scales. Three tops:
    - VX_local_mem_top  (LMEM xbar:  NUM_REQS -> NUM_BANKS, sym for response)
    - VX_cache_top      (DCACHE xbars: NUM_REQS -> NUM_BANKS -> MEM_PORTS)
    - VX_axi_adapter    (AXI/HBM xbar: MEM_PORTS -> 32 PCs)
  Sweep is "CAP fixed", so total memory size is held constant while NUM_BANKS
  doubles → bank depth halves while bank width and tag width stay constant.

state: completed_partial
results_file: RESULTS.md
points_completed: 11_of_12
points_failed:
  - L4: "DC catapult segfault on 64-bank LMEM (xbar too large for ultra-effort opt)"
  - C4: "compile_ultra hung 8+ hours in late opt phases on 64-bank cache; killed manually"
created: "2026-05-05 22:16"

decisions:
  sram_strategy: "macros only (no flop fallback). 9 new generate arms in
                  VX_sp_ram_compiled / VX_dp_ram_compiled — 1024x16m16 reused
                  across 2048×16 (depth-stack) and 1024×16 points → 8 unique
                  macros to compile."
  tech: "lpp"
  clock_period_ns: 10.0
  num_ways: 4
  word_size_lmem: 8       # XLEN_64 default — DO NOT change
  word_size_dcache: 16    # cache_top default — DO NOT change
  cache_total_size_bytes: 4194304   # 4 MB — picks LINES_PER_BANK = 2048 at NUM_BANKS=8
  lmem_total_size_bytes:  524288    # 512 KB — picks WORDS_PER_BANK = 8192 at NUM_BANKS=8
  mem_addr_width: 34      # .envrc default
  axi_hbm_pc_count: 32    # PLATFORM_MEMORY_NUM_BANKS

