  - timestamp: "2026-07-18 14:36"
    iteration: 4
    status: complete
    action: >-
      Forced a fresh xrt-vcs simv build with the exact naive depth-eight config,
      then ran the representative generation and full-prefill blackbox workloads
      through ci/run_black.sh xrt-vcs-sim.
    result: >-
      Both workloads passed bit-exact output checking. Generation completed in
      14434 cycles versus the retained 14194-cycle dedicated-local-DMA baseline,
      a 1.69 percent regression within the 5 percent budget. Prefill completed
      in 211923 cycles versus 199796, a 6.07 percent regression within the 10
      percent contention-sensitive budget. Resource utilization remained out
      of scope as requested.
    learned: >-
      Eight outstanding beat credits are sufficient to keep full-system
      performance close without reproducing the old segment-distance prefetch
      policy. Prefill is more sensitive than generation, but remained inside the
      declared contention budget.
  - timestamp: "2026-07-18 14:39"
    iteration: 5
    status: verification_passed
    action: >-
      Forced a fresh VCS compile of the dedicated local-DMA test with
      PERF_ENABLE and the normal misaligned test defines enabled.
    result: >-
      Compilation and elaboration passed with PERF_ENABLE present in the VCS
      command line. The only related diagnostics were expected testbench
      warnings that the two optional perf output ports are unconnected; there
      was no RTL compile or elaboration error.
    learned: >-
      The wrapper-owned performance-counter conditional path is syntactically
      and structurally valid under PERF_ENABLE.
  - timestamp: "2026-07-18 19:10"
    iteration: 6
    status: performance_cause_confirmed
    action: >-
      Ran controlled legacy/common-core VCS A/B tests across one beat through
      512 segments, repeated them with alternating GEMM backpressure, collected
      fresh generation and prefill xrt-vcs measurements, counted real local-DMA
      commands, and compared focused full-prefill FSDB state and latency metrics.
    result: >-
      The wrapper adds a fixed four cycles of command spacing: one request
      enqueue cycle, two response/pack/write-buffer cycles, and one wrapper
      rearm cycle. Fresh same-tree cycles are 14201 versus 14434 for generation
      (+1.64%) and 194214 versus 211671 for prefill (+8.99%), both passing. In
      prefill, input DMA latency grows by 12296 cycles, exactly matching GEMM
      busy growth; two weight-notification states grow by 15501 cycles and
      explain 90.42% of the GEMM FSM increase. Physical LMEM stalls grow while
      logical input request stalls do not.
    learned: >-
      The common core retains isolated throughput and outstanding eight matches
      legacy prefetch depth four within the fixed four-cycle command cost. The
      prefill regression is fixed pipeline latency amplified by input/weight
      phase changes on shared LMEM, not a missing PREFETCH bandwidth window.
      Optimize response-to-write latency first, then request enqueue and wrapper
      rearm; retain explicit PREFETCH as a later fallback only if those changes
      do not restore the shared-LMEM phase.
