pitfalls:
  - fpint_gemm_ffn_hw accepts QBLK=32 only; QBLK=16 is rejected before device connection and is not a simulator failure.
  - CodeGraph search for MemoryModel returned no results; targeted source search is needed.
  - Archived sources.txt includes current-checkout third-party include paths; do not accept these without provenance checks.
  - Do not use blackbox nohup temporary mode: its cleanup contains prohibited rm.
  - Original run_black.sh does not forward run-only and normally rebuilds simv. Historical comparisons now use the user-approved temporary copy plus explicit stage selection; never use the original rebuild path for archived comparisons.
  - Packaged source absence is distinct from a content mismatch; packaging omits unused modules and separates headers.
  - Source configs via ../configs from build_hbm_reference and set -e; initial unit command used a wrong relative config path, then was corrected and rerun successfully.
  - Existing config tests must run under configured build/sim/xrtsim_vcs, not build root; wrong-CWD failures were rerun successfully.
  - Native model tests require make -C build/hw config after configure; missing VX_config.h was resolved. This is native-backend setup, not historical RTL compilation.
  - Document-v1 short single-PC stream is slower than legacy; trace shows frequent row changes from queued requests. Published bandwidth ceilings are not yet demonstrated sustained rates.
  - The preceding short-stream issue was traced to legacy contiguous row mapping and nBL=4 for 32B transactions; RBC/BG interleave plus nBL=2 restores the 100MHz interface bandwidth ceiling in read sweeps.
  - Residual ceil-to-ps can miss a receiving HBM edge by 1ps; nearest-ps residual avoids double-rounding an already quantized completion timestamp.
