    phase: phase2_consumer_readiness_implementation
    status: implementation_ready
    test: "Static target-config RTL/TB lint and SCC audit only; hand off the ordered VCS unit/node/integration matrix to verification."
    error_summary: "Phase 2 previously carried Scale/ZP values through snapshot pipelines, admitted Input against early aggregate operand readiness, used four Weight banks, and did not express exact independent W/S/Z generation lifetimes at their true consumers."
    root_cause: "The old shared-buffer/snapshot contract coupled operand ownership to command admission instead of the physical register read. That both hid the true overwrite lifetime and made future-generation waiters capable of participating in writer fences. QCOL Scale additionally sits after a two-cycle always-accept int2fp island, so its consumer stall needs bounded result storage rather than combinational ready through the island."
    fix_applied: "Added independent W/S/Z bank plus 32-bit exact LOAD targets to Input metadata; removed early W/S/Z node admission gating and every Scale/ZP value snapshot payload; placed exact registered-generation gates/direct reads at QROW Scale, common-fork Weight/QROW-Z/QCOL-Z readiness, aligned QCOL-Z multiply, and QCOL output Scale. Added a mathematically required depth-2 int2fp result FIFO/credit boundary. Converted W/S/Z to independent two-bank resources, removed W2/W3 storage/RIDs/routes without renumbering remaining 5-bit RIDs, preserved same-cycle final old read plus next-version write with next-cycle visibility, and kept QCOL-Z busy until its aligned direct read. Future waiters do not own a bank; writer_wait remains the overwrite fence. QCOL final consume wins a same-cycle resource-event collision and stalls the QROW final consumer for one cycle. Dedicated direct folds for writer consume and ACC_FREE child-4 completion preserve same-cycle semantics without feeding unrelated aggregate effective_sync SCCs. Assertions/debug and directed TB metadata/resource coverage were updated."
    verification: "Focused Verilator lint passed for gemm_fsm, gemm_ctrl, gemm_sync, lmem_dma_weight_overlap, and the legacy gemm_unit_v2 RTL/TB with no %Error or Phase-2 consume/writer UNOPTFLAT path. Full gemm_node_improve target-config lint exited 0 with no %Error. Its SCC audit has no consume->writer release->qparam req_valid/ready->consumer path; residual warnings are the pre-existing controller/output-DMA scheduling packed-vector loop, DMA config-ready loop, generated reduce/prealign paths, and CVFPU/lzc paths. Residual source audit found no W2/W3 RID/route or Scale/ZP snapshot symbol, and git diff --check passed. No VCS, simulation, blackbox, or FSDB was run by the implementation role."
    lesson: "Generation readiness and resource ownership are different contracts: exact future readiness may stall at a consumer, but only an actual read lifetime may fence overwrite. A fixed-latency no-ready island must reserve enough downstream entries for every result already accepted when feedback is delayed."
