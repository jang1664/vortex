      Root cause: `t2` holds `GEMM_STREAM_BURST_ADDR` (0x1088). The compiler
      hoisted `li t2, 0x1088` OUTSIDE the multi-thread region (because the
      constant is uniform and the compiler doesn't model warp activation).
      Lanes 1..7 of warp 1 wake up via vx_tmc with t2 = X.

      The previous fix only addressed the `sp`-based load (local_words[]).
      But ANY GPR holding a uniform constant materialized in single-thread
      mode is X for newly-activated lanes. The constant 0x1088 is the next
      offender.

      Real fix: force constant materialization INSIDE the multi-thread
      region via inline asm. Use a `li` (or lui+addi) wrapped in
      `asm volatile` so the compiler can't hoist:
        uintptr_t mmio_base;
        asm volatile ("li %0, %1" : "=r"(mmio_base) : "i"(GEMM_STREAM_BURST_ADDR));
        *reinterpret_cast<volatile uint64_t*>(mmio_base + 8 * lane) = w;

      The asm volatile prevents the compiler from CSE-ing the constant
      across the vx_tmc boundary; the load gets re-emitted inline.

      For thoroughness, all per-lane GPR reads must be either:
        (a) CSR reads (csrr — uniform broadcast, X-clean)
        (b) GPR writes that happen INSIDE the active region (li, addi from
            CSR-derived values, etc.)
      Anything else risks X for newly-activated lanes.

