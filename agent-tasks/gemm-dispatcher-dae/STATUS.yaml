    note: |
      Vortex LSU treats RISC-V `fence w,w` and `fence r,r` (and presumably any
      `fence` variant) as a global L2 cache flush trigger, NOT as a cheap memory
      ordering hint. Empirical: ring_push/ring_pop fences caused 282K fence-wait +
      282K data-flush events in 5.2 ms simtime, ~2200 events per ring op pair.

      Lesson: do NOT use `asm volatile ("fence w,w")` / `("fence r,r")` for
      lightweight intra-core synchronization on Vortex. For LMEM-resident SPSC
      structures, volatile-qualified pointers + (optionally) an empty-asm
      compiler barrier `asm volatile ("" ::: "memory")` are sufficient — LMEM
      bank ordering is implicit at the bus level.

      Reference for fix: docs/gemm-dispatcher-optim/DAE.md §1 SW pattern shows
      `fence w,w` / `fence r,r` calls — these came from the original DAE proposal
      assuming a normal RV memory model. They turned out to be too heavyweight on
      Vortex. The fix in IMPL_DAE_SW (next iteration) drops them to compiler-only
      barriers; functional correctness is preserved.
  - timestamp: "2026-04-28 23:02"
    note: |
      Vortex boot stub only initializes thread 0 of each spawned warp. When
      a kernel later activates inactive lanes via vx_tmc(mask), those lanes
      bring uninitialized (X in simulation) GPRs.

      Implication: any per-lane code path that reads a GPR before writing
      it will X-propagate on the newly-activated lanes. Common gotcha: the
      stack pointer `sp` is a GPR (x2). Stack-relative loads/stores from
      lanes 1..7 of a wspawned warp will compute X addresses.

      Lesson: when issuing a burst from a wspawned warp, the per-lane
      data path MUST avoid sp-relative accesses. Use LMEM-resident buffers
      addressed via VX_CSR_LOCAL_MEM_BASE (a CSR, X-clean broadcast) + tid
      CSR. The compiler emits csrr → addi → ... patterns where each
      destination GPR is written before being read, breaking the X chain.

      DAE.md §2 burst pattern needs to be updated: the "uniform pointer +
      per-lane tid offset" recipe must use a CSR-derived base, NOT a
      stack-derived base. The mmio_burst_proto/kernel.cpp prototype only
      verifies the per-lane STORE pattern; it doesn't exercise the
      per-lane LOAD-from-sp path that bites in production.

      Workaround for run_consumer in fpint_gemm_ffn_hw_improve: stage the
      burst words in LMEM at a fixed offset (e.g. LMEM_BURST_OFFSET=0x110,
      growing LMEM_RESERVED_SIZE to 0x150 to fit 8 × 8B = 64B), then have
      stream_send_burst read from LMEM rather than from a stack array.

      ADDENDUM 2026-04-28 23:12 (after VERIFY_COMBINED iter 2 also failed):
      The LMEM-staging fix is necessary but NOT SUFFICIENT. Compiler
      hoisting of UNIFORM CONSTANTS into pre-vx_tmc registers is the next
      attack surface — any `li r, IMM` for a uniform constant gets CSE'd
      into single-thread setup and lanes 1..7 see X.

      Required pattern for ANY per-lane code activated via vx_tmc(mask)
      where mask was previously vx_tmc_one():
        - First op MUST be `vx_tmc(mask)` (activates lanes).
        - All subsequent register reads must come from registers written
          INSIDE the active region. Sources allowed:
            * csrr (uniform broadcast)
            * inline asm `li`/`lui+addi` wrapped in asm volatile to defeat
              hoisting
            * arithmetic on values produced in (a) or (b)
        - Avoid plain C-level constants — the compiler will hoist them.
        - Functions called inside the active region must be `noinline` OR
          their constants must be guarded by inline asm.

      Practical recipe for forcing constant materialization inline:
        uintptr_t base;
        asm volatile ("li %0, %1" : "=r"(base) : "i"(MY_CONST));

      The `asm volatile` with output constraint forces the compiler to emit
      the `li` exactly where written. RISC-V `li` is a pseudo that expands
      to lui+addi (or addi for fits-in-12bit), all of which write fresh
      registers — X-clean for any active lane.
