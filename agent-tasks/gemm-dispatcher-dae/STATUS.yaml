        - Run completed end-to-end at simtime 5.915 ms (vs iter1 truncated at
          5.234 ms).

      Fence flood eliminated:
        - In-kernel `fence` instructions executed: 0 (vs iter1 ~282K)
        - L2 data-flush events: 2,048 (single termination sweep at 5.894 ms)
          vs iter1 281,847 mid-run. **99.6% reduction.**
        - Only remaining `fence` is in libc `_Exit` — runs once at exit.

      Performance breakdown (iter2 vs baseline):
        | Metric              | Baseline | DAE iter2 | Delta    |
        |---------------------|----------|-----------|----------|
        | End-to-end cycles   | 125,347  | 588,034   | +369%    |
        | Total instructions  |  17,376  | 124,518   | +617%    |
        | IPC                 |   0.139  |   0.212   | +52%     |
        | GEMM total_cycles   |  14,891  |  12,814   | -14%     |
        | DMA+MXU overlap     |  58.88%  |  68.43%   | +16%     |
        | MXU input util      |   6.5%   |   1.39%   | -78%     |

      Interpretation:
        - The MXU side actually runs slightly faster: GEMM cycles -14%, overlap
          +16%. The DAE concept is working — overlapping producer-compute with
          consumer-MMIO does buy something.
        - IPC improves 1.5× exactly as DAE.md §1 predicted (two ready warps
          let the scheduler hide ~half the fetch+decode bubble).
        - But total instruction count goes UP by 7.2× because every command
          now requires producer-side ring_push (~4 instrs) plus consumer-side
          ring_pop (~7 instrs: head load, tail load, branch-on-empty, done
          load, ring slot load, tail++ store) plus the MMIO store itself.
        - 7.2× instruction inflation / 1.5× IPC improvement = 4.7× more
          cycles. Math overwhelms the DAE benefit.

      Root cause for residual regression (analysis from iter2 disasm):
        Each ring_pop currently emits ~7 instructions (mostly LMEM loads
        forced by `volatile`). The producer's ring_push adds ~4 instructions.
        With ~1038 commands streamed, dispatch overhead is squarely on the
        critical path — the GEMM controller already finished in 12,814 cycles,
        so the 588K cycle total is dominated by the dispatch loop.

      Architectural decision point:
        DAE.md §1 predicted "1.3–1.7× end-to-end" gain for DAE-alone. That
        prediction assumed ring overhead is ~1 LMEM op per push/pop. Actual
        SPSC semantics with `volatile` guards force re-loading head/tail/done
        on every iteration → ~7 instructions per pop, not 1.
        Mathematically, DAE-alone CANNOT beat baseline for this kernel
        without either:
          (a) a much cheaper ring (≤ 2 instructions per pop, requires caching
              own-side tail/head in registers across iterations and only
              re-reading from LMEM on miss — see Verification agent
              recommendation #2), or
          (b) the producer eliminates its own per-command ring_push cost
              (e.g. issue commands in batches, but that's nearly equivalent
              to combining with IMPL_BURST), or
          (c) skipping DAE-alone gating and going straight to combined
              DAE+Burst (which is what DAE.md "Combined Approach" §
              describes as the design target).

        Optimization (a) is worth attempting (Verification's recommendation
        #2). Best-case math: pop ≈ 3 instrs → total instrs ≈ 5N → cycles
        ≈ 5N/1.5 = 3.3N → still 3× regression. So even (a) likely won't
        beat baseline alone.

