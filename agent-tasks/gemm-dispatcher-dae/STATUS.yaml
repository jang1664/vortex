    note: |
      VERIFY_DAE_SW — Verification subagent ran fpint_gemm_ffn_hw_improve regression.

      RESULT: Functional progress confirmed but **MASSIVE cycle regression** — does
      not meet "cycles < baseline" criterion. Transitioning back to IMPL_DAE_SW.

      Functional checks (all PASS):
        - active_warps in dispatcher window = 0011 (warp 0 + warp 1 concurrently
          active) — DAE engaged exactly as designed
        - 0 MMIO writes to GEMM_STREAM_ADDR (0x1088) from warp 0
        - 97 MMIO writes from warp 1 (consumer) — producer→ring→consumer→MMIO path
          is correct
        - Ring head/tail progressing, no deadlock, no X propagation, no AXI stalls
        - simv.log clean (no Fatal/Error/MISMATCH)

      Cycle measurement:
        - Sim killed at simtime 5.234 ms (~523,400 cycles at 100 MHz) before kernel
          completion. simv.log = 266 MB at that point.
        - Producer at lmem_head=127 of estimated ~1000 ring pushes (~13% complete).
        - Linear extrapolation to completion: ~30 ms simtime ≈ 3M+ cycles ≈ 24×
          baseline (125,347).
        - This is way past the FSM's "cycles < baseline" criterion.

      Root cause (high confidence):
        The asm volatile ("fence w,w") in ring_push (kernel.cpp:53) and
        asm volatile ("fence r,r") in ring_pop (kernel.cpp:67) are lowering to RISC-V
        FENCE instructions that the Vortex LSU treats as global, triggering an L2
        cache flush each time.
        - simv.log: 282,557 fence-wait events + 281,847 data-flush events in 5.2 ms
          of simtime.
        - 281K flush events / 127 ring pushes ≈ 2200 events per push → consistent
          with each ring op stalling for an L2 drain round-trip.
        - The fences are unnecessary for an LMEM-only ring on a single core: LMEM is
          uncached on-chip SRAM with implicit in-order ordering for a single
          producer-consumer pair, and the volatile-qualified pointers already prevent
          compiler reordering.

      Fix plan (next IMPL_DAE_SW iteration):
        Replace the two RV `fence w,w` / `fence r,r` in ring_push/ring_pop with
        compiler-only barriers — either:
          (a) `asm volatile ("" ::: "memory")` (compiler barrier, no instruction
              emitted), OR
          (b) drop the inline asm entirely; rely on volatile-qualified pointers (the
              accessors return `volatile uint64_t*` / `volatile uint32_t*` so the
              compiler will not reorder loads/stores through them).

        The volatile is sufficient. Hardware ordering on the LMEM bank is
        single-port FIFO-ordered for a single core; cross-warp visibility on the
        same core's LMEM is immediate (same SRAM, same access port).

      Captured artifacts:
        FSDB:    build/sim/xrtsim_vcs/vcs_cosim.fsdb (64.8 MB, partial — ends 5.234 ms)
        sim log: build/sim/xrtsim_vcs/simv.log       (266 MB, partial)

