    action: "Compared placed utilization and timing against the immediately preceding fail_v1 build."
    result: "Both builds failed routing at global congestion level 7. The parallel synchronization change reduced GEMM controller LUTs from 26,580 to 20,598 and improved placed WNS from -15.682 ns to -6.821 ns."
