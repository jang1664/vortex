  - timestamp: "2026-08-31 12:02"
    action: "Opened the route-error checkpoint and generated fresh congestion and top-300 high-fanout reports."
    result: "Level-7 windows are dominated by u_tmem_subsystem (up to 58 percent), u_dma_engine (up to 39 percent), and the adjacent HMSS shell (up to 33 percent). SLR0 occupied CLB utilization is 95.30 percent, and localized SLL columns reach 200 percent demand."
    learned: "The dominant physical problem is wide TMEM/DMA/HMSS routing under severe SLR0 packing and localized SLR-crossing pressure, not aggregate device LUT capacity."
  - timestamp: "2026-08-31 12:05"
    action: "Mapped negative-slack high-fanout nets back to RTL."
    result: "candidate_capture_idx drives 1,444 loads per bit at about -6.7 ns; issued_chunk_beats_per_bank_q drives 1,672 loads; u_switch_weight order pointers drive over 2,100 loads; and the weight stream queue drain selector drives 1,332 loads."
    learned: "Small selectors are controlling very wide pending-command, descriptor, and payload arrays. The resulting mux and broadcast cones are the principal RTL-level congestion mechanism."
  - timestamp: "2026-08-31 12:12"
    action: "Documented the diagnosis and ranked fixes without changing production RTL."
    result: "Recommended first separating completion control from registered descriptor banks, then moving wide stream/switch response payload arrays to banked synchronous BRAM, followed by localized DMA control replication and SSI-aware placement experiments."
    learned: "A hard SLR0 lock is counterproductive at the current density; RTL fanout and wide mux reduction should precede floorplanning."
  - timestamp: "2026-08-31 12:16"
    action: "Started expanding the diagnosis into a complete current and next-order PnR issue inventory with exact RTL source locations."
    result: "In progress. Revalidating route-error, placed timing, hierarchy utilization, and high-fanout evidence before updating the report."
    learned: "Current confirmed blockers and likely post-fix bottlenecks must be labeled separately so that speculative risks are not presented as measured failures."
  - timestamp: "2026-08-31 12:31"
    action: "Expanded diagnosis.md into a current PnR issue inventory, next-order risk register, exact RTL line map, combined implementation scope, and acceptance checklist."
    result: "Documented the fatal route and SLL/SLR conditions; mapped the two leading placed timing families through DMA completion arithmetic and compute-to-TMEM ready feedback; and recorded wide payload, DMA control, GEMM queue, MXU weight-select, merged-FIFO, issue/dispatch, hold, and flow risks. Markdown whitespace and every relative source link were validated."
    learned: "The second -6.792 ns compute-to-TMEM control path must be fixed with the -6.821 ns DMA completion path. Fixing only the worst endpoint will simply expose the second family. The placer-final section also contains level-7 long and short congestion; --no-early-fail allowed routing but did not cause the problem."
  - timestamp: "2026-08-31 13:43"
    action: "Replaced the full-chip PnR acceptance gate with focused VX_gemm_node OOC timing and FPINT GEMM simulation goals."
    result: "The OOC target now requires every control-related path to have at most 5.000 ns data-path delay and nonnegative WNS under a 5.000 ns clock. The TH16 FPINT GEMM matrix requires numerical success and no more than 2.0 percent absolute cycle change in each baseline/candidate case."
    learned: "ci/run_target_gemm.sh currently hard-codes the TH32 config and must be parameterized for the TH16 configuration before it can serve as the acceptance runner. Full-chip route closure remains a later deployment gate rather than the current RTL iteration gate."
  - timestamp: "2026-08-31 14:07"
    action: "Revised the focused OOC timing acceptance criterion from a 5 ns control-path delay target to a 7 ns setup-only check."
    result: "The complete constrained VX_gemm_node clock domain now passes at setup WNS at least zero, setup TNS zero, and zero setup-failing endpoints under a 7.000 ns clock. Hold timing, raw path delay, resources, and worst-path identity are explicitly excluded from acceptance."
    learned: "The FPINT GEMM numerical and per-case 2 percent cycle-change criteria remain unchanged."
  - timestamp: "2026-08-31 14:49"
    action: "Created a separate implementation and verification plan limited to the two measured GEMM-node control setup path families."
    result: "The plan isolates DMA completion from the existing prepared-next descriptor set and cuts compute-to-TMEM ready feedback with local registered request reservations. It defines focused simulation, per-case FPINT performance, and 7 ns OOC setup gates."
    learned: "The current controller already decodes one queued candidate in advance. The remaining work is to remove completion-controlled wide descriptor selection/copy and candidate-capture coupling, while keeping the DMA done reduction parallel and unregistered."
  - timestamp: "2026-08-31 15:47"
    action: "Updated the focused timing plan with the confirmed Problem-A implementation structure."
    result: "The plan now requires a registered decoder-command plus valid/provenance context, an explicit foreground decode-result FSM stage, independent completion and capture transactions, supported same-edge chain plus third-command capture, and completion use of registered prepared data only."
    learned: "The decoder-input stage adds one cycle only to the unprepared slow path; background lookahead should hide it, while the per-case 2 percent FPINT cycle gate detects any workload-visible loss."
