logs:
  - timestamp: "2026-07-30 12:18"
    entry: "Started read-only investigation. Located .new_c4 outputs and interpolation refinement implementation; noted the worktree already contains unrelated user changes that must be preserved."
  - timestamp: "2026-07-30 12:22"
    entry: "Found two selection layers: the example refine script targets only generation_merged_C4_2 and explicitly filters softmax/dequant types; independently, interpolation_candidates accepts only measurement_kind=interpolated. Decode SGEMM/FPINT attention GEMMs are classified tile_step and non-representatives are bucket_reused."
