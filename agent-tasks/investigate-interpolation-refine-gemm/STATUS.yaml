  - timestamp: "2026-07-30 13:17"
    entry: "Created an independent reflink-backed full backup of both outputs_*.new_c4 and generated_suites/*.new_c4 trees at analysis_workspace/latency_on_hw/backups/sgemm_canonical_20260730T1252, plus a second CSV-only pre-migration backup. Updated SGEMM canonicalization to 16/16/32, made SGEMM padded_args equal measurement_args, and changed raw migration to recompute exec keys, deduplicate solely by physical exec_key, and prefer the most complete passing row."
  - timestamp: "2026-07-30 13:17"
    entry: "Migrated 228 case/raw CSV artifacts: all-bin raw rows changed 4621 -> 4477 and 2,729,099 case rows were rewritten. The 144 removed rows are the predicted C1 SGEMM physical duplicates: Llama2 189 -> 117 and Llama3 196 -> 124. Every retained C1 row is status=pass, has a unique valid exec_key, is 16/16/32 aligned, and has args equal to padded_args."
  - timestamp: "2026-07-30 13:17"
    entry: "Regenerated full sampled Llama2/Llama3 new_c4 suites with the original batch/sequence/output-token matrix and C4=C4_2 remap. YAML file sets and all index case counts match the backup. Raw coverage validation found zero missing passing SGEMM measurements: Llama2 requires 105 unique measurements and Llama3 requires 112. Focused 61 tests and git diff --check passed."
