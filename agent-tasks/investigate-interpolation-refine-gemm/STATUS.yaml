  - timestamp: "2026-07-30 12:27"
    entry: "Follow-up: SGEMM N and K granularities differ because WMMA N uses tileN directly while logical FP16 K is tileK multiplied by the number of FP16 values packed in one 32-bit register. NT=8 therefore gives 8/8/16. The current C1 config and measurement logs use NUM_THREADS=32, for which the compile-time SGEMM bench derives 16/16/32; workload generation and latency canonicalization still hardcode 8/8/16, causing redundant measurements of identical actual padded shapes rather than missing shapes."
  - timestamp: "2026-07-30 12:27"
    entry: "User requested the th32 SGEMM padding correction and a rerun-impact assessment; implementation started."
  - timestamp: "2026-07-30 12:32"
    entry: "Changed SGEMM decode QK/PV alignments to 16/32, canonical M/N/K alignments to 16/16/32, documented the current C1 geometry, and added a sampled-decode regression covering measured versus bucket_reused transitions."
  - timestamp: "2026-07-30 12:32"
    entry: "Verification passed: 36 workload kernel-variant tests, 6 canonicalization tests plus the focused new test, 16 interpolation tests, and git diff --check. Broader dirty-worktree suites retain four unrelated expectation failures: two workload expansion tests and two generate-suites tests."
  - timestamp: "2026-07-30 12:32"
    entry: "Rerun analysis: existing C1 prefill raw DB covers all newly canonicalized SGEMM args (Llama2 30/30, Llama3 36/36). C1 generation needs 75 Llama2 and 76 Llama3 new exec keys unless old physically equivalent rows are migrated/rekeyed. C3/C4_2 and interpolation refinement are unaffected."
  - timestamp: "2026-07-30 12:36"
    entry: "Revalidated the padding basis after user challenge. The exact NT=32 FP16 wmma_config_t reports core(tc)=8x4x4 and fragment tile=16x16x32. The built C1 host and kernel flags both contain NUM_THREADS=32 and select SGEMM_TCU_VARIANT_B_COLMAJOR; bench_main aligns logical M/N/K to cfg::tileM/N/K and passes only M_exec/N_exec/K_exec to the direct kernel. Old 8/8/16-canonicalized cases passed because the benchmark silently applied this second 16/16/32 padding (padding messages are suppressed in CSV mode), not because 8/8/16 matched the actual th32 tile."
  - timestamp: "2026-07-30 12:40"
    entry: "Corrected the implementation boundary after user clarification: retained 16/32 only for physical decode bucket selection and restored raw-DB request canonicalization to 8/8/16. Existing measurements are keyed by those pre-benchmark request args, so regenerated suites can reuse them with skip-existing; no C1 SGEMM remeasurement or raw-DB migration is required. Updated documentation to distinguish request-key granularity from physical benchmark padding. Verification passed: 58 focused workload/canonicalization/interpolation tests and git diff --check."
  - timestamp: "2026-07-30 12:50"
