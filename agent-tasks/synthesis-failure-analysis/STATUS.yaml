  - time: "2026-07-14 21:26"
    entry: >
      The Vortex full synthesis still requires a separate RTL compatibility
      change: DC reports ELAB-425 for DATAW expressions in
      VX_dma_unit_misal.sv and VX_dma_unit_align.sv that access
      dcache_bus_if.ADDR_WIDTH through an interface instance. This cannot be
