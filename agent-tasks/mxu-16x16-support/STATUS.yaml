  - timestamp: "2026-09-04 23:00"
    phase: mxu16_blackbox_acceptance
    status: sim_fail
    summary: >-
      Final2 used one fresh simv image: cases 1, 2, and 3 passed, while case 4
      M=31, N=48, K=80, WTRANS=1, QDIR=1 stopped at 51.985 us on the internal
      ACC same-bank read/write assertion.
    verification: >-
      build_mxu16_accept_final2: ci/run_black.sh xrt-vcs-sim --app
      fpint_gemm_ffn_hw --args
      '-m 31 -n 48 -k 80 -q 32 -t 1 -d 1 -r 1'
    root_cause: >-
      FSDB at 51.975 us shows an early read of 0x80 on bank 0 and a nominal
      read of 0x40 on bank 1 while load write tag 30 targets 0x780 on bank 0.
      The read and write addresses differ, so this is not a d=3 RAW: the
      fixed-latency read schedule and always-ready write path contended for
      the same single-port ACC bank.
    fix_applied: >-
      VX_gemm_acc_internal now gives a scheduled compute read priority and
      deasserts wr_req_ready for an unrelated same-bank write. The existing
      ordered core result queue retains the stable write until acceptance. An
      exact-address collision is fatal rather than being hidden by arbitration.
      Added an M=5 seamless QROW load/accumulate test that requires write
      backpressure, ordered completion, ten writes, two command-final pulses,
      and correct data for all five rows.
    lesson: >-
      Early scheduling avoids a future producer slot but can still collide
      with an unrelated older write on the physical single-port bank. Resolve
      that structural conflict at the backend handshake, while preserving RAW
      failures as assertions.
  - timestamp: "2026-09-04 23:05"
    phase: mxu16_blackbox_fixed_seed
    status: sim_fail
    summary: >-
      After the required five-case matrix passed on one frozen image, the
      fixed-seed M=18, N=78, K=22, QBLK=32, WTRANS=1, QDIR=0 case completed
      without an RTL assertion but reported 226/1440 numerical mismatches.
      A reduced N=32 diagnostic reproduced the first failure at m=8,n=16 and
      reported 110/576 mismatches.
    verification: >-
      build_mxu16_accept_final3: ci/run_black.sh xrt-vcs-sim --app
      fpint_gemm_ffn_hw --args
      '-m 18 -n 78 -k 22 -q 32 -t 1 -d 0 -r 1' --debug 1
    root_cause: >-
      The output FSM and host detiler agree on an 8-row-aligned 768-byte
      stride between 18x16 output slots. Such a slot starts at 64-byte DMA
      channel 4 and its nine-beat payload wraps through channels 0..3. The
      DMA descriptor decoder stripped the start-channel bits from the TMEM
      base but assigned that same bank-local base to every channel, omitting
      the one-word carry for wrapped channels. Consequently rows 8..15 of the
      affected N microtile read the preceding bank-local word.
    fix_applied: >-
      VX_gemm_tmem_dma_ctrl now adds one 64-byte bank-local word to channels
      whose first logical beat wraps past channel 7, for both load and store
      descriptors. Added a directed nine-beat store starting on channel 4;
      it checks channels 0..3 receive the carried TMEM base, channel 4 receives
      two beats, all HBM bases remain in logical order, and emits the
      TMEM_START_CHANNEL_WRAP_PASS marker.
    lesson: >-
      Removing interleaved channel bits is not just a shift of the common base:
      a nonzero start channel needs a per-channel quotient carry when the
      linear transfer wraps. Aligned starts and transfers of at most one beat
      per active channel cannot expose this alias.
  - timestamp: "2026-09-04 23:20"
    phase: mxu16_standalone_weight_layout
    status: sim_fail
    summary: >-
      The standalone tile_weight_w4a16 case K=17, N=18, WTRANS=0 completed but
      reported 121/512 byte mismatches. The first mismatch was destination
      byte 8, got 0x08 instead of 0x09. The earlier N=17 attempt is excluded
      because packed INT4 storage requires an even N.
    verification: >-
      build_mxu16_accept_final4: ci/run_black.sh xrt-vcs-sim --app
      tile_weight_w4a16 --args '-k 17 -n 18 -t 0' --debug 3
    root_cause: >-
      Both WTRANS=0 kernel paths retained an MXU32-specific 16-byte copy. An
      MXU16 packed N microtile is only MXU_NT/2 = 8 bytes. In the general tail
      path, adjacent threads therefore overlapped destination chunks and a
      non-power-of-two N also made later packed source rows unsuitable for
      uint64_t pointer assumptions. The flat full-prefill path had the same
      extra second 64-bit store. WTRANS=1 and source-transposed WTRANS=1 use
      explicit nibble repacking or one-byte copies and do not share this bug.
    fix_applied: >-
      The general WTRANS=0 path now copies exactly pair_per_n_sub bytes with
      byte-granular tail-safe accesses. The aligned flat path retains one
      64-bit transfer for MXU16 and conditionally emits the second transfer
      only for the supported MXU32 profile. The PyTorch launcher struct was
      also brought back into exact alignment with the shared kernel ABI by
      adding the log2_n and flat-mode fields; it explicitly selects the
      general 3-D path. Comments now describe the logical packed-microtile
      width instead of a fixed 16-byte chunk.
    lesson: >-
      INT4 weight vector bytes scale as MXU_NT/2. Parameterizing only loop
      indices is insufficient when a fast path still has a fixed number of
      machine-word loads or stores; tail paths must also avoid assuming that
      packed row strides are naturally aligned.
  - timestamp: "2026-09-04 23:27"
    phase: final_functional_acceptance
    status: pass
    summary: >-
      Fresh MXU16 controller verification proved the nonzero-start-channel
      quotient carry. A new current-source xrt-vcs-sim image then passed the
      original failing random case, all five required numerical matrix cases,
      four fixed-seed random cases, and a 192x160x256 QROW/transpose stress
      case. All MXU16 blackbox results used one simv sha256
      42b6e97232df507abb75f362536ad4593b2bb24d40348cd0fee0aa38417573fa.
    verification: >-
      build_mxu16_accept_final4 with the target config and ci/run_black.sh
      xrt-vcs-sim; exact commands and retained logs are listed in
      agent-tasks/mxu-16x16-support/verification-results.md.
    lesson: >-
      Required boundary cases and randomized cases are complementary. The
      original five-case matrix covered configuration, tails, QDIR/WTRANS,
      and outer tiles, while a non-power-of-two output-slot stride was needed
      to expose the interleaved-channel quotient carry.
  - timestamp: "2026-09-04 23:27"
    phase: compatibility_and_software_closure
    status: pass
    summary: >-
      Current-source MXU32 QCOL and QROW cases passed one forced-rebuilt image.
      Standalone MXU16 input, output, scale/ZP, and five weight-layout variants
      passed byte-for-byte checks after correcting the weight copy width.
      Generated-geometry simx passed the differential fpint case, legacy
      fi_gemm rejects MXU16 explicitly and preprocesses for MXU32, and XRT
      remains unchanged at its 64-byte physical mapping.
    verification: >-
      See agent-tasks/mxu-16x16-support/verification-results.md and its linked
      wrapper/application/focused-test logs.
    lesson: >-
      Keeping the 64-byte contract at the HBM/XRT boundary localizes width
      conversion to the TMEM pair adapter. Software layout code must still
      derive every packed microtile byte count from MXU geometry, including
      optimized flat-copy paths and launcher ABI fields.
