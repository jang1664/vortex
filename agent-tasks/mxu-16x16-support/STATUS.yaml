      values from MXU_ROW. Replaced the defer-only read classification with a
      one-cycle result-FIFO head hold for the exact d=3 RAW plus d=2 bank-alias
      pattern, before any ACC read request is issued.
    lesson: >-
      In a full-rate three-row recurrence, both the early and immediately
      following nominal slots can be occupied by bank-0 writes; the safe
      boundary is before int2fp_result_pop, where the result FIFO can retain
      the complete transaction without changing backend latency.
  - timestamp: "2026-09-04 22:54"
    phase: mxu16_blackbox_acceptance
    status: sim_fail
    summary: >-
      Matrix case 3 attempt 2 used a freshly rebuilt simv containing the
      defer-early RTL but still stopped at 50.755 us on a same-bank collision.
    verification: >-
      build_mxu16_accept_final: ci/run_black.sh xrt-vcs-sim --app
      fpint_gemm_ffn_hw --args
      '-m 3 -n 17 -k 17 -q 32 -t 0 -d 1 -r 1'
    root_cause: >-
      FSDB at 50.755 us shows nominal_read_req=0001 and acc_mem_rd_en=0001 for
      the delayed address-0x80 read while acc_mem_wr_en=0001 writes tag 3 at
      address 0x0. This is the integrated form of the unit-test 0x2e80 versus
