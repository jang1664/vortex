    fix_applied: >-
      The current iteration holds only the proven exact-d3/d2-bank-alias FIFO
      head for one cycle, then lets the unchanged nominal backend path issue
      after both conflicting writes have advanced. Immediate/d2 forwarding
      and unrelated same-bank early reads remain unchanged.
    lesson: >-
      Rebuilding proved the initial assertion moved by one cycle rather than
      disappearing; checking both physical slots is required when changing
      fixed-latency ACC scheduling.
