pitfalls:
  - >-
    A generic buffered splitter can report wide acceptance before both physical
    bank writes commit, allowing early DMA completion.
  - >-
    The existing multi-bank mapping c+k*NUM_DMA_CHANNELS does not produce the
    required consecutive bank pairs; MXU16 must map channel c to 2*c and 2*c+1.
  - >-
    QCOL floor division loses the K=16, QBLK=32 group; all producers and the
    RTL stride calculation must use ceiling division.
  - >-
    VCS generated artifacts can be stale. Baseline and target profiles require
    separate configured build directories and a forced fresh RTL image.
  - >-
    A detached git worktree does not automatically contain ignored Bender
    checkouts or initialized submodule contents. SoftFloat must also be built
    with position-independent code before linking libxrtsim_vcs.so.
  - >-
    gemm_node_improve requires CVFPU's nested common_cells submodule even when
    the target change is in TMEM; initialize recursive RTL dependencies before
    treating a missing source as a design compile failure.
  - >-
    The same unittest also imports third_party/axi through its common FP build
    prerequisite; an empty AXI gitlink is another infrastructure failure, not
    evidence against the MXU16 RTL.
