logs:
  - time: "2026-07-18 12:19"
    entry: >
      Started from commit 7d94be50 and the approved implementation plan.
      The fpint worktree is clean. Scope is Llama2-7B B1/S32 prefill,
      correctness and launch-topology validation on real C4, with standalone
      retained as the default physical plan.
  - time: "2026-07-18 12:28"
    entry: >
      Locked the additive kernel ABI: RoPE layout mode 3 emits contiguous
      BHSD; KV quant modes 1/2 implement signed asymmetric K and signed
      symmetric V with logical qparam side buffers and source head offsets;
      QK correction layout mode 1 preserves GEMM-C. Added an out-variant of
      the GEMM core contract so per-head results can populate one aligned
      grouped buffer for fused head concat without detiling.
