pitfalls:
  - >
    gen_kernel_cfgs.py is schedule guidance, not a complete numerical ABI.
    SpinQuant requires signed INT4 K/V semantics and fractional K zero points.
  - >
    The standalone plan intentionally retains separate R3/R4 Hadamard and
    tile kernels; the fused plan writes R3/R4 results directly to GEMM-A.
  - >
    Fused tensors must never be interpreted by raw torch reshape/transpose;
    logical shape and physical layout metadata must travel together.
  - >
    Shuffle-based RMSNorm reduction is local to one Vortex hardware warp, so
    its wrapper must launch caps.num_threads rather than threads_per_block.
  - >
    Fused Hadamard scratch/barrier synchronization and the opt-warp softmax
    contract also require exactly one hardware warp per logical row on C4.
  - >
    Quantization arithmetic order is observable at half-even boundaries;
    signed KV kernels divide by scale directly to match the Torch reference.
  - >
    XRT cannot reliably read only the four-byte GEMM status field from the
    argument buffer on this platform. Copy the complete argument buffer back
    and then extract the status field, matching the regression host flow.
  - >
    Device-kernel wrapper sources such as kernel.baseline.cpp include
    kernel.cpp, but Make dependency tracking may not rebuild the vxbin after
    an included ABI change. Force kernel.vxbin and reinstall before C4 checks.
  - >
    The current GEMM MMIO ABI cannot encode logical K/N independently from a
    persistent weight stride. Decode therefore computes capacity-padded QK/PV
    extents and relies on logical-length softmax plus a zero probability tail;
    removing this extra work requires an additive GEMM stride ABI.
