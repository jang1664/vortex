pitfalls:
  - "C2 and C3 intentionally resolve to the same config file, so result naming must use the alias rather than the config stem."
  - "Synopsys cannot elaborate the Xilinx FPU_DSP path; all incoming FPU selectors must normalize to exactly FPU_FPNEW."
