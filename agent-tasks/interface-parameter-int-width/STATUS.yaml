pitfalls:
  - >-
    An interface parameter can have a constant value after elaboration while
    still lacking a width acceptable to Synopsys for shift-result sizing.
  - >-
    The synthesis log continues after the unresolved module and later crashes;
    that fatal error is secondary to the original ELAB-425.
  - >-
    hw/unittest/gemm_dma_ctrl currently references interface fields that no
    longer exist and cannot be used as a maintained regression without a
    separate testbench repair.
  - >-
    The shared build directory predates a gemm_node Makefile source-list update;
    use a fresh configured build for verification instead of modifying the
    generated Makefile directly.
  - >-
    Running configure alone does not generate build/hw/VX_config.h or
    VX_types.h; run the build-side hw config target before DPI-based unittests.
