task: simx-gemm-node
goal: SimX에 fpint_improve의 instruction-stream 기반 FPINT GEMM 가속기 기능 모델 반영
branch: fpint_improve
plan_file: /home/jaeyongjang/.claude/plans/swift-herding-cocke.md
created: 2026-04-17 12:01
state: DONE

scope:
  - GEMM node functional model (instruction stream processor)
  - MMIO routing at 0x1080 (ALLOC, STREAM, STATE)
  - 9 opcodes: DMA_LOAD/STORE, NOTIFY/WAIT (no-op), MXU_LOAD_{WEIGHT,QPARAM,INPUT}, MXU_STORE_OUTPUT, CLEAR
  - TMEM as flat byte array (256KB)
  - MXU internal state (weight/scale/zp regs, acc_mem) — dual-buffered
  - Standard FP32 accumulation (block-FP prealign NOT implemented, tolerance OK)

out_of_scope:
  - Standalone DMA node (VX_dma_node) — no kernel uses it
  - Bit-exact RTL match (approx only)
  - TMEM bank interleaving / MXU pipeline / sync register file

build_flag: always enabled (NOT gated by EXT_TCU_ENABLE; that is legacy WMMA TCU only)

stages:
  - stage: 1
    name: scaffolding
    description: GemmNode class skeleton, MMIO routing, CLEAR handler, alloc/state registers
    state: done
  - stage: 2
    name: dma
    description: DMA_LOAD/STORE strided memcpy (DRAM ↔ TMEM)
    state: done
  - stage: 3
    name: mxu_load
    description: MXU_LOAD_WEIGHT and MXU_LOAD_QPARAM (TMEM → MXU regs)
    state: done
  - stage: 4
    name: gemm_compute
    description: MXU_LOAD_INPUT — dequantized FP16×INT4 GEMM with QCOL/QROW
    state: done
  - stage: 5
    name: mxu_store
    description: MXU_STORE_OUTPUT — FP32 acc → FP16 TMEM
    state: done
  - stage: 6
    name: end_to_end
    description: fpint_gemm_ffn_hw_improve regression pass on simx
    state: done

