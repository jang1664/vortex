pitfalls:
  - ts: 2026-04-17 13:30
    issue: |
      `vx_upload_bytes` allocates with VX_MEM_READ only, but kernels that
      write back to the args struct (e.g., `arg->status = STATUS_INIT`)
      trigger an ACL violation in simx ("Memory access violation ...,
      current flags=1, access flags=2"). Test main.cpp was using
      vx_upload_bytes for args; fixed to allocate with VX_MEM_READ_WRITE.
      RTL backend does not enforce ACL so the bug was latent.

  - ts: 2026-04-17 13:30
    issue: |
      VX_config.h defines `GEMM_REG_BASE_ADDR` using Verilog underscore
      syntax (0x0000_0000_0000_1080), which is NOT valid C/C++. Do not
      include this constant; define the value directly in simx code.

  - ts: 2026-04-17 13:30
    issue: |
      `build/sim/simx/Makefile` is a deployed copy of `sim/simx/Makefile`
      (via `configure`). When adding new .cpp files, both must be updated
      OR configure re-run. Same for `build/runtime/simx/Makefile`.

