goal: >-
  Measure the MXU16 fpint_gemm_ffn_hw M=4 K=256 N=256 execution in
  xrt-vcs-sim, quantify HBM input-DMA/compute overlap, and quantify bubbles
  at the gemm_unit input and compute-fire boundaries.
scope:
  config: configs/improve_th16_tcol16_hwexp_dcache_sxbar_f16_bigmem.sh
  build: build_mxu16_accept_final4
  app: fpint_gemm_ffn_hw
  args: "-m 4 -n 256 -k 256 -q 32 -t 0 -d 0 -r 1"
assumptions:
  - The requested shape is analyzed on the current MXU16 profile.
  - QBLK=32, WTRANS=0, and QDIR=0 are the default comparison point.
  - Performance is functional RTL-simulation cycle behavior, not wall-clock simulation speed.
measurements:
  - Built-in TMEM_DMA_SCHED_PERF counters for input-load active, compute active, and their overlap.
  - GEMM_INPUT_PACKET acceptance timestamps for ingress burst bubbles.
  - GEMM_V2_COMPUTE_FIRE timestamps for actual compute issue bubbles.
iterations:
