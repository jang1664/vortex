log:
  - timestamp: "2026-07-24 15:32"
    entry: "Audited the existing decode optimization. The normal default is the groupwise kernel; layout-fused has a split persistent one-warp function. The split dispatcher currently selects that function for every persistent_mode shape, while the function ignores source QDIR/QBLK and is only correct for a one-token, one-source-group append."
  - timestamp: "2026-07-24 15:32"
    entry: "Confirmed the fairness rule: optimize both kernels as strongly as is safely justified; never degrade either implementation or substitute a deliberately naive implementation to force similar performance."
  - timestamp: "2026-07-24 15:42"
    entry: "Iteration 1 initially failed normal decode N=64 signed-asymmetric correctness with all 32 packed bytes equal to 0x77 while the stored qparams were correct. The compact noinline function used an int16 zero-point in its live SIMD quantization state, unlike the proven fused function's float zero-point. Matching the proven float-zero quantization form fixed the device code; C4-config simx passed at 46,620 core0 instructions and 77,734 cycles."
  - timestamp: "2026-07-24 15:47"
    entry: "Iteration 2 generalized the persistent correctness helper to accept runtime N/QBLK and DMA tile arguments. This fixed the N=256 K-style test, where the previous hard-coded DMA_KT=128 made the QBLK=256 scale allocation zero bytes. Host append validation now rejects QDIR!=1 or multi-group QBLK<N shapes."
  - timestamp: "2026-07-24 15:49"
    entry: "Iteration 3 exposed and fixed an existing signed-quantization hole in normal thread-group prefill at K=128,N=64. The optimized groupwise warp, thread-group, and QDIR0 paths now preserve float zero-point through quantization while storing the ABI-required int16 qparam. Decode N=64/128/256 K/V, two prefill pairs, normal multi-group, and normal QDIR0 all passed C4-config simx."
  - timestamp: "2026-07-24 15:50"
    entry: "Static verification passed: both default kernels and benchmark hosts compiled, git diff --check passed, and all 29 tools.workload.test_kernel_variants tests passed."
  - timestamp: "2026-07-24 15:55"
    entry: "C4 hardware matrix completed with all 20 normal/fused executions passing correctness. Decode fused/normal ratios were 0.936/0.956 at N=64, 0.951/0.958 at N=128, and 0.967/0.981 at N=256 for K/V. Prefill ratios were 2.301 at K=128,N=64 K-style, 1.177 at K=512,N=256 V-style, and 1.241/1.349 at K=1024,N=128 K/V."
  - timestamp: "2026-07-24 15:55"
    entry: "Final unweighted geometric means: decode 0.958x, prefill 1.459x, and all ten rows 1.134x fused/normal. Normal retired fewer instructions in every decode row, but fused had higher IPC and won the small fixed-cost decode cases. Normal was substantially faster for every measured prefill case. No implementation was degraded to influence ordering."
  - timestamp: "2026-07-24 15:58"
    entry: "Completion audit passed. QBLK>N one-group K/V edges passed for both kernels; fused main and bench hosts reject multi-group append with exit 1; both default and bench builds pass; all 29 workload tests pass; git diff --check passes; and the report contains the complete ten-row C4 matrix."
pitfalls:
  - "The old 617k-cycle fused measurements were full-mode routing errors, not evidence of an append shape performance cliff."
  - "bench_main append validation currently accepts shapes broader than the split persistent kernel's correctness domain."
  - "A runtime-N loop does not imply general QBLK/QDIR support; the split persistent reduction emits one source quantization group."
  - "For this Vortex SIMD compiler, the compact noinline signed quantization path must keep zero-point as float through quantization; an int16 live value produced correct lane-0 qparam stores but saturated every packed nibble to 7."
  - "The persistent correctness helper must use the requested DMA tile sizes; QBLK larger than a hard-coded DMA_KT can otherwise produce a zero-byte qparam allocation."
