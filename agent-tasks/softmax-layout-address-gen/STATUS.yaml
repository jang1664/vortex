pitfalls:
  - Never add address-generator intrinsics to softmax/rev2 or move the baseline counter while optimizing fused.
  - The generator returns byte addresses only; all memory traffic must remain ordinary SIMT LSU loads/stores.
  - Masked and padded output uses a second store range beginning at k_end, which may not be tile aligned.
  - A blocked pop must not create cross-unit head-of-line blocking; keep the unit on a dedicated optional execution path.
  - Configure-generated build files must be refreshed after adding kernel variants or RTL sources.
