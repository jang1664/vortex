pitfalls:
  - >-
    The synthetic C1/C3 fixture produces tied all-zero final logits and GPU
    top-1 margins of zero. Stable argmax still provides a deterministic control
    token, but this fixture cannot demonstrate robustness to a nonzero logit
    margin; preserve this limitation in the final evidence.
  - >-
    Causal masked-score checkpoints contain intentional negative infinity.
    The reference validator permits only negative-infinity mask sentinels at
    that named boundary and rejects NaN, positive infinity, or non-finite model
    state everywhere else.
  - >-
    The C1/C3 physical parameter archives are multi-gigabyte build artifacts;
    inspect manifests and stream tensors instead of copying or dumping them.
