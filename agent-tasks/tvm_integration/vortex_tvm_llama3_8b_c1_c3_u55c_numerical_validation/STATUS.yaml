summary: >-
  GPU-only acceptance evidence is complete for every successful row. C3 passes
  the full S1-S4 canonical/free matrix, persistent S1, and compiled S1. C1 S1,
  S2, and S4 canonical pass, but the backend verdict is FAIL: four independent
  S3 canonical attempts each lost one resident output element, and the first
  S4 free run timed out at 300 seconds. Fixed input/readback, resident reread,
  100,000 residual calls, repeated checkpoint graphs, and a full-resident
  canonical chain narrowed the defect to production allocation/lifetime/device
  state/launch-sequence sensitivity rather than a deterministic primitive.
  Fresh S4 canonical and free-running processes both completed, which records
  the intermittent boundary but does not erase the zero-timeout acceptance
  failure. C4 host regressions and the pinned C4 physical smoke pass. No CPU
  evidence contributes to the C1/C3 verdicts, and no RTL/FSM/xclbin changed.
