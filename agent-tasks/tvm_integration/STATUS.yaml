pitfalls:
  - Pre-scheduled IMPROVE PrimFuncs introduced before FuseOps must carry opaque op_pattern metadata; otherwise an adjacent logical quantize or tuple region can make FuseTIR attempt to fuse a non-root scheduled body.
  - Physical TVM tests must run inside the managed Slurm U55C allocation and resolve XRT_DEVICE_INDEX from ci/xrt_device_detect.sh; an unmanaged process may select a busy board even when another U55C is available.
  - The user-provided plan was untracked before implementation and must not be included accidentally in an implementation commit.
  - Host TVM LLVM and the Vortex device LLVM must remain isolated; ambient shell PATH is not authoritative.
  - Hardware execution is authoritative. simx may only diagnose a hardware failure and cannot replace a U55C result.
  - The tvm-ffi submodule must be initialized. Its Python module is skipped when tvm-ffi is included as a CMake subproject, so build.sh configures a standalone local Python FFI build without an editable install.
  - LLVM 18 reports a raw libxml2 dependency; this host requires a deterministic library directory. DNNL is unavailable and remains disabled.
  - A full xclbin path does not supply Vortex CONFIGS. Ambient stale CONFIGS caused vx_ready_wait to hang, while the pinned manifest CONFIGS passed; hardware runs must export that exact value.
  - The Vortex build tree needed configure-generated ci/blackbox.sh before ci/run_black.sh could run. The resulting untracked build products are not source changes and must not enter commits.
  - The current upstream vxbin.py uses a fixed /tmp/temp_kernel.bin scratch path, so compiler packaging must remain serial until that helper is made concurrency-safe.
  - The local build helper and runtime sidecar intentionally use this workspace's explicit Vortex root and source-tree runtime rpath. A relocatable install/package contract is future deployment work, not part of the validated local U55C flow.
  - The independent Claude adversarial review route could not authenticate in its execution context, so the adversarial lens used an in-process reviewer and has no cross-model corroboration receipt.
  - TIR script closure constants must be explicitly captured before constructing a PrimFunc; the first post-fix Relax build exposed a missing dma_kt closure variable before any hardware launch.
