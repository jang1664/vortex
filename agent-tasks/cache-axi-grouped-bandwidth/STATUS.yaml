pitfalls:
  - Never edit an executing shell script in place; Bash may resume parsing from a stale byte offset after a long command. Use immutable runner copies.
  - Current naive split-PSUM RTL requires LMEM_NUM_PORTS=32 at this geometry; apply LMEM banks32 and ports32 to every naive comparison.
  - VCS tmerge can execute procedural diagnostics speculatively before registered reset relays initialize; simulation checks require reset known low.
  - Improve PERF jobs is accumulator-write count, not invocation count; use logged app REPS and dimensions to establish equal invocations.
  - Do not replace the original requester index in read IDs with a group index.
  - Do not use NUM_BANKS_OUT in the physical address remap; use NUM_HBM_PORTS.
  - The existing wider-source memory adapter assembles chunks by arrival order; reject unsupported width geometry in this task.
  - AW acceptance alone does not release a write request whose W remains pending.
  - Existing app test scripts may contain destructive cleanup and unsupported default drivers; use the planned wrapper commands.
  - A user change to ci/fpga_bin_alias_map.yaml was already present and was not modified.
  - Do not run the naive app with an improve config or reuse mixed-profile build artifacts.
  - Do not run synthesis or collect hardware cost metrics for this task; performance reporting uses total-kernel and GEMM-node cycles only.
  - FPINT node timing uses the MXU PERF total_cycles field, not busy_cycles, compute_cycles, or final total kernel cycles.
