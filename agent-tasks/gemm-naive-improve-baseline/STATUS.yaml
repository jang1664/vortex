pitfalls:
  - "Removing packetizer_active alone exposes premature NOTIFY and does not separate packet admission from completion."
  - "packet_ctrl.last has different current naive/improve semantics; normalize packet end versus final-output mode before sharing contexts."
  - "Improve K-fast traversal creates closer same-address PSUM dependencies than naive's current N-fast traversal."
  - "An upstream LMEM write handshake is not automatically a proof of RAM visibility; define and verify the fence endpoint."
  - "Current source revision differs from the original latency report's baseline; preserve hashes and refresh baseline if changed."
  - "Existing local-DMA tests may hard-code GEMM_IMPROVE and must be adapted for backend parity."
  - "Rev2 supersedes mandatory K-fast and shared TMEM readiness scheduler requirements in PLAN.md; historical log entries do not authorize those designs."
  - "Old-payload latency counters cannot be used as rev2 pass/fail baselines after the default vector fix."
  - "Naive has one physical OBUF and PBUF; its store must wait for output-ready G1, not for its own store-done O."
  - "Active full-node reset remains unsupported; occupied component reset needs a jointly flushed response domain."
  - "Rev3 supersedes rev2's optional K-fast/static-interleave candidates. User requires fixed naive N-fast; improve traversal is unchanged."
  - "Independent S/Z DMA must not merge ordered descriptor/response retirement or writer ownership; shared physical LMEM arbitration is allowed within the existing ports/banks and payload budget."
  - "The shared-writer cycle in review.rev2 is a conditional design risk, not an observed deadlock in current naive RTL."
  - "Legacy naive/common GEMM counters have different done boundaries. Freeze normalized per-job measurement and prove FSDB agreement before creating rev3 performance baselines."
  - "The 7680-case host census covers one QCOL scale fault family; it does not prove all device lane/beat or stale-install faults are detected."
  - "User rule: commonization must not change improve latency or hardware cost. Isolate any differing implementation under ifdef GEMM_NAIVE; improve keeps its 21 counters, existing interfaces/pipeline/scheduler, and synthesized perf hardware."

