  - time: "2026-07-04 15:56"
    entry: "Fixed dma_engine unittest compile infrastructure: Makefile now uses third_party/axi axi_pkg.sv/axi_intf.sv plus axi include path, passes naive SIMD HBM remap defines, and tb timeout XMR debug uses current VX_dma_engine/VX_dma_unit_misal signal paths."
  - time: "2026-07-04 15:56"
    entry: "Verified `source configs/naive_simd.sh && make -C build/hw/unittest/dma_engine SIM_EXEC=vcs compile` passes. Follow-up `sim` reaches runtime and fails separately in case0_remap_burst_read because the test still expects old burst-reorder AR logging (expected 4, current passthrough engine emits 1 burst len=5)."
pitfalls:
  - "The timing path is in g_aligned.u_impl, not VX_dma_unit_misal."
  - "VX_pipe_buffer does not decouple ready_in from ready_out, so the timing-cut buffers must use VX_elastic_buffer SIZE=2."
  - "The dma_engine unittest compile path must include third_party/axi/src/axi_pkg.sv before axi_intf.sv; the old AXI_BUS_if.sv reference is stale."
  - "The remap unittest must define PLATFORM_MEMORY_NUM_BANKS=32 with NUM_DMA_CHANNELS=8; otherwise VX_mem_remap elaboration sees NUM_BANKS=2 and BANK_BITS-PORT_BITS becomes negative."
  - "The current dma_engine sim test expectations for remap burst AR/AW counts still match the old burst-reorder engine, not the current passthrough FSM."
