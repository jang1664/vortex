limitations:
  - FP16 arithmetic IPs still flush subnormal operands and results.
  - Existing normal/special conversion IP rounding and exception behavior is unchanged.
  - No synthesis, place-and-route, or updated FPGA bitstream was produced.
pitfalls:
  - Xilinx C_Has_UNDERFLOW enables an exception output; it does not enable gradual underflow.
  - The softmax absolute tolerance hides one of four flushed subnormal outputs.
  - Build-side diagnostic software conversion must be disabled when validating the RTL correction.
  - Existing normal-path rounding and flag limitations are outside the subnormal-only correction.
  - Derive the half-unit shift from mantissa times 2^(FP32_exp-127-23+24); its bias is 126, not 128.
  - Do not infer UF only from the final half exponent; tininess after rounding assumes an unbounded exponent range before the denormal precision reduction.
  - Force recompilation of the full-system simv after a leaf RTL edit; its make target does not list every RTL leaf as a dependency.
