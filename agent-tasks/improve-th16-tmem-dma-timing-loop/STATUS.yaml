        notes: "Prove all active old channels hold done until the last completion; chained cfg/ACTIVATE is exact-mask and atomic; the new descriptor fires on the old done edge; no S_IDLE/S_PROG bubble, partial accept, payload/ID change, drop, or duplicate completion occurs."
      - test_type: unittest
