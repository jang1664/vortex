    static_checks:
      - "Focused TH16/WLOAD8/TMEM16/HBM8 gemm_tmem_dma_ctrl VCS compile/elaboration PASS, exit 0; VCS recompiled the changed production module and elaborated the eight-module hierarchy."
      - "Focused Verilator --lint-only PASS, exit 0, with the existing TB mixed blocking/nonblocking diagnostic explicitly demoted; no Error, UNOPTFLAT, or circular-combinational warning remained."
      - "git diff --check PASS. No simulation, blackbox, testbench edit, fence, accepted bitmap, or scheduling change was performed."
    hard_rule: "None. The fix restores the intended assertion against the pre-existing authoritative sticky-or-current completion contract and preserves the confirmed no-fence atomic chaining design."
