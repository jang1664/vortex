  - id: rtl-sticky-done-assertion-fix-4
    timestamp: "2026-08-28 23:04"
    status: implemented
    role: RTL Implementation
    verification_iteration: 2
    fixes_verification: verification-th16-tmem16-stop-first-3
    action: "Corrected the Global chaining all-old-done assertion to use the controller's authoritative accumulated completion condition. No functional scheduling, ready/valid, descriptor, Output completion, or testbench logic changed."
    root_cause: "The controller intentionally accumulates staggered channel completion in done_sticky_q and defines done_all_valid as the reduction of `done_sticky_q | done_or_inactive`. The directed TB pulses early-channel done and clears it before the last channel. At 1345000 ps channel 0 was therefore authoritatively complete via done_sticky_q[0], all eight chained cfg fires occurred atomically, but the new assertion checked only current-cycle done_or_inactive[0] and falsely failed."
    fix: "Changed the per-old-channel assertion from `done_or_inactive[ch]` to `done_sticky_q[ch] || done_or_inactive[ch]`. This exactly mirrors each bit of done_all_valid, retains the all-channel completion requirement, and does not weaken the independent all-new-active-channel ready, exact-mask, full-fire, no-partial-activation, ownership, or direct-transition assertions."
    files:
      - hw/rtl/core/gemm/VX_gemm_tmem_dma_ctrl.sv
    hashes:
      VX_gemm_tmem_dma_ctrl_sha256: 56674ef74e7e7f2b9fce9709181a5e2723cea3e86fa7be2fdcd9217103d02425
