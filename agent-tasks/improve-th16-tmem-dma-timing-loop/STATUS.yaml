  - id: rtl-state-owned-ready-output-done-2
    timestamp: "2026-08-28 22:55"
    status: implemented
    action: "Implemented the confirmed Global DMA chaining and Output completion timing cuts in production RTL without changing data paths, descriptor formats, counters, or TMEM arbitration."
    files:
      - hw/rtl/core/VX_dma_unit_align.sv
      - hw/rtl/core/gemm/VX_gemm_tmem_dma_ctrl.sv
      - hw/rtl/core/gemm/VX_gemm_node.sv
    implementation:
      global_dma: "Channel cfg ready is now a registered-state/done-ready capability independent of ACTIVATE. The controller drives chained cfg valid and ACTIVATE from the selected registered candidate independent of ready, and uses the all-channel fire only for candidate retirement/foreground ownership updates. A held offer remains in S_WAIT_DONE and same-cycle chaining still enters the new command directly without S_IDLE/S_PROG."
      output_done: "The raw Output final destination write_done remains inside the DMA boundary and feeds all raw physical accounting unchanged. VX_gemm_node registers that pulse once for controller-visible done, treats the registered completion as logical ownership release, and gives a coincident new start priority over the prior delayed completion."
      assertions: "Added cfg/ACTIVATE hold stability and direct channel-state transition checks; controller all-old-done/all-new-ready, exact active mask, full atomic fire, no partial activation, candidate/descriptor hold, and direct WAIT_DONE ownership checks; and exact raw+1 Output completion, active ownership, and non-overlap checks. Existing tensor-bank and DMA destination assertions retain physical Output request stability under backpressure."
    static_checks:
      - "Configured a fresh build/timing_loop_th16_static tree after sourcing configs/improve_th16_tcol32_hwexp_dcache_sxbar_f16_bigmem_w8.sh and generated VX_config.h/VX_types.h."
      - "Focused hw/unittest/gemm_tmem_dma_ctrl VCS compile/elaboration: PASS, exit 0, 8 modules."
      - "Full hw/unittest/gemm_node_improve TH16/TMEM16/WLOAD8 VCS compile/elaboration: PASS, exit 0."
      - "Full hw/unittest/gemm_node_improve Verilator --lint-only: PASS, exit 0, 163 modules. No cfg/ACTIVATE/Global-DMA UNOPTFLAT remains. The reported output_write_flag SCC is the pre-existing idle/control path; controller-visible Output done now originates only from output_write_done_q, so the targeted raw write_done feedback edge is absent. Other reported Input/DMA/arithmetic/FP SCC warnings are pre-existing and out of scope."
      - "git diff --check and targeted stale-expression searches: PASS. No simulation or blackbox was run by RTL Implementation."
    hard_rule: "None. No fence, accepted bitmap, partial activation, descriptor staging, TMEM arbiter change, or Global chaining cycle was added."
    test_requests:
      - test_type: unittest
        test_path: hw/unittest/gemm_tmem_dma_ctrl
