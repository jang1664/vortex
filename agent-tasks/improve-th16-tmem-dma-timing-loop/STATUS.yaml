        test_path: tests/regression/fpint_gemm_ffn_hw
        test_params: "fpint_gemm M=4 N=256 K=256 QBLK=32 WTRANS=0 WLOAD8, IMPROVE TH16/TMEM16, QCOL and QROW, xrt-vcs-sim perf class 3"
        sim_tool: vcs
