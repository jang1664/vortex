learnings:
  - A single RF2_HD macro is limited to 160 data bits at mux1, so 1024 bits must be tiled.
  - The generic backend directory pattern matched DFM PM/ICC instead of the 7U1x_2T8x_LB ICC2 technology directory.
  - LPP28 BE paths must resolve to the rXpY-version directory containing lib/site.spec.
  - The 999 timing values are intentional for unsupported EMA settings; Vortex uses EMAA/EMAB 3'b100, whose timing tables contain real values.
