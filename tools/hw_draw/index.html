/* ═══════════════════════════════════════════════════════════
   PANEL
   ═══════════════════════════════════════════════════════════ */
function renderPanel() {
  const panel = document.getElementById('panel');
  panel.style.display = 'block';
  if (!selection) { panel.style.display = 'none'; return; }
  if (selection.type === 'module') renderModulePanel(panel, selection.id);
  else if (selection.type === 'instance') renderInstancePanel(panel, selection.id);
  else if (selection.type === 'connection') renderConnectionPanel(panel, selection.id);
  else if (selection.type === 'sheet') renderSheetPanel(panel);
  else if (selection.type === 'multi') renderMultiPanel(panel);
  else panel.style.display = 'none';
}

function renderSheetPanel(panel) {
  const s = sheet();
  if (!s) return;
  let h = `<h3><span>Sheet</span><button class="btn btn-sm" onclick="closePanel()">x</button></h3>`;
  h += `<label>Name</label><input value="${esc(s.name)}" onchange="sheet().name=this.value;markDirty();render()"/>`;
  h += `<label>Description</label><textarea onchange="sheet().description=this.value;markDirty();">${esc(s.description || '')}</textarea>`;
  panel.innerHTML = h;
}

function renderMultiPanel(panel) {
  const s = sheet();
  if (!s || !selection || selection.type !== 'multi') return;
  const ids = selection.ids;

  // Classify selected items
  const instIds = ids.filter(id => s.instances.some(i => i.id === id));
  const connIds = ids.filter(id => s.connections.some(c => c.id === id));

  let h = `<h3><span>Selection (${ids.length} items)</span><button class="btn btn-sm" onclick="closePanel()">x</button></h3>`;
  h += `<div style="font-size:11px;color:var(--fg2);margin-bottom:8px">`;
  if (instIds.length) h += `${instIds.length} instance(s): ${instIds.map(id => s.instances.find(i => i.id === id)?.name || id).join(', ')}<br>`;
  if (connIds.length) h += `${connIds.length} connection(s)`;
  h += `</div>`;

  // Existing annotations for this exact set of targets
  if (!s.annotations) s.annotations = [];
  const existing = s.annotations.filter(a => {
    const t = new Set(a.targets);
    return ids.length === t.size && ids.every(id => t.has(id));
  });

  h += `<label>Group Comments</label>`;
  for (let i = 0; i < s.annotations.length; i++) {
    const ann = s.annotations[i];
    const t = new Set(ann.targets);
    // Show annotations that overlap with current selection
    if (!ids.some(id => t.has(id))) continue;
    const isExact = ids.length === t.size && ids.every(id => t.has(id));
    h += `<div class="port-section">`;
    h += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">`;
    h += `<span style="font-size:10px;color:var(--fg3)">${ann.targets.length} items${isExact ? '' : ' (partial overlap)'}</span>`;
    h += `<button class="btn btn-sm btn-danger" onclick="sheet().annotations.splice(${i},1);markDirty();render()">x</button>`;
    h += `</div>`;
    h += `<textarea style="width:100%;min-height:50px" onchange="sheet().annotations[${i}].text=this.value;markDirty();renderCanvas();">${esc(ann.text || '')}</textarea>`;
    h += propsEditorHTML(ann.props || {}, `sheet().annotations[${i}].props`);
    h += `</div>`;
  }

  h += `<button class="btn btn-sm" style="margin-top:4px" onclick="addAnnotation()">+ Add group comment</button>`;

  h += `<div style="margin-top:12px;display:flex;gap:4px">`;
  h += `<button class="btn btn-sm btn-danger" onclick="deleteMultiSelection()">Delete all selected</button>`;
  h += `</div>`;

  panel.innerHTML = h;
}

function addAnnotation() {
  if (!selection || selection.type !== 'multi') return;
  const s = sheet();
  if (!s.annotations) s.annotations = [];
  s.annotations.push({ id: 'a_' + uid(), targets: [...selection.ids], text: '', props: {} });
  markDirty(); render();
}

function toggleMultiSelect(id) {
  if (selection?.type === 'multi') {
    const ids = selection.ids;
    if (ids.includes(id)) {
      const newIds = ids.filter(i => i !== id);
      if (newIds.length > 1) selection = { type: 'multi', ids: newIds };
      else if (newIds.length === 1) {
        const s = sheet();
        selection = s.instances.some(i => i.id === newIds[0]) ? { type: 'instance', id: newIds[0] } : { type: 'connection', id: newIds[0] };
      }
      else selection = null;
    } else {
      selection = { type: 'multi', ids: [...ids, id] };
    }
  } else if (selection?.type === 'instance' || selection?.type === 'connection') {
    const prevId = selection.id;
    if (prevId === id) return;
    selection = { type: 'multi', ids: [prevId, id] };
  } else {
    const s = sheet();
    selection = s.instances.some(i => i.id === id) ? { type: 'instance', id } : { type: 'connection', id };
  }
}

function deleteMultiSelection() {
  if (!selection || selection.type !== 'multi') return;
  for (const id of [...selection.ids]) {
    const s = sheet();
    if (s.instances.some(i => i.id === id)) removeInstance(id);
    else if (s.connections.some(c => c.id === id)) removeConnection(id);
  }
  selection = null; render();
}

function renderModulePanel(panel, mid) {
  const m = data.modules[mid];
  if (!m) { panel.style.display = 'none'; return; }
  let h = `<h3><span>Module: ${m.name}</span><button class="btn btn-sm" onclick="closePanel()">x</button></h3>`;
  h += `<label>Name</label><input value="${esc(m.name)}" onchange="data.modules['${mid}'].name=this.value;markDirty();render()"/>`;
  h += `<label>Description</label><textarea onchange="data.modules['${mid}'].description=this.value;markDirty();">${esc(m.description || '')}</textarea>`;
  h += `<label>Properties</label>`;
  h += propsEditorHTML(m.props, `data.modules['${mid}'].props`);
  h += `<label>Ports</label>`;
  for (let i = 0; i < m.ports.length; i++) {
    const p = m.ports[i];
    h += `<div class="port-section"><div class="port-header">`;
    const pp = `data.modules['${mid}'].ports[${i}]`;
    h += `<input style="flex:2" value="${esc(p.name)}" onchange="${pp}.name=this.value;markDirty();render()"/>`;
    h += `<select style="flex:1" onchange="${pp}.dir=this.value;markDirty();render()">`;
    for (const d of ['in', 'out', 'inout', 'interface']) h += `<option ${p.dir === d ? 'selected' : ''}>${d}</option>`;
    h += `</select>`;
    if (p.dir === 'interface') {
      h += `<select style="flex:0 0 55px" onchange="${pp}.role=this.value;markDirty();render()">`;
      h += `<option ${p.role === 'master' ? 'selected' : ''}>master</option>`;
      h += `<option ${p.role === 'slave' ? 'selected' : ''}>slave</option>`;
      h += `</select>`;
    }
    h += `<button class="btn btn-sm btn-danger" onclick="data.modules['${mid}'].ports.splice(${i},1);markDirty();render()">x</button></div>`;
    h += arrayEditorHTML(p.array, pp);
    h += propsEditorHTML(p.props, `${pp}.props`);
    h += `</div>`;
  }
  h += `<button class="btn btn-sm" style="margin-top:4px" onclick="data.modules['${mid}'].ports.push({id:'p_'+uid(),name:'new_port',dir:'in',props:{width:1}});markDirty();render()">+ port</button>`;
  h += `<button class="btn btn-sm btn-danger" style="margin-top:12px" onclick="deleteModule('${mid}')">Delete module</button>`;
  panel.innerHTML = h;
}

function renderInstancePanel(panel, iid) {
  const s = sheet();
  const inst = s.instances.find(i => i.id === iid);
  if (!inst) return;
  const ref = data.modules[inst.moduleRef];
  const ii = s.instances.indexOf(inst);
  const ip = `sheet().instances[${ii}]`;

  let h = `<h3><span>Instance: ${inst.name}</span><button class="btn btn-sm" onclick="closePanel()">x</button></h3>`;
  h += `<div style="font-size:11px;color:var(--fg2);margin-bottom:6px">Module: ${ref?.name || inst.moduleRef} | Rotation: ${inst.rotation || 0}\u00b0</div>`;
  h += `<label>Instance name</label><input value="${esc(inst.name)}" onchange="${ip}.name=this.value;markDirty();render()"/>`;
  h += `<label>Description</label><textarea onchange="${ip}.description=this.value;markDirty();">${esc(inst.description || '')}</textarea>`;
  h += `<label>Array dimensions</label>`; h += arrayEditorHTML(inst.array, ip);
  h += `<label>Instance properties</label>`; h += propsEditorHTML(inst.props, `${ip}.props`);
  h += `<label>Size</label><div style="display:flex;gap:4px;align-items:center">`;
  h += `<input type="number" style="width:60px" value="${inst.w || 170}" onchange="${ip}.w=parseInt(this.value);markDirty();render()"/> x `;
  h += `<input type="number" style="width:60px" value="${inst.h || MIN_BLOCK_H}" onchange="${ip}.h=parseInt(this.value);markDirty();render()"/></div>`;
  if (ref) {
    h += `<label>Module ports</label><div style="font-size:11px;color:var(--fg3)">`;
    for (const p of ref.ports) { const pp = Object.entries(p.props || {}).map(([k, v]) => `${k}=${v}`).join(', '); const rl = p.dir === 'interface' && p.role ? '/' + p.role : ''; h += `<div>- ${p.name}${arrayLabel(p.array)} [${p.dir}${rl}] ${pp}</div>`; }
    h += `</div>`;
    h += `<button class="btn btn-sm" style="margin-top:6px" onclick="selection={type:'module',id:'${inst.moduleRef}'};render()">Edit module definition</button>`;
  }
  h += `<button class="btn btn-sm btn-danger" style="margin-top:8px" onclick="removeInstance('${iid}')">Delete instance</button>`;
  panel.innerHTML = h;
}

function renderConnectionPanel(panel, cid) {
  const s = sheet();
  const conn = s.connections.find(c => c.id === cid);
  if (!conn) return;
  const ci = s.connections.indexOf(conn);
  const cp = `sheet().connections[${ci}]`;
  const froms = connFrom(conn), tos = connTo(conn);
  const fromLabels = froms.map(ep => resolveEP(ep)).join(', ');
  const toLabels = tos.map(ep => resolveEP(ep)).join(', ');
  const dir = connDir(conn);

  let h = `<h3><span>Connection ${froms.length}:${tos.length}</span><button class="btn btn-sm" onclick="closePanel()">x</button></h3>`;
  h += `<div style="font-size:11px;color:var(--fg2);margin-bottom:4px"><b>From:</b> ${fromLabels}</div>`;
  h += `<div style="font-size:11px;color:var(--fg2);margin-bottom:8px"><b>To:</b> ${toLabels}</div>`;

  h += `<label>Direction</label>`;
  h += `<select onchange="setConnDirection('${cid}',this.value)">`;
  for (const d of ['forward', 'reverse', 'both', 'none']) h += `<option ${dir === d ? 'selected' : ''}>${d}</option>`;
  h += `</select>`;

  // Mapping
  const mapping = conn.mapping || '1:1';
  const MAPPING_PRESETS = ['1:1', 'broadcast', 'reduction', 'crossbar', 'interleave', 'custom'];
  h += `<label>Mapping</label>`;
  h += `<select onchange="setConnMapping('${cid}',this.value)">`;
  for (const m of MAPPING_PRESETS) h += `<option ${mapping === m ? 'selected' : ''}>${m}</option>`;
  h += `</select>`;

  // Dim shapes (computed from endpoints)
  const fromShape = computeEndpointShape(froms);
  const toShape = computeEndpointShape(tos);
  if (fromShape || toShape) {
    h += `<div style="font-size:10px;color:var(--fg3);margin-top:2px">`;
    h += `From shape: [${fromShape || '?'}] → To shape: [${toShape || '?'}]`;
    h += `</div>`;
  }

  // Custom dim_map editor (only when mapping=custom)
  if (mapping === 'custom') {
    h += `<label>Dim map</label>`;
    const dm = conn.dim_map || {};
    h += `<div class="port-section">`;
    h += `<div class="prop-row"><span style="font-size:10px;color:var(--fg3);flex:0 0 80px">from_shape</span><input value="${esc(JSON.stringify(dm.from_shape || []))}" placeholder="e.g. [4, 2]" onchange="updateDimMap('${cid}','from_shape',this.value)"/></div>`;
    h += `<div class="prop-row"><span style="font-size:10px;color:var(--fg3);flex:0 0 80px">to_shape</span><input value="${esc(JSON.stringify(dm.to_shape || []))}" placeholder="e.g. [2, 4]" onchange="updateDimMap('${cid}','to_shape',this.value)"/></div>`;
    h += `<div class="prop-row"><span style="font-size:10px;color:var(--fg3);flex:0 0 80px">map</span><input value="${esc(dm.map || '')}" placeholder="e.g. transpose, reshape, stride(2)" onchange="updateDimMap('${cid}','map',this.value)"/></div>`;
    h += `</div>`;
  }

  h += `<label>Description</label><textarea onchange="${cp}.description=this.value;markDirty();">${esc(conn.description || '')}</textarea>`;
  h += `<label>Properties</label>`; h += propsEditorHTML(conn.props, `${cp}.props`);

  // Floating endpoint labels
  const allEps = [
    ...froms.map((ep, i) => ({ ep, side: 'from', idx: i })),
    ...tos.map((ep, i) => ({ ep, side: 'to', idx: i })),
  ].filter(e => e.ep.type === 'float');
  if (allEps.length) {
    h += `<label>Open endpoints</label>`;
    for (const { ep, side, idx } of allEps) {
      const arr = side === 'from' ? 'from' : 'to';
      h += `<div class="prop-row">`;
      h += `<input value="${esc(ep.label || '')}" placeholder="label (e.g. to upper level)" style="flex:1" onchange="updateFloatLabel('${cid}','${arr}',${idx},this.value)"/>`;
      h += `<button class="btn btn-sm btn-danger" onclick="removeFloatEndpoint('${cid}','${arr}',${idx})">x</button>`;
      h += `</div>`;
    }
  }

  // Add/remove endpoints
  h += `<label style="margin-top:10px">Endpoints</label>`;
  h += `<div style="font-size:11px;color:var(--fg3);margin-bottom:6px">Click a port or empty space to add an endpoint. Drag diamond to reposition.</div>`;
  h += `<div style="display:flex;gap:4px;margin-bottom:6px">`;
  h += `<button class="btn btn-sm" onclick="startAddEndpoint('${cid}','from')">+ From</button>`;
  h += `<button class="btn btn-sm" onclick="startAddEndpoint('${cid}','to')">+ To</button>`;
  h += `</div>`;

  h += `<button class="btn btn-sm btn-danger" style="margin-top:10px" onclick="removeConnection('${cid}')">Delete connection</button>`;
  panel.innerHTML = h;
}

function setConnDirection(cid, dir) {
  const conn = sheet().connections.find(c => c.id === cid);
  if (conn) { conn.direction = dir; markDirty(); renderCanvas(); }
}

function setConnMapping(cid, mapping) {
  const conn = sheet().connections.find(c => c.id === cid);
  if (!conn) return;
  conn.mapping = mapping;
  if (mapping === 'custom' && !conn.dim_map) conn.dim_map = { from_shape: [], to_shape: [], map: '' };
  if (mapping !== 'custom') delete conn.dim_map;
  markDirty(); render();
}

function updateDimMap(cid, field, value) {
  const conn = sheet().connections.find(c => c.id === cid);
  if (!conn) return;
  if (!conn.dim_map) conn.dim_map = {};
  if (field === 'map') {
    conn.dim_map.map = value;
  } else {
    try { conn.dim_map[field] = JSON.parse(value); } catch { conn.dim_map[field] = value; }
  }
  markDirty(); render();
}

function computeEndpointShape(eps) {
  // Compute the combined shape for a list of endpoints: [batch_dims...][port_array_dims...]
  // Bitwidth excluded from shape
  const shapes = [];
  for (const ep of eps) {
    if (ep.type === 'float') { shapes.push([1]); continue; }
    const s = sheet();
    const inst = s.instances.find(i => i.id === ep.inst);
    if (!inst) { shapes.push([]); continue; }
    const ref = data.modules[inst.moduleRef];
    if (!ref) { shapes.push([]); continue; }
    const port = ref.ports.find(p => p.id === ep.port);
    if (!port) { shapes.push([]); continue; }
    const dims = [];
    if (inst.array?.length) dims.push(...inst.array);  // batch dims
    if (port.array?.length) dims.push(...port.array);   // port array dims
    shapes.push(dims.length ? dims : [1]);
  }
  if (shapes.length === 1) return shapes[0].join(', ');
  // Multiple endpoints: show each
  return shapes.map(s => s.join('x')).join(' + ');
}

function updateFloatLabel(cid, side, idx, label) {
  const s = sheet();
  const conn = s.connections.find(c => c.id === cid);
  if (!conn) return;
  const eps = side === 'from' ? connFrom(conn) : connTo(conn);
  if (eps[idx]?.type === 'float') { eps[idx].label = label; markDirty(); renderCanvas(); }
}

function removeFloatEndpoint(cid, side, idx) {
  const s = sheet();
  const conn = s.connections.find(c => c.id === cid);
  if (!conn) return;
  const eps = side === 'from' ? connFrom(conn) : connTo(conn);
  eps.splice(idx, 1);
  conn[side] = eps;
  // If either side is empty, remove the whole connection
  if (!connFrom(conn).length || !connTo(conn).length) {
    s.connections = s.connections.filter(c => c.id !== cid);
    selection = null;
  }
  markDirty(); render();
}

function startAddEndpoint(cid, side) {
  // Set linking mode that adds to existing connection
  linking = { addToConn: cid, side };
  updateLinkBtn();
  renderCanvas();
}

function resolveEP(ep) {
  if (ep.type === 'float') return ep.label || '(open)';
  const s = sheet();
  const inst = s.instances.find(i => i.id === ep.inst);
  const ref = data.modules[inst?.moduleRef];
  const p = ref?.ports.find(p => p.id === ep.port);
  return (inst?.name || ep.inst) + '.' + (p?.name || ep.port);
}

/* ═══════════════════════════════════════════════════════════
   EDITORS (array, props)
   ═══════════════════════════════════════════════════════════ */
function arrayEditorHTML(arr, objPath) {
  const dims = arr || [];
  let h = '<div class="array-input">';
  for (let i = 0; i < dims.length; i++) { if (i > 0) h += '<span>x</span>'; h += `<input type="number" min="1" value="${dims[i]}" onchange="updateArrayDim(${objPath},${i},parseInt(this.value))"/>`; }
  if (dims.length < 3) h += `<button class="btn btn-sm" onclick="addArrayDim(${objPath})">+dim</button>`;
  if (dims.length > 0) h += `<button class="btn btn-sm btn-danger" onclick="removeArrayDim(${objPath})">-dim</button>`;
  return h + '</div>';
}
function addArrayDim(obj) { if (!obj.array) obj.array = []; if (obj.array.length < 3) obj.array.push(2); markDirty(); render(); }
function removeArrayDim(obj) { if (obj.array?.length > 0) obj.array.pop(); if (obj.array?.length === 0) delete obj.array; markDirty(); render(); }
function updateArrayDim(obj, idx, val) { if (obj.array && idx < obj.array.length) { obj.array[idx] = Math.max(1, val || 1); markDirty(); render(); } }

function propsEditorHTML(props, path) {
  let h = '';
  for (const [k, v] of Object.entries(props || {})) {
    const vs = typeof v === 'object' ? JSON.stringify(v) : String(v);
    h += `<div class="prop-row"><input value="${esc(k)}" placeholder="key" onchange="updatePropKey(${path},'${esc(k)}',this.value)"/><span style="color:var(--fg3);font-size:10px">:</span><input value="${esc(vs)}" placeholder="value" onchange="updatePropVal(${path},'${esc(k)}',this.value)"/><button class="btn btn-sm btn-danger" onclick="delete ${path}['${esc(k)}'];markDirty();render()">x</button></div>`;
  }
  h += `<button class="btn btn-sm" style="margin-top:2px;font-size:10px" onclick="${path}['']='';;markDirty();render()">+ property</button>`;
  return h;
}
function updatePropKey(obj, oldKey, newKey) { const val = obj[oldKey]; delete obj[oldKey]; obj[newKey] = val; markDirty(); render(); }
function updatePropVal(obj, key, rawVal) { let v = rawVal; try { v = JSON.parse(rawVal); } catch { } obj[key] = v; markDirty(); render(); }
function esc(s) { return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

/* ═══════════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════════ */
function selectModuleInSidebar(mid) {
  selection = { type: 'module', id: mid }; render();
}

function editSheet() { selection = { type: 'sheet' }; render(); }
function closePanel() { selection = null; render(); }

function addModule() {
  const id = 'm_' + uid();
  data.modules[id] = { id, name: 'NewModule', description: '', props: {}, ports: [] };
  selection = { type: 'module', id };
  markDirty(); render();
}

function deleteModule(id) {
  for (const s of data.sheets) {
    const removed = new Set(s.instances.filter(i => i.moduleRef === id).map(i => i.id));
    s.instances = s.instances.filter(i => i.moduleRef !== id);
    s.connections = s.connections.filter(c => {
      const froms = connFrom(c).filter(ep => !removed.has(ep.inst));
      const tos = connTo(c).filter(ep => !removed.has(ep.inst));
      if (!froms.length || !tos.length) return false;
      c.from = froms; c.to = tos; return true;
    });
  }
  delete data.modules[id];
  selection = null; markDirty(); render();
}

function removeInstance(iid) {
  const s = sheet();
  s.instances = s.instances.filter(i => i.id !== iid);
  // Remove connections that reference this instance (M:N aware)
  s.connections = s.connections.filter(c => {
    const froms = connFrom(c), tos = connTo(c);
    const newFroms = froms.filter(ep => ep.inst !== iid);
    const newTos = tos.filter(ep => ep.inst !== iid);
    if (!newFroms.length || !newTos.length) return false; // drop connection
    c.from = newFroms; c.to = newTos; return true;
  });
  if (selection?.type === 'instance' && selection.id === iid) selection = null;
  markDirty(); render();
}

function removeConnection(cid) {
  sheet().connections = sheet().connections.filter(c => c.id !== cid);
  selection = null; markDirty(); render();
}

function toggleLink() { linking = linking ? null : true; updateLinkBtn(); if (!linking) renderCanvas(); }
function updateLinkBtn() {
  const btn = document.getElementById('linkBtn');
  if (linking) { btn.classList.add('btn-warn'); btn.textContent = 'Cancel link'; }
  else { btn.classList.remove('btn-warn'); btn.textContent = 'Link'; }
}

/* ═══════════════════════════════════════════════════════════
   SHEET MANAGEMENT
   ═══════════════════════════════════════════════════════════ */
function switchSheet(id) { data.activeSheet = id; selection = null; linking = null; updateLinkBtn(); render(); }

function addSheet() {
  const id = 's_' + uid();
  data.sheets.push({ id, name: 'Sheet ' + (data.sheets.length + 1), description: '', instances: [], connections: [] });
  switchSheet(id); markDirty();
}

function deleteSheet(id) {
  if (data.sheets.length <= 1) return;
  const idx = data.sheets.findIndex(s => s.id === id);
  data.sheets.splice(idx, 1);
  if (data.activeSheet === id) switchSheet(data.sheets[Math.min(idx, data.sheets.length - 1)].id);
  markDirty(); render();
}

function renameSheet(id) {
  const s = data.sheets.find(s => s.id === id);
  if (!s) return;
  const name = prompt('Sheet name:', s.name);
  if (name !== null && name.trim()) { s.name = name.trim(); markDirty(); render(); }
}

/* ═══════════════════════════════════════════════════════════
   ADD INSTANCE MODAL
   ═══════════════════════════════════════════════════════════ */
let instModalState = { selectedModule: null, rows: [], acIndex: -1 };

function addInstance() {
  if (!sheet()) return;
  const mods = Object.values(data.modules);
  if (!mods.length) return alert('Create a module first (+ Module button or sidebar)');
  instModalState = { selectedModule: null, rows: [], acIndex: -1 };
  document.getElementById('instModuleInput').value = '';
  document.getElementById('instModuleList').style.display = 'none';
  document.getElementById('instRows').innerHTML = '<div style="color:var(--fg3);font-size:11px;padding:8px">Select a module above first</div>';
  document.getElementById('instOverlay').style.display = 'flex';
  setTimeout(() => document.getElementById('instModuleInput').focus(), 50);
}

function closeInstModal() { document.getElementById('instOverlay').style.display = 'none'; document.getElementById('instModuleList').style.display = 'none'; }

function filterInstModules() {
  const input = document.getElementById('instModuleInput'), list = document.getElementById('instModuleList');
  const query = input.value.toLowerCase().trim();
  const mods = Object.values(data.modules);
  const matches = query ? mods.filter(m => m.name.toLowerCase().includes(query)) : mods;
  if (!matches.length) { list.innerHTML = '<div style="padding:8px;font-size:11px;color:var(--fg3)">No matching modules</div>'; list.style.display = 'block'; instModalState.acIndex = -1; return; }
  instModalState.acIndex = -1;
  let h = '';
  matches.forEach((m, i) => { h += `<div class="autocomplete-item" data-idx="${i}" data-id="${m.id}"><span>${esc(m.name)}</span><span class="sub">${m.ports.length} ports</span></div>`; });
  list.innerHTML = h; list.style.display = 'block';
  list.querySelectorAll('.autocomplete-item').forEach(el => { el.addEventListener('click', () => selectInstModule(el.dataset.id)); });
}

function instInputKeydown(e) {
  const items = document.getElementById('instModuleList').querySelectorAll('.autocomplete-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); instModalState.acIndex = Math.min(instModalState.acIndex + 1, items.length - 1); items.forEach((el, i) => el.classList.toggle('active', i === instModalState.acIndex)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); instModalState.acIndex = Math.max(instModalState.acIndex - 1, 0); items.forEach((el, i) => el.classList.toggle('active', i === instModalState.acIndex)); }
  else if (e.key === 'Enter') { e.preventDefault(); if (instModalState.acIndex >= 0) selectInstModule(items[instModalState.acIndex].dataset.id); else if (items.length === 1) selectInstModule(items[0].dataset.id); }
  else if (e.key === 'Escape') document.getElementById('instModuleList').style.display = 'none';
}

function selectInstModule(mid) {
  const m = data.modules[mid];
  if (!m) return;
  instModalState.selectedModule = { id: mid, name: m.name };
  document.getElementById('instModuleInput').value = m.name;
  document.getElementById('instModuleList').style.display = 'none';
  if (!instModalState.rows.length) instModalState.rows.push({ name: 'u_' + m.name.toLowerCase(), moduleRef: mid, moduleName: m.name });
  else instModalState.rows.forEach((r, i) => { r.moduleRef = mid; r.moduleName = m.name; r.name = 'u_' + m.name.toLowerCase() + (i > 0 ? '_' + i : ''); });
  renderInstRows();
}

function addInstRow() {
  const sel = instModalState.selectedModule;
  if (!sel) return alert('Select a module first');
  instModalState.rows.push({ name: 'u_' + sel.name.toLowerCase() + '_' + instModalState.rows.length, moduleRef: sel.id, moduleName: sel.name });
  renderInstRows();
}

function addInstRowBatch() {
  const sel = instModalState.selectedModule;
  if (!sel) return alert('Select a module first');
  const count = prompt('Array size (e.g. 128, or 4x8 for 2D):', '4');
  if (!count) return;
  // Parse array dimensions: "128" -> [128], "4x8" -> [4,8], "4x8x2" -> [4,8,2]
  const dims = count.split(/[x,]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0);
  if (!dims.length) return alert('Invalid array size');
  const name = 'u_' + sel.name.toLowerCase();
  instModalState.rows.push({ name, moduleRef: sel.id, moduleName: sel.name, array: dims });
  renderInstRows();
}

function renderInstRows() {
  const c = document.getElementById('instRows');
  if (!instModalState.rows.length) { c.innerHTML = '<div style="color:var(--fg3);font-size:11px;padding:8px">Select a module above first</div>'; return; }
  let h = '';
  instModalState.rows.forEach((row, i) => {
    h += `<div class="inst-row"><span style="font-size:10px;color:var(--fg3);min-width:20px">${i + 1}.</span>`;
    h += `<input style="flex:2" value="${esc(row.name)}" onchange="instModalState.rows[${i}].name=this.value"/>`;
    h += `<span class="module-name">${esc(row.moduleName)}${row.array ? arrayLabel(row.array) : ''}</span>`;
    h += `<button class="btn btn-sm btn-danger" onclick="instModalState.rows.splice(${i},1);renderInstRows()">x</button></div>`;
  });
  c.innerHTML = h;
}

function commitInstances() {
  const s = sheet();
  if (!s) return;
  const rows = instModalState.rows;
  if (!rows.length) return alert('No instances to create');
  const colW = 200, rowH = 140, cols = Math.ceil(Math.sqrt(rows.length));
  let lastId;
  rows.forEach((row, i) => {
    const id = 'i_' + uid();
    const inst = { id, name: row.name, moduleRef: row.moduleRef, props: {}, x: 80 + (i % cols) * colW, y: 80 + Math.floor(i / cols) * rowH, w: 170, h: null, rotation: 0, portPositions: {} };
    if (row.array) inst.array = row.array;
    s.instances.push(inst);
    lastId = id;
  });
  closeInstModal();
  if (lastId) selection = { type: 'instance', id: lastId };
  markDirty(); render();
}

document.addEventListener('click', e => { if (!e.target.closest('.autocomplete-wrap')) { const l = document.getElementById('instModuleList'); if (l) l.style.display = 'none'; } });

/* ═══════════════════════════════════════════════════════════
   COPY FOR CLAUDE
   ═══════════════════════════════════════════════════════════ */
async function copySimpleJson() {
  try {
    if (dirty) await saveToServer();
    const f = openFiles[activeFileId];
    if (f?.path) { const r = await fetch(`/api/simple/${activeFileId}`); await navigator.clipboard.writeText(await r.text()); }
    else { await navigator.clipboard.writeText(JSON.stringify(data, null, 2)); }
    showSync("ok", "Copied simplified JSON");
  } catch (e) { console.error(e); alert('Failed: ' + e.message); }
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
initCanvas();
setupInteraction();
loadServerFiles().then(() => connectSSE());
window.addEventListener('beforeunload', e => {
  saveViewState();
  if (Object.values(openFiles).some(f => f.dirty)) e.returnValue = 'Unsaved changes';
});
</script>
