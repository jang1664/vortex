name: llama2_7b_dropout_sweep
defaults:
  app: dropout
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  warmup: 1
  iterations: 3
  xrt_device_index: 0
  blackbox_timeout: 30m

case_matrices:
  - id: dropout_hidden
    kind: dropout
    stage: elementwise
    name: dropout_hidden_n{n}
    args: "-n {n}"
    matrix:
      n: {values: [4096, 32768, 524288, 2097152, 4194304, 16777216, 33554432]}
    shape:
      size: "{n}"
      source_tensor: batch_seq_hidden

  - id: dropout_intermediate
    kind: dropout
    stage: elementwise
    name: dropout_intermediate_n{n}
    args: "-n {n}"
    matrix:
      n: {values: [11008, 88064, 1409024, 5636096, 11272192, 45088768, 90177536]}
    shape:
      size: "{n}"
      source_tensor: batch_seq_intermediate
