name: llama2_7b_vector_kernels
defaults:
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  warmup: 1
  iterations: 3
  xrt_device_index: 0

# Raw-DB sweep for Llama2-7B non-GEMM kernels.
# Covered dimensions:
#   prefill:    batch in {1, 8}, seq in {128, 512, 1024}
#   generation: batch in {1, 8}, kv_len in {128, 512, 1024, 2048, 4096}
# The scalar elementwise kernels only take "-n", so this suite records the
# unique sizes produced by those batch/sequence combinations.
case_matrices:
  - id: rmsnorm
    app: rmsnorm
    kind: rmsnorm
    stage: vector
    name: rmsnorm_b{batch}_s{seq}
    args: "-batch {batch} -seq {seq} -hidden 4096"
    matrix:
      batch: {values: [1, 8]}
      seq: {values: [1, 128, 512, 1024]}
    shape:
      batch: "{batch}"
      seq: "{seq}"
      hidden: 4096

  - id: rope_prefill
    app: rope
    kind: rope
    stage: prefill
    name: rope_prefill_b{batch}_s{seq}
    args: "-batch {batch} -seq {seq} -heads 32 -headdim 128 -maxseq 4096 -offset 0"
    matrix:
      batch: {values: [1, 8]}
      seq: {values: [128, 512, 1024]}
    shape:
      batch: "{batch}"
      seq: "{seq}"
      heads: 32
      headdim: 128
      maxseq: 4096
      offset: 0

  - id: softmax_prefill
    app: softmax
    kind: softmax
    stage: prefill
    name: softmax_prefill_b{batch}_s{seq}
    args: "-batch {batch} -heads 32 -seqq {seq} -seqk {seq} -mask 1"
    matrix:
      batch: {values: [1, 8]}
      seq: {values: [128, 512, 1024]}
    shape:
      batch: "{batch}"
      heads: 32
      seqq: "{seq}"
      seqk: "{seq}"
      mask: 1

  - id: softmax_generation
    app: softmax
    kind: softmax
    stage: generation
    name: softmax_generation_b{batch}_kv{kv_len}
    args: "-batch {batch} -heads 32 -seqq 1 -seqk {kv_len} -mask 0"
    matrix:
      batch: {values: [1, 8]}
      kv_len: {values: [128, 512, 1024, 2048, 4096]}
    shape:
      batch: "{batch}"
      heads: 32
      seqq: 1
      seqk: "{kv_len}"
      mask: 0

  - id: rope_generation
    app: rope
    kind: rope
    stage: generation
    name: rope_generation_b{batch}_kv{kv_len}
    args: "-batch {batch} -seq 1 -heads 32 -headdim 128 -maxseq 4096 -offset {offset}"
    matrix:
      batch: {values: [1, 8]}
      kv_len: {values: [128, 512, 1024, 2048, 4096]}
    derived:
      offset: "kv_len - 1"
    shape:
      batch: "{batch}"
      seq: 1
      heads: 32
      headdim: 128
      maxseq: 4096
      offset: "{offset}"

  - id: eladd
    app: eladd
    kind: eladd
    stage: vector
    name: eladd_n{n}
    args: "-n {n}"
    matrix:
      n: {values: [4096, 32768, 524288, 2097152, 4194304, 16777216, 33554432]}
    shape:
      size: "{n}"

  - id: silu
    app: silu
    kind: silu
    stage: vector
    name: silu_n{n}
    args: "-n {n}"
    matrix:
      n: {values: [11008, 88064, 1409024, 5636096, 11272192, 45088768, 90177536]}
    shape:
      size: "{n}"

  - id: elmul
    app: elmul
    kind: elmul
    stage: vector
    name: elmul_n{n}
    args: "-n {n}"
    matrix:
      n: {values: [11008, 88064, 1409024, 5636096, 11272192, 45088768, 90177536]}
    shape:
      size: "{n}"
