name: llama2_7b_elreduce_sweep
defaults:
  app: elreduce
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  warmup: 1
  iterations: 3
  xrt_device_index: 0
  blackbox_timeout: 30m
  blackbox_args:
    - --cores=1
    - --threads=8

case_matrices:
  - id: elreduce_hidden
    kind: elreduce
    stage: reduction
    name: elreduce_{op}_hidden_b{batch}_s{seq}
    args: "-b {rows} -r 4096 -op {op}"
    matrix:
      op: {values: [mean, sum, max, min]}
      batch: {values: [1, 8]}
      seq: {values: [1, 128, 512, 1024]}
    derived:
      rows: "batch * seq"
    shape:
      op: "{op}"
      batch: "{batch}"
      seq: "{seq}"
      rows: "{rows}"
      reduce_dim: 4096

  - id: elreduce_intermediate
    kind: elreduce
    stage: reduction
    name: elreduce_{op}_intermediate_b{batch}_s{seq}
    args: "-b {rows} -r 11008 -op {op}"
    matrix:
      op: {values: [mean, sum, max, min]}
      batch: {values: [1, 8]}
      seq: {values: [1, 128, 512, 1024]}
    derived:
      rows: "batch * seq"
    shape:
      op: "{op}"
      batch: "{batch}"
      seq: "{seq}"
      rows: "{rows}"
      reduce_dim: 11008
