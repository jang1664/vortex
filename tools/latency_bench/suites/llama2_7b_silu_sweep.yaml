name: llama2_7b_silu_sweep
defaults:
  app: silu
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  warmup: 1
  iterations: 3
  xrt_device_index: 0
  blackbox_timeout: 30m
  blackbox_args:
    - --cores=1
    - --threads=8

case_matrices:
  - id: silu
    kind: silu
    stage: ffn
    name: silu_n{n}
    args: "-n {n}"
    matrix:
      n: {values: [11008, 88064, 1409024, 5636096, 11272192, 45088768, 90177536]}
    shape:
      size: "{n}"
      source_tensor: batch_seq_intermediate
