name: llama2_7b_rope_sweep
defaults:
  app: rope
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  warmup: 1
  iterations: 3
  xrt_device_index: 0
  blackbox_timeout: 30m
  blackbox_args:
    - --cores=1
    - --threads=8

case_matrices:
  - id: rope_prefill
    kind: rope
    stage: prefill
    name: rope_prefill_b{batch}_s{seq}
    args: "-batch {batch} -seq {seq} -heads 32 -headdim 128 -maxseq 4096 -offset 0"
    matrix:
      batch: {values: [1, 8]}
      seq: {values: [128, 512, 1024]}
    shape:
      batch: "{batch}"
      seq: "{seq}"
      heads: 32
      headdim: 128
      maxseq: 4096
      offset: 0

  - id: rope_generation
    kind: rope
    stage: generation
    name: rope_generation_b{batch}_kv{kv_len}
    args: "-batch {batch} -seq 1 -heads 32 -headdim 128 -maxseq 4096 -offset {offset}"
    matrix:
      batch: {values: [1, 8]}
      kv_len: {values: [128, 512, 1024, 2048, 4096]}
    derived:
      offset: "kv_len - 1"
    shape:
      batch: "{batch}"
      seq: 1
      heads: 32
      headdim: 128
      maxseq: 4096
      offset: "{offset}"
