name: llama2_7b_generation_C4_alone
defaults:
  warmup: 1
  iterations: 3
  app: fpint_gemm_ffn_hw
  fpga_bin: improve_th32_tcol32_hwexp_dcache
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1

fpga_bins:
  default: C4

  by_backend:
    fpint_gemm_improve: C4

  by_app:
    fpint_gemm_ffn_hw: C4
    fpint_gemm_ffn_hw_naive: C3
    rmsnorm: C4
    rope: C4
    softmax: C4
    hadamard: C4
    silu: C4
    eladd: C4
    elmul: C4
    tile_input_a: C4
    detile_output: C4
    kv_cache_quant_w4a16: C4
    tile_weight_w4a16: C4
    tile_scale_zp_w4a16: C4
    head_concat: C4

workloads:
  - id: llama2_7b_generation_C4_alone
    model: llama2-7b
    stage: generation
    variant: all_fpint_gemm_improve_alone_layout_spinquant
    implemented_only: false
    matrix:
      batch: {values: [1, 2, 4, 8]}
      gen_kv_len: {values: [512, 1024, 2048, 4096]}
      qblk: 32
