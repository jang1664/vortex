name: llama3p2_1b_prefill_C2
defaults:
  warmup: 1
  iterations: 3
  app: sgemm_tcu
  fpga_bin: tcu_th32_c1
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1

fpga_bins:
  default: C1

  by_backend:
    sgemm_tcu: C1
    fpint_gemm_naive: C4

  by_app:
    fpint_gemm_ffn_hw: C4
    fpint_gemm_ffn_hw_naive: C3
    rmsnorm: C1
    rope: C1
    softmax: C1
    silu: C1
    eladd: C1
    elmul: C1

workloads:
  - id: llama3p2_1b_prefill_C2
    model: llama3p2-1b
    stage: prefill
    variant: attn_sgemm_tcu_fpint_gemm_naive_spinquant
    implemented_only: false
    matrix:
      batch: {values: [1]}
      prefill_seq_len: {values: [512, 1024, 2048, 4096]}
      qblk: 32
