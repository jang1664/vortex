name: llama3_8b_generation_C2
defaults:
  warmup: 1
  iterations: 3
  app: sgemm_tcu
  fpga_bin: naive_simd
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  blackbox_args:
    - --cores=1
    - --threads=8

fpga_bins:
  default: naive_simd

  by_backend:
    sgemm_tcu: naive_simd
    fpint_gemm_naive: naive_gemm_tcol32

  by_app:
    rmsnorm: naive_simd
    rope: naive_simd
    softmax: improve_no_tcu_lut_fexp
    silu: naive_simd
    eladd: naive_simd
    elmul: naive_simd

workloads:
  - id: llama3_8b_generation_C2
    model: llama3-8b
    stage: generation
    variant: attn_sgemm_tcu_fpint_gemm_naive_spinquant
    implemented_only: false
    matrix:
      batch: {values: [1, 2, 4, 8]}
      gen_kv_len: {values: [512, 1024, 2048, 4096]}
      qblk: 32
