name: llama2_7b_prefill_C4_alone
defaults:
  warmup: 1
  iterations: 3
  app: fpint_gemm_ffn_hw
  fpga_bin: naive_simd
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  blackbox_args:
    - --cores=1
    - --threads=8

fpga_bins:
  default: naive_simd

  by_backend:
    fpint_gemm_improve: improve_tcol32

  by_app:
    rmsnorm: naive_simd
    rope: naive_simd
    softmax: naive_simd
    silu: naive_simd
    eladd: naive_simd
    elmul: naive_simd
    tile_input_a: naive_simd
    detile_output: naive_simd
    tile_weight_w4a16: naive_simd
    head_concat: naive_simd

workloads:
  - id: llama2_7b_prefill_C4_alone
    model: llama2-7b
    stage: prefill
    variant: all_fpint_gemm_improve_alone_layout
    implemented_only: false
    matrix:
      # batch: {values: [1, 8, 64]}
      # prefill_seq_len: {values: [512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]}
      batch: {values: [1]}
      prefill_seq_len: {values: [8]}
      qblk: 32
