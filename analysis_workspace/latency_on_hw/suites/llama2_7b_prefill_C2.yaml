name: llama2_7b_prefill_C2
defaults:
  warmup: 1
  iterations: 3
  app: sgemm_tcu
  fpga_bin: naive_simd
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  blackbox_args:
    - --cores=1
    - --threads=8

fpga_bins: 
  default: naive_simd
 
  by_backend: 
    sgemm_tcu: naive_simd 
    fpint_gemm_naive: naive_gemm_tcol32
 
  by_app: 
    rmsnorm: naive_simd 
    rope: naive_simd 
    softmax: naive_simd 
    silu: naive_simd
    eladd: naive_simd
    elmul: naive_simd

workloads:
  - id: llama2_7b_prefill_C2
    model: llama2-7b
    stage: prefill
    variant: attn_sgemm_tcu_fpint_gemm_naive_spinquant
    implemented_only: false
    matrix:
      # batch: {values: [1, 8, 64]}
      # prefill_seq_len: {values: [512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]}
      batch: {values: [1]}
      prefill_seq_len: {values: [32]}
      qblk: 32
