name: llama2_7b_generation_C1
defaults:
  warmup: 1
  iterations: 3
  app: sgemm_tcu
  fpga_bin: naive_simd
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1
  blackbox_args:
    - --cores=1
    - --threads=8

fpga_bins:
  default: naive_simd

  by_backend:
    sgemm_tcu: naive_simd

  by_app:
    rmsnorm: naive_simd
    rope: naive_simd
    softmax: naive_simd
    silu: naive_simd
    eladd: naive_simd
    elmul: naive_simd

workloads:
  - id: llama2_7b_generation_C1
    model: llama2-7b
    stage: generation
    variant: all_sgemm_tcu_spinquant
    implemented_only: false
    matrix:
      batch: {values: [1, 2]}
      gen_kv_len: {values: [32, 64]}
      qblk: 32
