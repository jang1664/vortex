name: llama3p2_3b_generation_C4_alone
defaults:
  warmup: 1
  iterations: 3
  app: fpint_gemm_ffn_hw
  fpga_bin: improve_th32_tcol32_hwexp_dcache
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1

fpga_bins:
  default: C1

  by_backend:
    fpint_gemm_improve: C4

  by_app:
    fpint_gemm_ffn_hw: C4
    fpint_gemm_ffn_hw_naive: C3
    rmsnorm: C1
    rope: C1
    softmax: C1
    hadamard: C1
    silu: C1
    eladd: C1
    elmul: C1
    tile_input_a: C1
    detile_output: C1
    kv_cache_quant_w4a16: C1
    tile_weight_w4a16: C1
    tile_scale_zp_w4a16: C1
    head_concat: C1

workloads:
  - id: llama3p2_3b_generation_C4_alone
    model: llama3p2-3b
    stage: generation
    variant: all_fpint_gemm_improve_alone_layout_spinquant
    implemented_only: false
    matrix:
      batch: {values: [1]}
      gen_kv_len: {values: [512, 1024, 2048, 4096]}
      qblk: 32
