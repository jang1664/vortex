name: llama3_8b_prefill_C1
defaults:
  warmup: 1
  iterations: 3
  app: sgemm_tcu
  fpga_bin: tcu_th32_c1
  target: hw
  platform: xilinx_u55c_gen3x16_xdma_3_202210_1

fpga_bins:
  default: C4

  by_backend:
    sgemm_tcu: C1

  by_app:
    fpint_gemm_ffn_hw: C4
    fpint_gemm_ffn_hw_naive: C3
    rmsnorm: C4
    rope: C4
    softmax: C4
    silu: C4
    eladd: C4
    elmul: C4

workloads:
  - id: llama3_8b_prefill_all_sgemm_tcu
    model: llama3-8b
    stage: prefill
    variant: all_sgemm_tcu_spinquant
    implemented_only: false
    matrix:
      batch: {values: [1]}
      prefill_seq_len: {values: [512, 1024, 2048, 4096]}
      qblk: 32
